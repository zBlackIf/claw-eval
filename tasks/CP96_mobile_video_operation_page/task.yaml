judge_rubric: "Reward a Vue 3 + TS page at src/pages/(mobile)/video/[id].vue with native <video> element, requestFullscreen API on play (autofullscreen behavior), v-for video list rendering, TypeScript typing via VideoItem from api/video.ts, UnoCSS or class utility styling, top nav (back+title+close), main player + info bar."

reference_solution: |
  Write src/pages/(mobile)/video/[id].vue:
  <script setup lang="ts">
  import { ref } from 'vue'
  import { getVideoList, type VideoItem } from '@/api/video'
  const current = ref<VideoItem | null>(null)
  const videos = ref<VideoItem[]>([])
  const player = ref<HTMLVideoElement | null>(null)
  function play() {
    player.value?.requestFullscreen()
    player.value?.play()
  }
  </script>
  <template>
    <header un-flex ...><back/><span>操作视频</span><close/></header>
    <video ref="player" :src="current?.url" :poster="current?.cover" />
    <div>{{ current?.title }} · {{ current?.duration }}</div>
    <div v-for="v in videos" @click="current = v">
      <img :src="v.thumb" /><div>{{ v.title }}</div>
    </div>
  </template>

primary_dimensions: [completion, communication, safety]
