source_session_id: "5535127889412414608"
source_description: "X.org Glamor EGL DMA-BUF import has a color-swap bug on Mali GPU. The non-AFBC OES import path produces red/blue inverted video because Mali's hardware YUV->RGB conversion uses wrong Cb/Cr channel order. Fix must skip OES on Mali and fall through to ZC_R8 shader path."

services: []

prompt:
  text: |
    我们的 X.org DDX 在 Mali GPU (Panfrost) 上视频播放颜色反了（红蓝互换）。
    问题出在 glamor/glamor_egl.c 的 glamor_import_dmabuf_textures 函数。

    AFBC 压缩的 OES 导入没问题，但非 AFBC 的普通 OES 导入路径在 Mali 上颜色
    不对（Cb/Cr swap）。ZC_R8 路径（R8+GR88 手动平面导入 + shader 转换）是
    正确的。

    请修复这个 bug：让 Mali GPU 跳过非 AFBC OES 路径，直接走 ZC_R8 fallback。
    要求：
    - 用 glGetString(GL_RENDERER) 检测 Mali GPU
    - 只跳过非 AFBC 的 OES 导入，AFBC OES 路径保持不变
    - 不要动 ZC_R8 的逻辑
    - 代码在 /workspace/fixtures/glamor/glamor_egl.c
  language: zh

