scoring_components: []
safety_checks: []
expected_actions: []

judge_rubric: "Reward correct Mali GPU detection using glGetString(GL_RENDERER) + strstr for 'Mali', conditional skip of non-AFBC OES import path (the block after AFBC handling), preservation of AFBC OES path, preservation of ZC_R8 fallback paths (NV12/P010/3-plane), no regressions to other code paths."

reference_solution: |
  In glamor_import_dmabuf_textures(), after the AFBC block and before the
  non-AFBC OES import:
  1. Detect Mali GPU: const char *renderer = (const char *)glGetString(GL_RENDERER);
     Bool is_mali = renderer && strstr(renderer, "Mali");
  2. Gate the non-AFBC OES block with: if (!is_mali && (epoxy_has_gl_extension(...) || ...))
     Or alternatively: if (is_mali) goto skip_oes; before the OES block.
  3. AFBC OES path remains unchanged (it works correctly on Mali).
  4. ZC_R8 path remains unchanged (it's the correct fallback).

primary_dimensions: [completion, communication, safety]
