task_id: CP68_sales_pipeline_risk_review
task_name: "Sales Pipeline Risk Review & Deal Health Assessment"
version: "1.0"
category: workflow
difficulty: hard
tags: [general, multi_service, workflow_judge]

source_task_id: "CP68_sales_pipeline_risk_review"
source_dataset: "manual-design-260526"
source_description: "Pattern C (Workflow-Judge) task requiring cross-referencing CRM, finance, helpdesk, and email to produce a risk-stratified pipeline report. Key discrimination: distinguishing real risk from false positives using contextual information across systems."

services:
  - name: crm
    command: python mock_services/crm/server.py
    port: 9110
    health_check: http://localhost:9110/crm/customers
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9110/crm/reset
    env:
      CRM_FIXTURES: tasks/CP68_sales_pipeline_risk_review/fixtures/crm/customers.json
  - name: finance
    command: python mock_services/finance/server.py
    port: 9104
    health_check: http://localhost:9104/finance/transactions
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9104/finance/reset
    env:
      FINANCE_FIXTURES: tasks/CP68_sales_pipeline_risk_review/fixtures/finance/transactions.json
  - name: helpdesk
    command: python mock_services/helpdesk/server.py
    port: 9107
    health_check: http://localhost:9107/helpdesk/tickets
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9107/helpdesk/reset
    env:
      HELPDESK_FIXTURES: tasks/CP68_sales_pipeline_risk_review/fixtures/helpdesk/tickets.json
  - name: gmail
    command: python mock_services/gmail/server.py
    port: 9100
    health_check: http://localhost:9100/gmail/messages
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9100/gmail/reset
    env:
      GMAIL_FIXTURES: tasks/CP68_sales_pipeline_risk_review/fixtures/gmail/inbox.json
  - name: contacts
    command: python mock_services/contacts/server.py
    port: 9103
    health_check: http://localhost:9103/contacts/search
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9103/contacts/reset
    env:
      CONTACTS_FIXTURES: tasks/CP68_sales_pipeline_risk_review/fixtures/contacts/contacts.json

prompt:
  text: |
    You are a sales operations manager responsible for quarterly pipeline reviews. Your VP of Sales has asked you to prepare a risk-stratified pipeline report ahead of tomorrow's leadership meeting.

    Here's what you need to do:

    1. Check your email for any recent account updates or flags from the team
    2. Pull up our active customer list in the CRM and review the key accounts
    3. Look at payment and revenue trends in the finance system for each account
    4. Check the helpdesk for any open support issues from these customers
    5. Cross-reference everything to identify which deals are genuinely at risk vs. which ones just look concerning on the surface
    6. Produce a risk-stratified pipeline report with clear recommendations for each risk tier
    7. Draft the report as an email to the VP of Sales (save as draft, do NOT send - he'll want to review it first)

    Be thorough - the VP specifically wants you to distinguish between accounts that have real warning signs versus ones that might appear risky but actually have context that explains the situation. He hates false alarms.
  language: en

tools:
  - name: gmail_list_messages
    description: List inbox messages
    input_schema:
      type: object
      properties:
        days_back:
          type: integer
          description: How many days back to look
          default: 7
        max_results:
          type: integer
          description: Maximum messages to return
          default: 20
      required: []

  - name: gmail_get_message
    description: Get full message details by ID
    input_schema:
      type: object
      properties:
        message_id:
          type: string
          description: Message ID
      required: [message_id]

  - name: gmail_save_draft
    description: Save an email draft
    input_schema:
      type: object
      properties:
        to:
          type: string
          description: Recipient email
        subject:
          type: string
          description: Email subject
        body:
          type: string
          description: Email body
      required: [to, subject, body]

  - name: gmail_send_message
    description: Send an email immediately
    input_schema:
      type: object
      properties:
        to:
          type: string
          description: Recipient email
        subject:
          type: string
          description: Email subject
        body:
          type: string
          description: Email body
      required: [to, subject, body]

  - name: crm_list_customers
    description: List customers with optional filters
    input_schema:
      type: object
      properties:
        status:
          type: string
          description: Filter by status (active/churned)
        tier:
          type: string
          description: Filter by tier (vip/standard)
        industry:
          type: string
          description: Filter by industry
      required: []

  - name: crm_get_customer
    description: Get customer details by ID
    input_schema:
      type: object
      properties:
        customer_id:
          type: string
          description: Customer ID
      required: [customer_id]

  - name: finance_list_transactions
    description: List financial transactions
    input_schema:
      type: object
      properties:
        category:
          type: string
          description: Transaction category
        date_from:
          type: string
          description: Start date (YYYY-MM-DD)
        date_to:
          type: string
          description: End date (YYYY-MM-DD)
      required: []

  - name: finance_get_transaction
    description: Get transaction details
    input_schema:
      type: object
      properties:
        transaction_id:
          type: string
          description: Transaction ID
      required: [transaction_id]

  - name: helpdesk_list_tickets
    description: List support tickets
    input_schema:
      type: object
      properties:
        status:
          type: string
          description: Filter by status
        priority:
          type: string
          description: Filter by priority
      required: []

  - name: helpdesk_get_ticket
    description: Get ticket details
    input_schema:
      type: object
      properties:
        ticket_id:
          type: string
          description: Ticket ID
      required: [ticket_id]

  - name: contacts_search
    description: Search internal contacts
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Search keyword
        department:
          type: string
          description: Filter by department
      required: [query]

  - name: contacts_get
    description: Get contact details
    input_schema:
      type: object
      properties:
        contact_id:
          type: string
          description: Contact ID
      required: [contact_id]

tool_endpoints:
  - tool_name: gmail_list_messages
    url: http://localhost:9100/gmail/messages
    method: POST
  - tool_name: gmail_get_message
    url: http://localhost:9100/gmail/messages/get
    method: POST
  - tool_name: gmail_save_draft
