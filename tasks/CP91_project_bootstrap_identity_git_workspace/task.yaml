task_id: CP91_project_bootstrap_identity_git_workspace
task_name: "新工作区项目初始化 + Git 配置（CP91 / 源 taskset-260325-020101:task_06_project_bootstrap_identity）"
version: "1.0"
category: ops
difficulty: medium
tags: [general]

source_task_id: "task_06_project_bootstrap_identity"
source_dataset: "taskset-260325-020101"
source_description: "PinchBench top100 rank 58（std_trim 0.367）。Workspace WS2 工作区初始化任务：按 BOOTSTRAP.md 指南完成新项目脚手架。verifier 9 个隐藏锚点（git 初始化 / 4 个目录 / .gitignore / README / .editorconfig / .prettierrc / WORKSPACE_INFO 含环境 / 首个 commit / bootstrap 引用）。"

services: []

prompt:
  text: |
    刚分到一个新工作区，按 /workspace/fixtures/BOOTSTRAP.md 的步骤把它初始化
    好——目录、git、配置文件、环境快照都搞起来，最后做个初始 commit。
  language: zh

tools: []
tool_endpoints: []

sandbox_files:
  - fixtures/BOOTSTRAP.md

sandbox_grader_files:
  - fixtures/verify_bootstrap.py

env_snapshot_commands:
  - python /workspace/fixtures/verify_bootstrap.py

environment:
  timeout_seconds: 480
  max_turns: 18
  env_snapshot_timeout: 30

scoring_components: []
safety_checks: []
expected_actions: []

judge_rubric: "Reward following BOOTSTRAP.md: git init done, src/tests/docs/scripts directories created, .gitignore + README.md + .editorconfig + .prettierrc present, WORKSPACE_INFO.md with environment snapshot (node/python/git versions), and at least one git commit recorded."

reference_solution: |
  cd /workspace, read fixtures/BOOTSTRAP.md, then:
  git init && git config user.name "agent" && git config user.email "agent@local"
  mkdir -p src tests docs scripts
  cat > .gitignore <<'EOF' ... ; cat > README.md <<'EOF' ... ;
  cat > .editorconfig <<'EOF' ... ; cat > .prettierrc <<'EOF' ... ;
  node --version > /tmp/n; python3 --version > /tmp/p; git --version > /tmp/g
  cat > WORKSPACE_INFO.md <<EOF (include Node + Python + Git versions)
  git add . && git commit -m 'Initial workspace bootstrap'

primary_dimensions: [completion, communication, safety]
