judge_rubric: "Reward correct API level guards using Build.VERSION.SDK_INT >= 34 (or UPSIDE_DOWN_CAKE) around all API 34+ features (foregroundServiceType, registerScreenCaptureCallback, addScreenRecordingCallback). Reward replacing lateinit with safe defaults/fallback pattern for versionEnforcer, featureFlagRepository, premiumGate. Reward adding EncryptedSharedPreferences try-catch with plain SharedPreferences fallback. Penalize incomplete guards or solutions that only fix some of the issues."

reference_solution: |
  1. OverlayForegroundController.kt: Add `if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE)` check.
     - API 34+: `service.startForeground(id, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)`
     - Below: `service.startForeground(id, notification)`
  2. HyperIsleApp.kt:
     - Replace `lateinit var versionEnforcer` with `var versionEnforcer: VersionEnforcer = FallbackVersionEnforcer()` (same for premiumGate, featureFlagRepository)
     - Create FallbackVersionEnforcer that returns Allowed
     - Wrap createEncryptedPrefs() in try-catch, fallback to context.getSharedPreferences(...)
  3. ScreenCaptureDetectorActivity.kt: In onCreate, check SDK_INT >= 34, else finish()
  4. OverlayScreenRecordingController.kt: In startMonitoring(), early return if SDK_INT < 34

primary_dimensions: [completion, communication, safety]
