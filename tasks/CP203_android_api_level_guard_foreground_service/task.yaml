services: []

prompt:
  text: |
    HyperIsle2 uygulaması compileSdk=36 ve minSdk=26 ile derleniyor ama birkaç
    kritik uyumluluk sorunu var. Android 9 (API 28) cihazlarda (özellikle Huawei)
    uygulama crash oluyor. Düzeltmen gerekenler:

    1. OverlayForegroundController — `FOREGROUND_SERVICE_TYPE_SPECIAL_USE` parametresi
       API 34+ gerektiriyor. API 34 altında sade `startForeground(id, notification)`
       kullanılmalı, üstünde typed versiyon. Build.VERSION.SDK_INT kontrolü ekle.

    2. HyperIsleApp — `lateinit var versionEnforcer` ve diğer lateinit değişkenler
       `initializeFeatureControl()` exception fırlatırsa initialize edilmeden kalıyor.
       lateinit yerine safe default (fallback) pattern kullan. Ayrıca
       `createEncryptedPrefs()` Huawei'de KeyStore hatası veriyor — try/catch ile
       plain SharedPreferences fallback ekle.

    3. ScreenCaptureDetectorActivity — `registerScreenCaptureCallback` API 34+
       gerektiriyor. API 34 altında activity kendini finish() ile kapatmalı.

    4. OverlayScreenRecordingController — `addScreenRecordingCallback` API 34+.
       API 34 altında early return yap.

    Proje /workspace/fixtures/hyperisle-app/ altında.
