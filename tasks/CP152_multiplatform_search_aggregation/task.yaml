  - fixtures/ecommerce-app/package.json
  - fixtures/ecommerce-app/src/api/goods.ts
  - fixtures/ecommerce-app/src/utils/request.ts
  - fixtures/ecommerce-app/src/pages/search/index.vue
  - fixtures/ecommerce-app/src/components/GoodsCard.vue

sandbox_grader_files:
