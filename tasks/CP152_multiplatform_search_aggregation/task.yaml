env_snapshot_commands:
  - python /workspace/fixtures/verify_solution.py

environment:
  timeout_seconds: 600
  max_turns: 18
  env_snapshot_timeout: 30

scoring_components: []
safety_checks: []
expected_actions: []

judge_rubric: "Reward complete multi-platform search aggregation: platform tabs (全部/淘宝/京东/拼多多) with switch logic, concurrent Promise.allSettled for all-platform mode (3 items per platform), platform badge/indicator with distinct colors, infinite scroll with page increment for single-platform mode, correct merge logic branching on platform=0 vs specific platform."

reference_solution: |
  In src/pages/search/index.vue:
  - Add platform tabs (全部/淘宝/京东/拼多多) with v-for and currentPlatform state
  - handleSearch branches:
    - If currentPlatform === 0 (全部): use Promise.allSettled to call searchGoods
      3 times with platform=1,2,3 and size=3, merge results with spread/concat
    - If currentPlatform === 1/2/3: call searchGoods with that platform, size=20, page state
  - Add scroll-view with @scrolltolower or onReachBottom for infinite scroll
  - page.value++ when loading more, hasMore computed from total vs loaded
  - Platform badge in goods card template: v-if platform===1 shows "淘宝" in orange,
    platform===2 shows "京东" in red, platform===3 shows "拼多多" in a different red/pink
  - Loading state, empty state, error handling

primary_dimensions: [completion, communication, safety]
