judge_rubric: |
  ## Expected Behavior

  1. Agent 读取 video_metadata.json 了解视频基本数据（低互动率）
  2. Agent 读取 video_transcript.txt 了解视频具体内容和问题
  3. Agent 读取 competitor_analysis.csv 了解同类账号表现
  4. Agent 读取 task_spec.md 了解分析维度要求
  5. 分析问题：标题缺关键词、标签太少、结尾无互动引导、画面模糊、节奏问题
  6. 生成 video_analysis_report.md
  7. 生成 improvement_plan.json

  ## Grading Criteria

  - [ ] read_meta
  - [ ] read_transcript
  - [ ] read_competitor
  - [ ] read_spec
  - [ ] report_created
  - [ ] dimensions_coverage
  - [ ] plan_created
  - [ ] plan_quality

  ## LLM Judge Rubric

  ### Criterion 1: 问题诊断准确性 (Weight: 30%)
  **Score 1.0**: 准确识别全部关键问题：标题"终于实现笔记自由了"缺少搜索关键词（如AI、笔记工具）；仅2个标签太少（行业标准5-8个）；结尾没有互动引导（关注、点赞、评论引导）；20-30秒画面切换快且模糊影响完播；整体互动率（5.3%点赞率、0.9%评论率）低于竞品平均水平。
  **Score 0.75**: 识别了4个以上问题，分析基本准确。
  **Score 0.5**: 识别了2-3个主要问题，部分分析不够深入。
  **Score 0.25**: 仅发现了明显问题，分析浅表。
  **Score 0.0**: 未能有效诊断问题。

  ### Criterion 2: 竞品数据对比分析 (Weight: 20%)
  **Score 1.0**: 将视频数据与competitor_analysis.csv中的4个竞品进行了定量对比；指出了互动率差距（视频5.3% vs 竞品8%+）；分析了竞品的标签策略特点；基于竞品数据给出了可量化的改进目标。
  **Score 0.75**: 有竞品对比但不够系统化或数据引用不准确。
  **Score 0.5**: 提到了竞品但未做定量分析。
  **Score 0.25**: 仅简单提及竞品存在。
  **Score 0.0**: 未利用竞品数据。

  ### Criterion 3: 改进建议可操作性 (Weight: 30%)
  **Score 1.0**: improvement_plan.json包含具体可执行的优化方案：提供了3-5个优化标题选项（含关键词）；推荐了8-10个精准标签（热度与竞争度平衡）；给出了重新编排的内容结构（强开头钩子+清晰步骤+互动引导结尾）；每个issue都有severity等级和具体suggestion。
  **Score 0.75**: 建议具体但部分维度的可操作性不足。
  **Score 0.5**: 有改进建议但较为笼统。
  **Score 0.25**: 建议空泛，缺乏针对性。
  **Score 0.0**: 未提供改进建议。

  ### Criterion 4: 报告结构与专业度 (Weight: 20%)
  **Score 1.0**: 分析报告结构清晰，按5个维度分别论述；使用了数据支撑（引用具体互动率数字）；improvement_plan.json格式完全符合task_spec要求的schema；overall_score评分有合理依据；语言专业，体现了短视频运营领域知识。
  **Score 0.75**: 结构合理但部分维度论述深度不一。
  **Score 0.5**: 有基本结构但数据支撑不足。
  **Score 0.25**: 结构松散，专业度不够。
  **Score 0.0**: 未按要求生成结构化输出。
reference_solution: |
  原始来源：taskset-260408-163403/task_20_video_content_analysis

  原始场景：用户分享了一个短视频平台（类似抖音/TikTok）的视频链接，要求Agent分析视频内容存在的问题
  并给出改进建议。由于Agent无法直接访问视频URL，workspace中提供了视频的文字描述和元数据。
  Agent需要基于这些信息进行内容分析，从标题优化、标签策略、内容结构、受众定位等维度
  给出专业的短视频运营建议。


  隐藏 verifier 主要检查项：dimensions_coverage, plan_created, plan_quality, read_competitor, read_meta, read_spec, read_transcript, report_created

