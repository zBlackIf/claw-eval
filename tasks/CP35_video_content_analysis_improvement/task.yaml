services: []
prompt:
  text: |
    我已经把原始项目素材放在容器的 `/workspace/fixtures/` 目录下，请把这些文件当作只读输入。

    输入文件如下（右侧是它在原项目中的相对路径）：
    - `/workspace/fixtures/video_metadata.json` -> `video_metadata.json`
    - `/workspace/fixtures/video_transcript.txt` -> `video_transcript.txt`
    - `/workspace/fixtures/competitor_analysis.csv` -> `competitor_analysis.csv`
    - `/workspace/fixtures/task_spec.md` -> `task_spec.md`

    请基于这些输入完成下面的原始需求：

    用户分享了一个短视频链接让你分析问题。视频已经无法直接打开，但我已经把视频的元数据、逐帧文字描述和竞品数据整理好了。请读取所有文件，从标题、内容结构、标签策略、受众定位、数据表现五个维度进行分析，生成详细报告和结构化改进方案。

    交付要求：
    - 需要修改已有文件时，请把修改后的版本写到 `/workspace/` 下对应的原项目相对路径。
    - 需要新增文件时，请按需求中的文件名或上面列出的目标路径写到 `/workspace/` 下。
    - 最终回复只需概述完成情况、关键改动和生成的文件；不要只在最终回复中贴代码或报告正文。
  language: zh
tools: []
tool_endpoints: []
