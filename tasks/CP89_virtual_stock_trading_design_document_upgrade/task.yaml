task_id: CP89_virtual_stock_trading_design_document_upgrade
task_name: "虚拟股票交易系统设计文档 v2.4→v2.5 升级（CP89 / 源 taskset-260421-225115:task_11_trading_system_doc_update）"
version: "1.0"
category: design
difficulty: medium
tags: [general]

source_task_id: "task_11_trading_system_doc_update"
source_dataset: "taskset-260421-225115"
source_description: "PinchBench top100 rank 52（std_trim 0.374，mean_trim 0.508）。Workspace WS2 文档定向修改任务：现有 v2.4 文档需要做 5 项升级到 v2.5。verifier 5 个隐藏锚点（版本日志更新 / FOK 拒绝不插入订单 / lastPrice 单一写者 / 订单簿空模拟 / 行情算法补全）。"

services: []

prompt:
  text: |
    /workspace/fixtures/TRADING_SYSTEM_PLAN_V2.md 是 v2.4 版，要升到 v2.5——
    主要 5 件事：FOK 拒绝逻辑改了、lastPrice 维护职责去重、订单簿空状态处理、
    Section 5.1 行情生成算法补一下、所有改动标 v2.5 并更新版本记录。改后的
    文档放到 /workspace/TRADING_SYSTEM_PLAN_V2.md。
  language: zh

tools: []
tool_endpoints: []

sandbox_files:
  - fixtures/TRADING_SYSTEM_PLAN_V2.md

sandbox_grader_files:
  - fixtures/verify_doc_upgrade.py

env_snapshot_commands:
  - python /workspace/fixtures/verify_doc_upgrade.py

env_snapshot_files:
  - /workspace/TRADING_SYSTEM_PLAN_V2.md

environment:
  timeout_seconds: 600
  max_turns: 14
  env_snapshot_timeout: 30

scoring_components: []
safety_checks: []
expected_actions: []

judge_rubric: "Reward an updated TRADING_SYSTEM_PLAN_V2.md tagged v2.5 with version log entry mentioning the 5 changes, FOK rejection clarified as no order record (REJECTED row removed), lastPrice single-writer rule (MatchingEngine writes, QuoteService read-only), orderbook empty state simulation with 0.5%-2.5% spread, and Section 5.1 quote-generation algorithm (random walk + mean reversion, with formula or pseudocode)."

reference_solution: |
  Read v2.4 doc. Update title to v2.5. Add v2.5 row to version log
  (5 changes: FOK 拒绝不产订单/lastPrice 去重/订单簿空模拟/quote 算法/审计).
  In FOK section: remove 'FOK | REJECTED' row, add '不产生订单记录,
  返回错误码 3010'. In Section 2.4: 'lastPrice 只由 MatchingEngine.match()
  写入, QuoteService 仅读取'. In Section 2.5: 'orderbook 空时基于 lastPrice
  生成 5 档模拟报价, 浮动 0.5%-2.5%, 标记 simulated=true'. In Section 5.1:
  pseudocode P(t) = P(t-1) + drift * (mean - P(t-1)) + sigma * normal(0,1),
  random walk + mean reversion.

primary_dimensions: [completion, communication, safety]
