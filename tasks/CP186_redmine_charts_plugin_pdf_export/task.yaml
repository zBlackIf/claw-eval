judge_rubric: "Reward a complete PDF export feature: export button positioned in header/toolbar area, modal dialog with checkboxes for each tab panel (default all checked), PDF generation using html2pdf.js or equivalent library, proper canvas-to-image conversion for Chart.js charts, handling of hidden (display:none) panels during capture, and async/sequential rendering to avoid blank output."

reference_solution: |
  Key implementation points:
  1. Export button in view template, positioned near tabs/title area
  2. Modal dialog with checkboxes per tab (overview, dimension, trend, overdue, efficiency)
  3. Include html2pdf.js (or jsPDF + html2canvas) library
  4. Before PDF capture: temporarily show hidden panels (remove display:none)
  5. Convert Chart.js canvases to static images (canvas.toDataURL → img element)
  6. Use html2pdf or equivalent to generate PDF from the visible DOM
  7. Restore original panel visibility state after capture
  8. Handle async rendering (Promise chain or async/await) to ensure charts render before capture

primary_dimensions: [completion, communication, safety]
