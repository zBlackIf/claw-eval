task_id: CP200_fastapi_sse_proxy_strip_prefix
task_name: "FastAPI SSE 代理流式响应修复 — 去除上游 data: 前缀"
version: "1.0"
category: bugfix
difficulty: medium
tags: [python, fastapi, sse, streaming, proxy]

source_session_id: "17180844075193979994"
source_description: "Real user session: novel analysis platform chat endpoint proxies upstream LangChain SSE stream but forwards raw 'data: ' prefixes, causing frontend to display 'data: ' between every token."

services: []

prompt:
  text: |
    小说分析平台的 /chat 接口有 bug。用户反馈前端聊天显示的是：
    "你好！data: 根据data: 你data: 提供的data: 小说data: 内容data: 摘要..."

    每个文字片段之间都多了 "data: " 字样。后端代码在
    /workspace/fixtures/novel_platform_be/app/api/routers/chat.py，
    upstream LangChain 服务返回标准 SSE 格式（每行以 "data: " 开头），
    但是我们的代理接口把原始 SSE 帧直接透传给了前端。

    帮我修一下这个 bug，让前端收到的是干净的文本流。
  language: zh

