scoring_components: []
safety_checks: []
expected_actions: []

judge_rubric: "Reward correct SSE proxy fix: strip 'data: ' prefix from upstream lines before yielding to client. Must handle empty lines (SSE separators) gracefully, preserve error handling, and ideally handle the [DONE] signal. Best solution: conditional startswith check + slice/removeprefix, with else passthrough for non-SSE lines."

reference_solution: |
  In chat.py generate() function, change:
      async for line in response.aiter_lines():
          if line:
              yield line
  To:
      async for line in response.aiter_lines():
          if line:
              if line.startswith("data: "):
                  yield line[6:]
              else:
                  yield line

primary_dimensions: [completion, communication, safety]
