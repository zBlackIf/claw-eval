    command: python mock_services/crm/server.py
    port: 9110
    health_check: http://localhost:9110/crm/customers
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9110/crm/reset
    env:
      CRM_FIXTURES: tasks/CP54_vendor_performance_evaluation_report/fixtures/crm/customers.json
  - name: finance
    command: python mock_services/finance/server.py
    port: 9104
    health_check: http://localhost:9104/finance/transactions
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9104/finance/reset
    env:
      FINANCE_FIXTURES: tasks/CP54_vendor_performance_evaluation_report/fixtures/finance/transactions.json
  - name: helpdesk
    command: python mock_services/helpdesk/server.py
    port: 9107
    health_check: http://localhost:9107/helpdesk/tickets
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9107/helpdesk/reset
    env:
      HELPDESK_FIXTURES: tasks/CP54_vendor_performance_evaluation_report/fixtures/helpdesk/tickets.json
  - name: kb
    command: python mock_services/kb/server.py
    port: 9106
    health_check: http://localhost:9106/kb/articles
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9106/kb/reset
    env:
      KB_FIXTURES: tasks/CP54_vendor_performance_evaluation_report/fixtures/kb/articles.json
  - name: gmail
    command: python mock_services/gmail/server.py
    port: 9100
    health_check: http://localhost:9100/gmail/messages
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9100/gmail/reset
    env:
      GMAIL_FIXTURES: tasks/CP54_vendor_performance_evaluation_report/fixtures/gmail/inbox.json
  - name: contacts
    command: python mock_services/contacts/server.py
    port: 9103
    health_check: http://localhost:9103/contacts/search
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9103/contacts/reset
    env:
      CONTACTS_FIXTURES: tasks/CP54_vendor_performance_evaluation_report/fixtures/contacts/contacts.json

prompt:
  text: |
    你是采购管理部门的分析师，老板要求你在本周五前完成Q1供应商评估报告。

    1. 查看邮件了解评估要求和重点关注方向
    2. 从CRM获取4家供应商的基本信息和合同情况
    3. 查看知识库里的SLA标准和合同信息作为评估基准
    4. 在财务系统中查看各供应商Q1的费用变化趋势
    5. 在工单系统中查看各供应商相关的服务问题记录
    6. 综合评估每家供应商的表现，给出排名和续约建议
    7. 把评估报告邮件草稿发给采购总监（不要直接发送）

    评估维度：SLA达成、费用合理性、服务响应质量、续约建议。
  language: zh

tools:
  - name: gmail_list_messages
    description: 获取收件箱邮件列表
    input_schema:
      type: object
      properties:
        max_results:
          type: integer
          description: 最大返回数量
          default: 20
      required: []

  - name: gmail_get_message
    description: 根据邮件ID获取邮件详情
    input_schema:
      type: object
      properties:
        message_id:
          type: string
          description: 邮件ID
      required: [message_id]

  - name: gmail_save_draft
    description: 保存邮件草稿
    input_schema:
      type: object
      properties:
        to:
          type: string
          description: 收件人
        subject:
          type: string
          description: 主题
        body:
          type: string
          description: 正文
      required: [to, subject, body]

  - name: gmail_send_message
    description: 发送邮件
    input_schema:
      type: object
      properties:
        to:
          type: string
          description: 收件人
        subject:
          type: string
          description: 主题
        body:
          type: string
          description: 正文
      required: [to, subject, body]

  - name: crm_list_customers
    description: 列出供应商/客户
    input_schema:
      type: object
      properties:
        status:
          type: string
          description: 状态筛选
        tier:
          type: string
          description: 等级筛选
      required: []

  - name: crm_get_customer
    description: 获取供应商/客户详情
    input_schema:
      type: object
      properties:
        customer_id:
          type: string
          description: 供应商ID
      required: [customer_id]

  - name: finance_list_transactions
    description: 列出财务交易记录
    input_schema:
      type: object
      properties:
        category:
          type: string
          description: 交易类别
        date_from:
          type: string
          description: 起始日期
        date_to:
          type: string
          description: 结束日期
      required: []

  - name: finance_get_transaction
    description: 获取交易详情
    input_schema:
      type: object
      properties:
        transaction_id:
          type: string
          description: 交易ID
      required: [transaction_id]

  - name: helpdesk_list_tickets
    description: 列出工单
    input_schema:
      type: object
      properties:
        status:
          type: string
          description: 工单状态
        priority:
          type: string
          description: 优先级
      required: []

  - name: helpdesk_get_ticket
    description: 获取工单详情
    input_schema:
      type: object
      properties:
        ticket_id:
          type: string
          description: 工单ID
      required: [ticket_id]

  - name: kb_list_articles
    description: 列出知识库文章
    input_schema:
      type: object
      properties:
        category:
          type: string
          description: 文章分类
      required: []

  - name: kb_get_article
    description: 获取文章详情
    input_schema:
      type: object
      properties:
        article_id:
          type: string
          description: 文章ID
      required: [article_id]

  - name: contacts_search
    description: 搜索内部通讯录
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: 搜索关键词
        department:
          type: string
          description: 按部门筛选
      required: [query]

