task_id: CP54_vendor_performance_evaluation_report
task_name: 供应商绩效评估报告
version: "1.0"
category: workflow
difficulty: hard
tags: [general, multi_service, coding_plan]

source_task_id: "session_15081512394375593055"
source_dataset: "agent-loop-260526-170215-007049"
source_description: "采购管理场景：综合CRM、财务、工单、知识库多系统数据，评估4家供应商Q1表现，生成评估报告。"

