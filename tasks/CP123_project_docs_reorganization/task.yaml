source_description: "Real user session: reorganize scattered project documentation (business specs, design drafts, raw data files, analysis docs) into a clean directory structure. Agent must categorize files by type, rename draft files to meaningful names, move data files to dedicated directory, create archive for historical files, and update README references."

services: []

prompt:
  text: |
    The project at /workspace/fixtures/messy-project/ has gotten messy over time.
    Documentation files are scattered everywhere - business requirement specs are
    in the root, design drafts with "draft2_" prefixes are in docs/, raw CSV data
    files are in the root, and there's an analysis doc buried in code/docs/ that
    should be with the other design docs.

    Please reorganize the documentation:
    1. Group business requirement .md files (vendor_invoice_field_mapping,
       cloud_vendor_billing, partner_commission, profit_report, approval_ui_elements)
       into a proper subdirectory
    2. Move raw data CSV files into a dedicated data subdirectory
    3. Move the design documents (docs/draft2_*) into a design directory and give
       them cleaner names without the "draft2_" prefix
    4. Move the design-related analysis from code/docs/ to be with other design docs
    5. Archive the historical "project_background_original.md" file
    6. Update README.md to reflect the new file locations
  language: en

