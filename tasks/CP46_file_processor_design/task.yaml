judge_rubric: |
  ## Expected Behavior

  1. Agent reads project_design.docx and existing_code.py for context
  2. Agent reads sample files and config_template.py
  3. Agent creates the file_processor package structure
  4. Agent implements base class/interface with common chunking logic
  5. Agent implements TXT processor with character-count chunking
  6. Agent implements Markdown processor with heading-first then character chunking
  7. Agent implements DOCX processor leveraging python-docx patterns
  8. Agent creates config.py with all configuration parameters

  ## Grading Criteria

  - [ ] read_inputs
  - [ ] package_structure
  - [ ] config_params
  - [ ] txt_chunking
  - [ ] md_heading_split

  ## LLM Judge Rubric

  ### Criterion 1: 模块架构设计质量 (Weight: 30%)
  **Score 1.0**: 清晰的分层架构——抽象基类定义统一接口（process/chunk方法）、各格式处理器继承基类实现特定逻辑、配置与处理逻辑完全分离；依赖关系清晰，各模块可独立测试和替换。
  **Score 0.75**: 架构合理但抽象程度略有不足，如缺少统一接口或个别处理器耦合过紧。
  **Score 0.5**: 有基本的文件分离但缺乏统一的抽象设计。
  **Score 0.25**: 代码分散在多个文件但无清晰的架构设计。
  **Score 0.0**: 所有代码堆在单一文件中。

  ### Criterion 2: 切分策略实现正确性 (Weight: 30%)
  **Score 1.0**: TXT按字符数量切分实现正确（支持重叠）；Markdown先按标题层级（#/##/###）切分成语义段落再按字符数切分；DOCX正确提取文本后复用切分逻辑；切分结果保留了文档结构信息。
  **Score 0.75**: 核心切分逻辑正确但边界处理（如标题跨越、空段落）不够完善。
  **Score 0.5**: 实现了基本切分但Markdown的标题层级切分不够精确。
  **Score 0.25**: 仅实现了简单的固定长度切分，未区分格式。
  **Score 0.0**: 切分逻辑未实现或严重错误。

  ### Criterion 3: 现有代码复用与集成 (Weight: 20%)
  **Score 1.0**: 合理复用了existing_code.py中的MinerU API调用、图片提取和上下文获取函数；对现有代码进行了适当的封装和适配而非简单复制；新代码与现有代码风格一致。
  **Score 0.75**: 复用了大部分现有函数但封装不够优雅。
  **Score 0.5**: 部分复用了现有代码但有重复实现。
  **Score 0.25**: 知道现有代码存在但基本重写。
  **Score 0.0**: 完全忽略了现有代码。

  ### Criterion 4: 配置管理与可扩展性 (Weight: 20%)
  **Score 1.0**: config.py包含所有必要参数（切分大小、重叠量、存储配置等）且有合理默认值；支持环境变量覆盖；处理器通过配置而非硬编码控制行为；新增格式只需添加新处理器类。
  **Score 0.75**: 配置基本完整但缺少环境变量支持或个别参数硬编码。
  **Score 0.5**: 有config.py但参数不完整或部分参数仍硬编码在处理器中。
  **Score 0.25**: 配置管理初步但不系统。
  **Score 0.0**: 无独立配置管理。
