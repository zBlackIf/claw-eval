  原始场景：A developer is building an Agentic RAG system that needs a file processing module
  supporting multiple formats (TXT, Markdown, DOCX, images). The module must implement
  format-specific processing pipelines, chunking strategies, and produce a well-structured
  Python codebase with configuration separation and high cohesion / low coupling.


  隐藏 verifier 主要检查项：base_has_abstract_interface, config_env_overridable, docx_uses_library, md_heading_then_char, no_hardcoded_chunk_size, package_structure_exact, processor_independence, read_all_inputs, reuses_existing_code, txt_uses_sliding_window

