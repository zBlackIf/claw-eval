services: []
prompt:
  text: |
    我已经把原始项目素材放在容器的 `/workspace/fixtures/` 目录下，请把这些文件当作只读输入。

    输入文件如下（右侧是它在原项目中的相对路径）：
    - `/workspace/fixtures/project_design.docx` -> `project_design.docx`
    - `/workspace/fixtures/existing_code.py` -> `existing_code.py`
    - `/workspace/fixtures/sample_input.md` -> `sample_input.md`
    - `/workspace/fixtures/sample_input.txt` -> `sample_input.txt`
    - `/workspace/fixtures/config_template.py` -> `config_template.py`

    请基于这些输入完成下面的原始需求：

    请根据 project_design.docx 中的设计文档和 existing_code.py 中的现有代码，设计并实现一个完整的多格式文件处理模块。要求：

    1. 支持 TXT、Markdown、DOCX 和图片格式的输入
    2. TXT 按字符数量切分（参考 config_template.py 中的 CHUNK_SIZE）
    3. Markdown 先按标题层级切分，再按字符数量切分
    4. 基于 existing_code.py 中的现有函数进行复用
    5. 各部分职责分离，高内聚低耦合
    6. 配置项保存在 config.py 中
    7. 用 sample_input.md 和 sample_input.txt 验证你的切分逻辑

    将实现写入以下文件：
    - file_processor/__init__.py
    - file_processor/config.py
    - file_processor/base.py (基类/接口)
    - file_processor/txt_processor.py
    - file_processor/markdown_processor.py
    - file_processor/docx_processor.py

    交付要求：
    - 需要修改已有文件时，请把修改后的版本写到 `/workspace/` 下对应的原项目相对路径。
    - 需要新增文件时，请按需求中的文件名或上面列出的目标路径写到 `/workspace/` 下。
    - 最终回复只需概述完成情况、关键改动和生成的文件；不要只在最终回复中贴代码或报告正文。
