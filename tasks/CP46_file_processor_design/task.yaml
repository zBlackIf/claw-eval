task_id: CP46_file_processor_design
task_name: 多格式文件处理模块架构设计
version: "1.0"
category: code_generation
difficulty: hard
tags: [general, single_turn, coding_plan]

source_task_id: "task_01_file_processor_design"
source_dataset: "taskset-260408-212200"
source_description: "从 PinchBench eval-260427-172048-209429 (10模型×99题) 中按跨模型标准差排名精选的高区分度任务，改编为 Claw-Eval Pattern D (sandbox-adapted) 格式。原始 prompt 保留，grader 基于 PinbenchAdaptedGrader 实现自动化评分。"

services: []

prompt:
  text: |
    <!-- CLAW-EVAL-FIXTURE-PREAMBLE -->
    以下文件已注入到容器内，请按给出的容器绝对路径读取（容器 WORKDIR = `/workspace`）：

    - `/workspace/fixtures/existing_code.py`
    - `/workspace/fixtures/config_template.py`
    - `/workspace/fixtures/sample_input.md`
    - `/workspace/fixtures/sample_input.txt`

    所有产物请落到 `/workspace/...` 下；评分仅捕获 `/workspace/` 内的文件。

    请根据 project_design.docx 中的设计文档和 existing_code.py 中的现有代码，设计并实现一个完整的多格式文件处理模块。要求：

    1. 支持 TXT、Markdown、DOCX 和图片格式的输入
    2. TXT 按字符数量切分（参考 config_template.py 中的 CHUNK_SIZE）
    3. Markdown 先按标题层级切分，再按字符数量切分
    4. 基于 existing_code.py 中的现有函数进行复用
    5. 各部分职责分离，高内聚低耦合
    6. 配置项保存在 config.py 中
    7. 用 sample_input.md 和 sample_input.txt 验证你的切分逻辑

    将实现写入以下文件：
    - file_processor/__init__.py
    - file_processor/config.py
    - file_processor/base.py (基类/接口)
    - file_processor/txt_processor.py
    - file_processor/markdown_processor.py
    - file_processor/docx_processor.py
  language: zh

tools: []
tool_endpoints: []

sandbox_files:
  - fixtures/existing_code.py
  - fixtures/config_template.py
  - fixtures/sample_input.md
  - fixtures/sample_input.txt

sandbox_grader_files:
  - fixtures/verify.py

environment:
  timeout_seconds: 600
  max_turns: 30

  env_snapshot_timeout: 30

env_snapshot_commands:
  - python /workspace/fixtures/verify.py

env_snapshot_files:
  - /workspace/file_processor/config.py
  - /workspace/file_processor/base.py
  - /workspace/file_processor/txt_processor.py
  - /workspace/file_processor/markdown_processor.py
scoring_components: []

safety_checks: []

expected_actions: []

judge_rubric: |
  评估 agent 是否根据需求创建了完整的多格式文件处理模块。
  - 模块架构：抽象基类 + 4个处理器 + 配置分离
  - 切分逻辑：TXT按字符、MD先标题后字符
  - 代码复用：是否利用了existing_code.py中的函数
  - 可扩展性：新增格式是否只需添加新处理器

reference_solution: |
  1. file_processor/__init__.py: 注册所有处理器，提供统一入口
  2. file_processor/config.py: CHUNK_SIZE=500, OVERLAP_SIZE=50, 存储配置
  3. file_processor/base.py: BaseProcessor抽象类, process() + chunk() 方法
  4. file_processor/txt_processor.py: 按CHUNK_SIZE字符切分，支持OVERLAP
  5. file_processor/markdown_processor.py: 正则按#/##/###切分段落，再按字符切分
  6. file_processor/docx_processor.py: python-docx读取段落，复用切分逻辑

primary_dimensions: [completion, robustness, communication]
