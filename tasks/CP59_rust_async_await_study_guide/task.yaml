judge_rubric: "Reward a structured Rust async guide covering Future/Pin/poll, Tokio runtime variants, Arc/Mutex/RwLock/mpsc, Send/Sync, and ≥5 interview Q&A. Code blocks must be tagged ```rust and demonstrate tokio 1.x + axum specifics (spawn, select!, #[tokio::main], multi_thread/current_thread runtime). Should build on the existing_notes.md content rather than discard it."

reference_solution: |
  Read /workspace/fixtures/existing_notes.md. Write
  /workspace/async_study_guide.md with five sections aligned to the topics
  above; each section gets a concept summary, a ```rust code snippet
  (≥4 total), and any tokio-specific API call (spawn / select! /
  #[tokio::main] / Runtime::new + multi_thread). End with ≥5 numbered
  interview questions with model answers covering pitfalls like .await
  on Mutex, !Send futures, cancellation, blocking calls, structured
  concurrency.

primary_dimensions: [completion, communication, safety]
