task_id: CP125_bootstrap_icons_emoji_replacement
task_name: "Bootstrap Icons 替换全站 Emoji 图标（Django 模板）"
version: "1.0"
category: frontend
difficulty: medium
tags: [frontend, html, django, icons, refactor]

source_session_id: "3516966427885309905"
source_description: "Real user session: lab_booking Django project replacing emoji characters with Bootstrap Icons font. Requires importing the icon library (CDN for online, static for offline) and systematically replacing 15+ emojis across 5 template files with appropriate bi-* classes."

services: []

prompt:
  text: |
    我们的实验室预约系统 lab_booking 目前所有页面图标都是直接用 emoji 字符
    （📖📊⚙️🔧🔑🚪🔬💡📅➕📥🔄🗑️📈👤🏆ℹ️ 等），
    在不同设备上渲染效果不一致。请帮我把全站模板里的 emoji 图标统一替换成
    Bootstrap Icons（icon font 方式，用 <i class="bi bi-xxx"></i>）。

    要求：
    1. base.html 加 CDN 引入 Bootstrap Icons CSS
    2. base.offline.html 用本地静态文件方式引入（{% static %} 标签）
    3. 所有模板中的 emoji 替换成语义对应的 Bootstrap Icons class
    4. 导航栏的 SVG chevron 也换成 bi-chevron-left / bi-chevron-right

    项目文件在 /workspace/fixtures/lab_booking/ 目录下。
  language: zh

tools: []
tool_endpoints: []

sandbox_files:
  - fixtures/lab_booking/core/templates/core/base.html
  - fixtures/lab_booking/core/templates/core/base.offline.html
  - fixtures/lab_booking/core/templates/core/index.html
  - fixtures/lab_booking/core/templates/core/stats.html
  - fixtures/lab_booking/core/templates/core/readme.html
  - fixtures/lab_booking/core/static/css/custom.css

sandbox_grader_files:
  - fixtures/verify_solution.py

env_snapshot_commands:
  - python /workspace/fixtures/verify_solution.py

environment:
  timeout_seconds: 600
  max_turns: 20
  env_snapshot_timeout: 30

scoring_components: []
safety_checks: []
expected_actions: []

judge_rubric: "Reward systematic emoji-to-Bootstrap-Icons migration: (1) Bootstrap Icons CSS properly imported via CDN in base.html and via static file in base.offline.html, (2) all navbar emojis replaced with semantic bi-* classes, (3) page-level emojis in index/stats/readme templates replaced, (4) consistent use of <i class='bi bi-xxx'></i> pattern, (5) no broken HTML or mixed icon approaches."

reference_solution: |
  1. In base.html: add <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  2. In base.offline.html: add <link rel="stylesheet" href="{% static 'css/bootstrap-icons.min.css' %}">
  3. Replace emojis with semantic equivalents:
     - 📖 → bi-book, 📊 → bi-bar-chart, ⚙️ → bi-gear, 🔧 → bi-wrench
     - 🔑 → bi-key, 🚪 → bi-door-open, 🔬 → bi-eyedropper (or bi-flask)
     - 💡 → bi-lightbulb, 📅 → bi-calendar, ➕ → bi-plus-circle
     - 📥 → bi-download, 🔄 → bi-arrow-clockwise, 🗑️ → bi-trash
     - 📈 → bi-graph-up, 👤 → bi-person, 🏆 → bi-trophy, ℹ️ → bi-info-circle
  4. Replace SVG chevrons with bi-chevron-left / bi-chevron-right
  5. All icon usage follows <i class="bi bi-xxx"></i> pattern consistently

primary_dimensions: [completion, communication, safety]
