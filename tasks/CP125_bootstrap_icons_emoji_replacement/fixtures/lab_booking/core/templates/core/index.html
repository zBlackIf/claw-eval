{% extends "core/base.html" %}
{% block title %}预约日历{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h4 class="mb-0">📅 预约日历</h4>
        <div class="btn-group">
            <button type="button" class="btn btn-sm cal-nav-btn" id="btnPrev" title="上一周">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/>
                </svg>
            </button>
            <button type="button" class="btn btn-sm cal-nav-btn" id="btnToday" title="今天">
                今天
            </button>
            <button type="button" class="btn btn-sm cal-nav-btn" id="btnNext" title="下一周">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z"/>
                </svg>
            </button>
        </div>
    </div>
    <div class="card-body">
        <div id="calendar-grid">
            <!-- Calendar content loaded by JS -->
        </div>
        <div class="mt-3">
            <div class="legend-row">
                <span class="legend-item">
                    <span class="legend-dot available"></span> 可预约
                </span>
                <span class="legend-item">
                    <span class="legend-dot booked"></span> 已预约
                </span>
                <span class="legend-item">
                    <span class="legend-dot mine"></span> 我的预约
                </span>
            </div>
        </div>
        <div class="mt-2">
            <small class="text-muted"><i class="desc-icon">ℹ️</i> <span class="desc-text">点击空闲时段即可预约</span></small>
        </div>
    </div>
</div>

<div class="card mt-3">
    <div class="card-header">
        <h5 class="mb-0">➕ 快捷操作</h5>
    </div>
    <div class="card-body">
        <button class="btn btn-primary me-2">📥 导入排班</button>
        <button class="btn btn-outline-secondary me-2">🔄 刷新数据</button>
        <button class="btn btn-outline-danger">🗑️ 清空本周</button>
    </div>
</div>
{% endblock %}
