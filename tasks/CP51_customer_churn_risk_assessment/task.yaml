task_id: CP51_customer_churn_risk_assessment
task_name: 客户流失风险评估与挽留方案
version: "1.0"
category: workflow
difficulty: hard
tags: [general, multi_service, coding_plan]

source_task_id: "session_15081512394375593055"
source_dataset: "agent-loop-260526-170215-007049"
source_description: "基于真实企业办公场景的客户流失预警任务。需要跨CRM、财务、邮件多系统关联分析，识别高风险客户并制定挽留方案。"

services:
  - name: crm
    command: python mock_services/crm/server.py
    port: 9110
    health_check: http://localhost:9110/crm/customers
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9110/crm/reset
    env:
      CRM_FIXTURES: tasks/CP51_customer_churn_risk_assessment/fixtures/crm/customers.json
  - name: finance
    command: python mock_services/finance/server.py
    port: 9104
    health_check: http://localhost:9104/finance/transactions
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9104/finance/reset
    env:
      FINANCE_FIXTURES: tasks/CP51_customer_churn_risk_assessment/fixtures/finance/transactions.json
  - name: gmail
    command: python mock_services/gmail/server.py
    port: 9100
    health_check: http://localhost:9100/gmail/messages
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9100/gmail/reset
    env:
      GMAIL_FIXTURES: tasks/CP51_customer_churn_risk_assessment/fixtures/gmail/inbox.json
  - name: contacts
    command: python mock_services/contacts/server.py
    port: 9103
    health_check: http://localhost:9103/contacts/search
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9103/contacts/reset
    env:
      CONTACTS_FIXTURES: tasks/CP51_customer_churn_risk_assessment/fixtures/contacts/contacts.json

prompt:
  text: |
    你是客户成功团队的高级分析师，最近有几个重要客户的续约期快到了，老板让你做一轮流失风险评估。

    1. 看一下收件箱里客户经理们反馈的情况
    2. 在CRM里查看这些客户的基本信息和历史互动记录
    3. 在财务系统中查看他们近半年的付费和消费趋势
    4. 综合分析哪些客户流失风险最高，给出风险等级排序
    5. 针对高风险客户，起草一份挽留方案邮件给客户成功VP（不要直接发送）
  language: zh

tools:
  - name: gmail_list_messages
    description: 获取收件箱邮件列表
    input_schema:
      type: object
      properties:
        days_back:
          type: integer
          description: 获取最近几天的邮件
          default: 7
        max_results:
          type: integer
          description: 最大返回数量
          default: 20
      required: []

  - name: gmail_get_message
    description: 根据邮件ID获取邮件详情
    input_schema:
      type: object
      properties:
        message_id:
          type: string
          description: 邮件ID
      required: [message_id]

  - name: gmail_save_draft
    description: 保存邮件草稿
    input_schema:
      type: object
      properties:
        to:
          type: string
          description: 收件人
        subject:
          type: string
          description: 主题
        body:
          type: string
          description: 正文
      required: [to, subject, body]

  - name: gmail_send_message
    description: 发送邮件
    input_schema:
      type: object
      properties:
        to:
          type: string
          description: 收件人
        subject:
          type: string
          description: 主题
        body:
          type: string
          description: 正文
      required: [to, subject, body]

  - name: crm_list_customers
    description: 列出客户
    input_schema:
      type: object
      properties:
        status:
          type: string
          description: "客户状态筛选(active/churned)"
        tier:
          type: string
          description: "客户等级筛选(vip/standard)"
        industry:
          type: string
          description: "按行业筛选"
      required: []

  - name: crm_get_customer
    description: 获取客户详情
    input_schema:
      type: object
      properties:
        customer_id:
          type: string
          description: 客户ID
      required: [customer_id]

  - name: finance_list_transactions
    description: 列出财务交易记录
    input_schema:
      type: object
      properties:
        category:
          type: string
          description: 交易类别
        date_from:
          type: string
          description: 起始日期
        date_to:
          type: string
          description: 结束日期
      required: []

  - name: finance_get_transaction
    description: 获取交易详情
    input_schema:
      type: object
      properties:
        transaction_id:
          type: string
          description: 交易ID
      required: [transaction_id]

  - name: finance_submit_report
    description: 提交财务报告
    input_schema:
      type: object
      properties:
        title:
          type: string
          description: 报告标题
        type:
          type: string
          description: 报告类型 (research/audit/summary)
        content:
          type: string
          description: 报告内容
      required: [title, type, content]

  - name: contacts_search
    description: 搜索内部通讯录
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: 搜索关键词
        department:
          type: string
          description: 按部门筛选
      required: [query]

  - name: contacts_get
    description: 获取联系人详情
    input_schema:
      type: object
      properties:
        contact_id:
          type: string
          description: 联系人ID
      required: [contact_id]

