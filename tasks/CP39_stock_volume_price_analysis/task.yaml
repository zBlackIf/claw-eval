task_id: CP39_stock_volume_price_analysis
task_name: A股量价关系分析
version: "1.0"
category: data_analysis
difficulty: medium
tags: [general, single_turn, coding_plan]

source_task_id: "task_07_volume_price_analysis"
source_dataset: "taskset-260408-212200"
source_description: "从 PinchBench eval-260427-172048-209429 (10模型×99题) 中按跨模型标准差排名精选的高区分度任务，改编为 Claw-Eval Pattern D (sandbox-adapted) 格式。原始 prompt 保留，grader 基于 PinbenchAdaptedGrader 实现自动化评分。"

services: []

prompt:
  text: |
    <!-- CLAW-EVAL-FIXTURE-PREAMBLE -->
    以下文件已注入到容器内，请按给出的容器绝对路径读取（容器 WORKDIR = `/workspace`）：

    - `/workspace/fixtures/task_instructions.txt`
    - `/workspace/fixtures/stock_data/sh600519.csv`
    - `/workspace/fixtures/stock_data/sz002304.csv`
    - `/workspace/fixtures/stock_data/sz000858.csv`

    所有产物请落到 `/workspace/...` 下；评分仅捕获 `/workspace/` 内的文件。

    Follow the instructions in task_instructions.txt to analyze volume-price relationships from the stock CSV files in stock_data/. Handle any data quality issues (missing values, NaN, Inf) gracefully. Write results to volume_price_results.csv and analysis_summary.txt. Remember: do NOT search the internet, use only local data.
  language: zh

tools: []
tool_endpoints: []

sandbox_files:
  - fixtures/task_instructions.txt
  - fixtures/stock_data/sh600519.csv
  - fixtures/stock_data/sz002304.csv
  - fixtures/stock_data/sz000858.csv

sandbox_grader_files:
  - fixtures/verify.py

environment:
  timeout_seconds: 600
  max_turns: 30

  env_snapshot_timeout: 30

env_snapshot_commands:
  - python /workspace/fixtures/verify.py

env_snapshot_files:
  - /workspace/volume_price_results.csv
  - /workspace/analysis_summary.txt
  - /workspace/**/*.csv
  - /workspace/**/analysis*
scoring_components: []

safety_checks: []

expected_actions: []

judge_rubric: |
  评估 agent 对量价关系分析任务的执行质量。

  ## 核心检查
  - 是否读取了 task_instructions.txt
  - 是否读取了全部 3 个 CSV 文件
  - 是否正确处理了数据质量问题（sz000858.csv 有缺失值）
  - 输出 CSV 是否包含 3 只股票的相关系数
  - analysis_summary.txt 是否存在

  ## 评分标准
  - 0.9-1.0: 全部完成，数据处理正确，结果合理
  - 0.7-0.8: 大部分正确，可能遗漏数据质量处理
  - 0.4-0.6: 部分完成，结果文件格式有问题
  - 0.0-0.3: 未完成或使用了网络搜索

reference_solution: |
  1. 读取 3 个 CSV 文件
  2. 计算每日价格变动和成交量变动
  3. 处理 sz000858.csv 中 2025-01-10 的缺失 high 值
  4. 计算 Pearson 相关系数
  5. 输出 volume_price_results.csv 和 analysis_summary.txt

primary_dimensions: [completion, robustness, communication]
