judge_rubric: "Reward thorough null-safety fix: null check on getRmUidEntityByRuid return, avoidance of 'null' string propagation into path construction (getRemoteDir/createUpSynFile), proper error handling (default value or exception rather than silent null), defensive downstream protection, and warning/error logging for observability."

reference_solution: |
  In getNeType():
  - Add null check after getRmUidEntityByRuid() call
  - If null: log warning with neRuid context, use default "UNKNOWN" or throw IllegalStateException
  - Never return null or assign null to neType (causes "null" in S3 paths)

  Optionally in process():
  - Guard neType before passing to getRemoteDir() and createUpSynFile()
  - If neType is invalid, skip upload with error log rather than uploading to broken path

  Key insight: the fix is NOT just adding `!= null` ternary with null fallback.
  That naive fix causes StringBuilder.append(null) → "null" in the remote path,
  which is a silent data corruption bug worse than the original NPE.

