    description: 获取收件箱邮件列表
    input_schema:
      type: object
      properties:
        max_results:
          type: integer
          description: 最大返回数量
          default: 20
      required: []

  - name: gmail_get_message
    description: 根据邮件ID获取邮件详情
    input_schema:
      type: object
      properties:
        message_id:
          type: string
          description: 邮件ID
      required: [message_id]

  - name: gmail_save_draft
    description: 保存邮件草稿
    input_schema:
      type: object
      properties:
        to:
          type: string
          description: 收件人
        subject:
          type: string
          description: 主题
        body:
          type: string
          description: 正文
      required: [to, subject, body]

  - name: gmail_send_message
    description: 发送邮件
    input_schema:
      type: object
      properties:
        to:
          type: string
          description: 收件人
        subject:
          type: string
          description: 主题
        body:
          type: string
          description: 正文
      required: [to, subject, body]

  - name: helpdesk_list_tickets
