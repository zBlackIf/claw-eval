prompt:
  text: |
    你是SRE团队的数据分析师，运维经理让你做一次5月工单趋势分析。

    1. 查看邮件了解分析背景和关注点
    2. 查看本月所有工单，分析模式和趋势
    3. 检查相关的系统配置，看是否有近期变更
    4. 查看监控定时任务的运行状态
    5. 查看知识库中的历史经验文档
    6. 识别系统性问题模式（不是个别偶发，而是反复出现的规律）
    7. 分析根因并给出改进建议
    8. 把分析报告邮件草稿发给运维经理（存草稿别发）

    重点找出：高频问题类型、时间规律、是否与配置变更相关。
  language: zh

tools:
