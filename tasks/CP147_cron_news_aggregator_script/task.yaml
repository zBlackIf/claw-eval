judge_rubric: "Reward complete implementation of automated news aggregation pipeline: valid cron schedule (0 8 * * * and 0 20 * * *), config.yaml parser, multi-source fetchers (arXiv RSS + HuggingFace API + others), deduplication/filtering logic, structured Chinese markdown report (headline/breakthroughs/business/quicklook), API sync with auth and retry, --dry-run mode, graceful error handling for source failures."

reference_solution: |
  Complete sync_news.py with:
  - YAML config loading (PyYAML)
  - Source fetchers: arXiv (xml.etree + urllib or feedparser), HuggingFace (requests to API),
    TechCrunch (RSS feed), OpenAI Blog (RSS feed)
  - Dedup by URL/title set, filter uncertain content via keyword matching
  - Format into markdown with ## 头条, ## 技术突破, ## 商业动态, ## 速览 sections
  - POST endpoint with Authorization Bearer header, JSON payload, retry logic
  - argparse --dry-run skips POST, prints report to stdout
  - try/except around each source fetch, continue on failure, log warnings
  - crontab.txt with: 0 8 * * * cd /path && python sync_news.py
    and: 0 20 * * * cd /path && python sync_news.py
  - requirements.txt: pyyaml, requests, feedparser (or equivalent)

