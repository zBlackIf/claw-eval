judge_rubric: "Reward correct diagnosis and fix of two coupled issues: (1) authStore.ts uses JSX but has .ts extension — must rename to .tsx or extract JSX to a .tsx file; (2) services/auth.ts is missing exported functions getCurrentUser and loginApi that other modules import. Both fixes required for a clean tsc --noEmit. Partial credit for fixing only one issue."

reference_solution: |
  1. Rename src/store/authStore.ts → src/store/authStore.tsx (fixes JSX-in-.ts error)
  2. Update imports in main.tsx and App.tsx if needed (path may auto-resolve)
  3. In src/services/auth.ts, implement and export:
     - loginApi(username, password) → Promise<ApiResponse<{accessToken, refreshToken, user}>>
     - getCurrentUser() → Promise<ApiResponse<User>>
     Both can use axios to call /api/auth/login and /api/auth/me respectively.

