prompt:
  text: |
    我已经把原始项目素材放在容器的 `/workspace/fixtures/` 目录下，请把这些文件当作只读输入。

    输入文件如下（右侧是它在原项目中的相对路径）：
    - `/workspace/fixtures/dao/TotalScoreDao.java` -> `dao/TotalScoreDao.java`
    - `/workspace/fixtures/sql/total_score_query.sql` -> `sql/total_score_query.sql`
    - `/workspace/fixtures/sql/student_booking_list.sql` -> `sql/student_booking_list.sql`

    请基于这些输入完成下面的原始需求：

    我想把 dao/TotalScoreDao.java 的 getQueryCommonParams 方法中 startedCourseSql 和 canTaketestSql 部分提取出去，直接放到 sql 里去写。

    请结合 sql/ 下的这些 SQL 文件内容帮我评估一下修改范围是否可控，可能会存在哪些风险，然后完成重构：

    1. 将 startedCourseSql 的 INNER JOIN 片段移入 sql/total_score_query.sql，用条件 SQL 表达（可以使用 MyBatis 风格的 <if> 标签或注释标记的条件块）
    2. 将 canTaketestSql 的 INNER JOIN 片段也移入 SQL 文件
    3. 修改 TotalScoreDao.java，从 Java 拼接改为加载 SQL 模板并传入参数
    4. 写一份简短的风险评估，保存到 refactor_risk_assessment.md

    交付要求：
    - 需要修改已有文件时，请把修改后的版本写到 `/workspace/` 下对应的原项目相对路径。
    - 需要新增文件时，请按需求中的文件名或上面列出的目标路径写到 `/workspace/` 下。
    - 最终回复只需概述完成情况、关键改动和生成的文件；不要只在最终回复中贴代码或报告正文。
