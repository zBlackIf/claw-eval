task_id: CP32_java_dao_sql_fragment_extraction
task_name: Java DAO SQL Fragment Extraction
version: "1.0"
category: refactoring
difficulty: medium
tags: [general, single_turn, coding_plan]

source_task_id: "task_101_java_dao_sql_refactor"
source_dataset: "taskset-260427-121234"
source_description: "从 PinchBench eval-260427-172048-209429 (10模型×99题) 中按跨模型标准差排名精选的高区分度任务，改编为 Claw-Eval Pattern D (sandbox-adapted) 格式。原始 prompt 保留，grader 基于 PinbenchAdaptedGrader 实现自动化评分。"

services: []

prompt:
  text: |
    <!-- CLAW-EVAL-FIXTURE-PREAMBLE -->
    以下文件已注入到容器内，请按给出的容器绝对路径读取（容器 WORKDIR = `/workspace`）：

    - `/workspace/fixtures/dao/TotalScoreDao.java`
    - `/workspace/fixtures/sql/total_score_query.sql`

    所有产物请落到 `/workspace/...` 下；评分仅捕获 `/workspace/` 内的文件。

    我想把 dao/TotalScoreDao.java 的 getQueryCommonParams 方法中 startedCourseSql 和 canTaketestSql 部分提取出去，直接放到 sql 里去写。

    请结合 sql/ 下的这些 SQL 文件内容帮我评估一下修改范围是否可控，可能会存在哪些风险，然后完成重构：

    1. 将 startedCourseSql 的 INNER JOIN 片段移入 sql/total_score_query.sql，用条件 SQL 表达（可以使用 MyBatis 风格的 <if> 标签或注释标记的条件块）
    2. 将 canTaketestSql 的 INNER JOIN 片段也移入 SQL 文件
    3. 修改 TotalScoreDao.java，从 Java 拼接改为加载 SQL 模板并传入参数
    4. 写一份简短的风险评估，保存到 refactor_risk_assessment.md
  language: zh

tools: []
tool_endpoints: []

sandbox_files:
  - fixtures/dao/TotalScoreDao.java
  - fixtures/sql/total_score_query.sql

sandbox_grader_files:
  - fixtures/verify.py

environment:
  timeout_seconds: 600
  max_turns: 30

  env_snapshot_timeout: 30

env_snapshot_commands:
  - python /workspace/fixtures/verify.py

env_snapshot_files:
  - /workspace/sql/total_score_query.sql
  - /workspace/dao/TotalScoreDao.java
  - /workspace/**/*risk*
  - /workspace/**/*风险*
scoring_components: []

safety_checks: []

expected_actions: []

judge_rubric: |
  评估 agent 是否正确完成了 SQL 片段提取重构。

  ## SQL 文件
  - total_score_query.sql 是否包含 startedcourse JOIN 逻辑
  - 是否包含 examstudenttestqualification JOIN 逻辑
  - 是否使用了条件语法（MyBatis <if> 或其他模板机制）

  ## Java 文件
  - TotalScoreDao.java 是否移除了内联 SQL 拼接
  - 是否改为加载 SQL 模板

  ## 风险评估
  - 是否存在且有实质内容

  ## 评分标准
  - 0.9-1.0: SQL条件化+Java简化+风险评估完整
  - 0.7-0.8: 大部分正确
  - 0.4-0.6: 部分完成
  - 0.0-0.3: 未完成

reference_solution: |
  1. SQL: 用 <if test="upToStandard != null"> 包裹 startedcourse JOIN
  2. SQL: 用 <if test="canTakeTest != null"> 包裹 qualification JOIN
  3. Java: 移除字符串拼接，改为 SqlSession.selectList("totalScoreQuery", params)
  4. 风险评估涵盖：SQL注入、性能影响、向后兼容

primary_dimensions: [completion, robustness, communication]
