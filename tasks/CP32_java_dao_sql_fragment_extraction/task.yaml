judge_rubric: |
  ## Expected Behavior

  1. Agent reads TotalScoreDao.java and both SQL files.
  2. Agent identifies the two dynamic JOIN fragments to extract.
  3. Agent moves the JOIN logic into total_score_query.sql with conditional syntax.
  4. Agent simplifies TotalScoreDao.java to use the SQL template.
  5. Agent writes a risk assessment noting: parameter binding changes, SQL injection surface, conditional JOIN behavior, test coverage gaps.

  ## Grading Criteria

  - [ ] `sql_has_started_course_join`: total_score_query.sql contains startedcourse JOIN logic
  - [ ] `sql_has_can_taketest_join`: total_score_query.sql contains examstudenttestqualification JOIN logic
  - [ ] `sql_is_conditional`: SQL uses conditional syntax (if/when/choose or equivalent)
  - [ ] `java_simplified`: TotalScoreDao.java no longer has inline startedCourseSql/canTaketestSql string building
  - [ ] `risk_assessment_exists`: refactor_risk_assessment.md or similar file exists with risk analysis
