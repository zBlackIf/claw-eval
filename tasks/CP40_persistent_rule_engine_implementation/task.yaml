judge_rubric: |
  评估 agent 对规则引擎实现任务的执行质量。

  ## 方法实现
  - 5 个 TODO 方法是否全部实现（不再抛出 NotImplementedError）
  - add_rule 是否生成唯一 ID（UUID 或时间戳）
  - get_active_rules 是否按 priority 降序排列
  - build_system_prompt_prefix 格式是否清晰

  ## 持久化
  - 规则是否持久化到 app_config.json
  - 重新实例化后规则是否仍存在
  - app_config.json 中 rules 以外的字段是否保持不变

  ## 测试脚本
  - test_rules.py 是否存在
  - 是否覆盖了所有要求的测试场景

  ## 评分标准
  - 0.9-1.0: 全部方法正确实现，持久化有效，测试完整
  - 0.7-0.8: 大部分方法实现，小问题（如排序方向错误）
  - 0.4-0.6: 部分方法实现或持久化有问题
  - 0.0-0.3: 未完成或核心红线违反

reference_solution: |
  1. add_rule: 用 uuid.uuid4() 生成 ID，append to self.rules，调用 _save()
  2. remove_rule: filter out by ID，调用 _save()
  3. get_active_rules: sorted([r for r in self.rules if r.active], key=lambda r: r.priority, reverse=True)
  4. build_system_prompt_prefix: 格式化为编号列表
  5. apply_rules_to_config: 解析规则文本中的关键词（中文→language: zh-CN, 暗色→theme: dark）

primary_dimensions: [completion, robustness, communication]
