source_description: "从 PinchBench eval-260427-172048-209429 (10模型×99题) 中按跨模型标准差排名精选的高区分度任务，改编为 Claw-Eval Pattern D (sandbox-adapted) 格式。原始 prompt 保留，grader 基于 PinbenchAdaptedGrader 实现自动化评分。"

services: []

prompt:
  text: |
    <!-- CLAW-EVAL-FIXTURE-PREAMBLE -->
    以下文件已注入到容器内，请按给出的容器绝对路径读取（容器 WORKDIR = `/workspace`）：

    - `/workspace/fixtures/rule_engine.py`
    - `/workspace/fixtures/app_config.json`

    所有产物请落到 `/workspace/...` 下；评分仅捕获 `/workspace/` 内的文件。

    workspace有 `app_config.json`（应用配置）和 `rule_engine.py`（规则引擎骨架，有TODO方法需要实现）。

    需要：

    1. **实现 `rule_engine.py` 中所有 TODO 方法**：
       - `add_rule`: 生成唯一rule_id（用UUID或时间戳），添加规则并持久化到JSON
       - `remove_rule`: 按ID删除规则并持久化
       - `get_active_rules`: 返回活跃规则，按priority降序
       - `build_system_prompt_prefix`: 将规则格式化为系统提示前缀
       - `apply_rules_to_config`: 根据规则内容推断配置变更建议

    2. **写测试脚本 `test_rules.py`**，模拟以下场景：
       - 添加规则："所有回复必须使用中文"（priority=10）
       - 添加规则："每条回复开头显示当前使用的模型名称"（priority=5）
       - 添加规则："使用暗色主题"（priority=1）
       - 列出所有活跃规则（应按priority排序：10, 5, 1）
       - 生成system prompt prefix并打印
       - 调用apply_rules_to_config，验证是否建议将frontend.language改为zh-CN
       - 删除第三条规则
       - 重新加载RuleEngine（模拟重启），验证剩余2条规则仍存在
       - 将最终的 `app_config.json` 中的 rules 数量打印出来

    **红线**：
    - 规则必须持久化到 `app_config.json`（不能只存内存）
    - 重启后（重新实例化RuleEngine）规则必须还在
    - rule_id 必须唯一
    - 不能修改 app_config.json 中 rules 以外的其他字段
  language: zh

