prompt:
  text: |
    我已经把原始项目素材放在容器的 `/workspace/fixtures/` 目录下，请把这些文件当作只读输入。

    输入文件如下（右侧是它在原项目中的相对路径）：
    - `/workspace/fixtures/app_config.json` -> `app_config.json`
    - `/workspace/fixtures/rule_engine.py` -> `rule_engine.py`
    - `/workspace/fixtures/implementation_requirements.md` -> `implementation_requirements.md`

    请基于这些输入完成下面的原始需求：

    workspace 有 `app_config.json`（应用配置）、`rule_engine.py`（规则引擎骨架）和 `implementation_requirements.md`（实现与验收要求）。

    请按要求补完整个规则引擎，并写一个 `test_rules.py` 覆盖持久化、排序、提示前缀、配置建议和重启加载场景。

    交付要求：
    - 需要修改已有文件时，请把修改后的版本写到 `/workspace/` 下对应的原项目相对路径。
    - 需要新增文件时，请按需求中的文件名或上面列出的目标路径写到 `/workspace/` 下。
    - 最终回复只需概述完成情况、关键改动和生成的文件；不要只在最终回复中贴代码或报告正文。
