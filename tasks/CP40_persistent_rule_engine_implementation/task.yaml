judge_rubric: |
  ## Expected Behavior

  1. Agent reads both files
  2. Agent implements all 5 TODO methods in rule_engine.py
  3. Agent creates test_rules.py
  4. Agent runs test to verify persistence across re-instantiation

  ## Grading Criteria

  - [ ] add_rule_implemented (not NotImplementedError)
  - [ ] remove_rule_implemented
  - [ ] get_active_rules_implemented
  - [ ] build_prompt_prefix_implemented
  - [ ] apply_rules_implemented
  - [ ] rules_persisted_to_json (app_config.json modified with rules)
  - [ ] rule_id_unique (uses uuid or timestamp-based ID)
  - [ ] priority_sorting (get_active_rules returns descending priority)
  - [ ] test_script_exists
  - [ ] config_other_fields_preserved (app.name, modules, etc. unchanged)

  ## LLM Judge Rubric

  ### Criterion 1: Implementation Correctness (Weight: 35%)

  **Score 1.0**: All 5 methods correctly implemented. add_rule generates unique IDs and persists. remove_rule finds by ID and persists. get_active_rules filters active=True and sorts by priority descending. build_system_prompt_prefix formats as numbered list. apply_rules_to_config maps language/theme rules to config paths.
  **Score 0.75**: 4 of 5 methods correct.
  **Score 0.5**: 3 methods correct.
  **Score 0.25**: 1-2 methods correct.
  **Score 0.0**: None implemented or all raise NotImplementedError.

  ### Criterion 2: Persistence Guarantee (Weight: 30%)

  **Score 1.0**: Rules written to app_config.json on every add/remove. Re-instantiating RuleEngine loads rules from file. Test proves persistence by creating new instance and checking rules exist. Config structure preserved (rules array only, other fields untouched).
  **Score 0.75**: Persistence works but test doesn't verify re-instantiation.
  **Score 0.5**: Saves to file but loading has issues.
  **Score 0.25**: Partial persistence.
  **Score 0.0**: No persistence (memory only).

  ### Criterion 3: Rule-to-Config Mapping (Weight: 20%)

  **Score 1.0**: apply_rules_to_config correctly maps: "Chinese" rules -> frontend.language="zh-CN", "dark theme" -> frontend.theme="dark", model display rules -> ai config suggestions. Returns structured dict of config path -> value.
  **Score 0.75**: Maps 2 of 3 rule types correctly.
  **Score 0.5**: Maps 1 rule type.
  **Score 0.25**: Returns something but wrong mappings.
  **Score 0.0**: Not implemented.

  ### Criterion 4: Test Coverage (Weight: 15%)

  **Score 1.0**: Test covers full CRUD cycle: add 3 rules, list sorted, generate prefix, check config suggestions, remove 1, re-instantiate and verify 2 remain. Prints clear pass/fail for each step.
  **Score 0.75**: Tests most operations but misses re-instantiation check.
  **Score 0.5**: Basic test covering add and list.
  **Score 0.25**: Minimal test.
  **Score 0.0**: No test.
