judge_rubric: "Reward correct diagnosis and fix of: (1) AnalyserNode must be connected to AudioContext.destination via a silent GainNode (gain=0) to keep audio graph active in Electron/Chromium; (2) REQUIRED_SAMPLES must be 512 for Silero VAD v4 (not 480 which is v3); (3) Frame size in VADController must match the service's expected size; (4) READ_INTERVAL_MS should be reduced to ~50ms for responsive detection; (5) Default probabilityThreshold should be lowered from 50% to ~40%."

reference_solution: |
  Fix 1 (Critical): In VADController.ts startMicrophone(), after sourceNode.connect(analyser),
  add a silent GainNode connection:
    const silentGain = this.audioContext.createGain();
    silentGain.gain.value = 0;
    this.analyser.connect(silentGain);
    silentGain.connect(this.audioContext.destination);
  This keeps the AnalyserNode active in Electron's Chromium without speaker output.

  Fix 2 (Critical): In SileroVADService.ts, change REQUIRED_SAMPLES from 480 to 512.
  The v4 model (identified by LSTM state shape [2,1,128]) requires 512-sample frames.

  Fix 3: In VADController.ts processAudioFrame(), update frameSize from 480 to 512.

  Fix 4: Change READ_INTERVAL_MS from 100 to 50 (or lower) for faster response.

  Fix 5: In types.ts, change DEFAULT_VAD_CONFIG.probabilityThreshold from 50 to 40.

