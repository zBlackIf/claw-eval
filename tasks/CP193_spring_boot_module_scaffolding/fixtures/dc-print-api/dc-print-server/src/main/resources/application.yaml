spring:
  application:
    name: dc-print-api

  profiles:
    active: dev

  main:
    allow-circular-references: true

  # Servlet 配置
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 32MB

  # Jackson 配置项
  jackson:
    serialization:
      write-dates-as-timestamps: true
      write-date-timestamps-as-nanoseconds: false
      write-durations-as-timestamps: true
      fail-on-empty-beans: false

  # Cache 配置项
  cache:
    type: REDIS
    redis:
      time-to-live: 1h

server:
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
      force: true

--- #################### 接口文档配置 ####################

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui

--- #################### 芋道相关配置 ####################

yudao:
  info:
    version: 1.0.0
    base-package: cn.iocoder.yudao
  tenant:
    enable: true
    ignore-urls:
      - /jmreport/*
    ignore-tables:
    ignore-caches:
      - user_role_ids
      - permission_menu_ids
      - oauth_client
