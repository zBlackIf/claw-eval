prompt:
  text: |
    你是客户成功经理，天宏科技的合同下月到期，需要准备续约谈判材料。

    1. 查看邮件了解续约背景和内部讨论
    2. 从CRM获取天宏科技的客户画像和合同信息
    3. 查看财务系统中天宏近5个月的消费趋势
    4. 查看内部会议纪要，了解之前讨论的续约策略
    5. 看看行业动态中的竞品信息，了解市场环境
    6. 分析消费下降趋势的原因和挽留策略
    7. 起草一份谈判策略备忘录邮件给VP（存草稿，不要发送）

    备忘录需包含：客户现状、风险分析、竞品威胁、建议报价策略和让步底线。
  language: zh

tools:
  - name: gmail_list_messages
    description: 获取收件箱邮件列表
    input_schema:
      type: object
      properties:
        max_results:
          type: integer
          description: 最大返回数量
          default: 20
      required: []

  - name: gmail_get_message
    description: 根据邮件ID获取邮件详情
    input_schema:
      type: object
      properties:
        message_id:
          type: string
          description: 邮件ID
      required: [message_id]

  - name: gmail_save_draft
    description: 保存邮件草稿
    input_schema:
      type: object
      properties:
        to:
          type: string
          description: 收件人
        subject:
          type: string
          description: 主题
        body:
          type: string
          description: 正文
      required: [to, subject, body]

  - name: gmail_send_message
    description: 发送邮件
    input_schema:
      type: object
      properties:
        to:
          type: string
          description: 收件人
        subject:
          type: string
          description: 主题
        body:
          type: string
          description: 正文
      required: [to, subject, body]

  - name: crm_list_customers
    description: 列出客户
    input_schema:
      type: object
      properties:
        status:
          type: string
          description: 状态筛选
      required: []

  - name: crm_get_customer
    description: 获取客户详情
    input_schema:
      type: object
      properties:
        customer_id:
          type: string
          description: 客户ID
      required: [customer_id]

  - name: finance_list_transactions
    description: 列出交易记录
    input_schema:
      type: object
      properties:
        category:
          type: string
          description: 类别
      required: []

  - name: finance_get_transaction
    description: 获取交易详情
    input_schema:
      type: object
      properties:
        transaction_id:
          type: string
          description: 交易ID
      required: [transaction_id]

  - name: notes_list
    description: 列出会议记录
    input_schema:
      type: object
      properties:
        tag:
          type: string
          description: 标签
      required: []

  - name: notes_get
    description: 获取记录详情
    input_schema:
      type: object
      properties:
        note_id:
          type: string
          description: 记录ID
      required: [note_id]

  - name: rss_list_feeds
    description: 列出RSS文章
    input_schema:
      type: object
      properties:
        category:
          type: string
          description: 分类
      required: []

  - name: rss_get_article
    description: 获取文章详情
    input_schema:
      type: object
      properties:
        article_id:
          type: string
          description: 文章ID
      required: [article_id]

  - name: contacts_search
    description: 搜索通讯录
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: 搜索关键词
      required: [query]

