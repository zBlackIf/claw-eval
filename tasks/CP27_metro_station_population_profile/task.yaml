judge_rubric: |
  评估 agent 是否完成了全部17个站点的人口画像分析。

  ## 完整性
  - 是否完成了全部17个站点
  - 每个站点是否包含5个部分（精炼描述、人群构成、出行特征、设施需求、建议）
  - 原有4个站点数据是否保留

  ## 数据准确性
  - 关键数据点是否正确引用（如棠景密度4.56、江高大学生69.08%）
  - 是否存在跨站点横向比较

  ## 评分标准
  - 0.9-1.0: 全部17站完成，格式一致，数据准确
  - 0.7-0.8: 大部分完成但有遗漏或格式不一致
  - 0.4-0.6: 完成不到一半或格式混乱
  - 0.0-0.3: 未完成

reference_solution: |
  追加17个站点的人口画像，每站包含精炼描述+人群构成+出行特征+设施需求+建议5部分。

primary_dimensions: [completion, robustness, communication]
