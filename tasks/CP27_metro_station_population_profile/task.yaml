    10. **白云城市中心**: 0.66万人, 密度0.84, 25-34岁56.13%(最高), 45岁以下80%+
    11. **秀全公园**: 1.18万人, 密度1.50, 25-34岁45.71%, 家有小学生44.59%(第二高), 初中生22.81%
    12. **江高**: 0.69万人, 密度0.88, 18-24岁69.08%(极高), 大学生62%+(最高)
    13. **梓元岗**: 2.17万人, 密度2.76, 25-34岁45.78%, 大学生32.13%, 家有小学生42.03%
    14. **凤浦公园**: 0.54万人, 密度0.69, 25-34岁48.42%, 大学生39.03%, 通勤63%(最高)
    15. **远景**: 3.52万人, 密度4.48(第二高), 25-34岁45.64%, 家有小学生40.13%, 通勤55%
    16. **槎头**: 1.69万人, 密度2.15, 25-34岁44.01%, 家有小学生42.37%
    17. **梅东路**: 2.66万人, 密度3.39, 25-34岁34.45%(偏低), 中高收入32%+, 岗位>人口
    18. **仓边路**: 2.30万人, 密度2.93, 25-44岁52.04%, 家有小学生39.69%, 岗位密度4.21>人口
    19. **烈士陵园**: 3.19万人, 密度4.06, 25-44岁54.75%, 家有小学生38.15%
    20. **京溪路**: 1.94万人, 密度2.47, 25-34岁46.29%, 18-24岁9.82%, 大学生34.18%
    21. **棠景**: 3.58万人, 密度4.56(最高), 25-34岁46.62%, 家有小学生42.01%(最高)

    ### 输出格式要求

    将结果追加到 existing_stations_v4.txt 文件末尾。

    每个站点格式：
    1. 精炼描述（1句话突出最核心特征）
    2. 人群构成（横向对比+绝对规模，3-4句话）
    3. 出行特征（3个量化要点）
    4. 设施需求（3个要点）
    5. 建议（3条建议，引用前文数据）
