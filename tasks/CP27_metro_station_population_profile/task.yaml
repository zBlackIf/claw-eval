prompt:
  text: |
    <!-- CLAW-EVAL-FIXTURE-PREAMBLE -->
    以下文件已注入到容器内，请按给出的容器绝对路径读取（容器 WORKDIR = `/workspace`）：

    - `/workspace/fixtures/existing_stations_v4.txt`

    所有产物请落到 `/workspace/...` 下；评分仅捕获 `/workspace/` 内的文件。

    请完成所有剩余18个地铁站点的人口画像分析，添加到v4版本文件中。

    ### 已完成站点（4个，见 existing_stations_v4.txt）
    1. 岭南广场站 2. 赤岗站 3. 南浦西站 4. 石牌南站

    ### 需要完成的18个站点数据：

    5. **纪念堂**: 1.59万人, 密度2.02, 25-44岁52.7%, 中老年占比偏高, 家有小学生40.99%, 岗位>人口
    6. **西场**: 2.55万人, 密度3.25, 25-34岁39.98%, 45岁以下73%, 家有小学生40.38%
    7. **松溪**: 0.98万人, 密度1.25, 25-34岁46.44%, 家有小学生43.43%(最高)
    8. **南漖**: 1.43万人, 密度1.82, 25-34岁42.15%, 家有1-3岁10.7%, 中高收入38%
