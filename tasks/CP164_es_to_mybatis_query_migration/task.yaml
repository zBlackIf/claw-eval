prompt:
  text: |
    我们的安全管理系统数据量很小（<1万条记录，<10个并发用户），之前用的 ES 查询
    完全是过度设计。现在要把 service/impl 下面三个服务的 ES 查询全部改成
    MyBatis-Plus 的 LambdaQueryWrapper 直接查数据库：

    1. MessageServiceImpl - queryPage 方法要支持按 msgType 筛选、keyword
       模糊搜索 title 和 content、过滤已删除记录，分页查询
    2. MessageUserServiceImpl - countUnreadByUserId 方法不要再走 ES，
       直接用 LambdaQueryWrapper count
    3. HazardServiceImpl - queryPage 方法要支持按 hazardLevel、status、
       hazardType、responsibleId、deptId 筛选，keyword 模糊搜索
       hazardNo、description、location，过滤已删除记录，分页查询

    要求：
    - 完全移除 UniversalSearchService 和 UniversalSearchAuthFilter 的依赖
    - 移除对应的 import 和 @Autowired 字段
    - 保持原有的 VO 转换逻辑不变
    - keyword 搜索要用 like + or 组合实现多字段模糊匹配

    代码在 /workspace/fixtures/ruoyi-safe/src/ 下面。
