judge_rubric: "Reward complete ES-to-MyBatis-Plus migration: all three services (MessageServiceImpl, MessageUserServiceImpl, HazardServiceImpl) must remove UniversalSearchService dependency and use LambdaQueryWrapper instead. MessageServiceImpl must support keyword LIKE on title+content with OR, filter by msgType, exclude deleted. MessageUserServiceImpl count must use LambdaQueryWrapper. HazardServiceImpl must support multi-condition AND filters plus keyword OR-LIKE on 3 fields. All ES imports must be removed. No type-conversion compilation issues."

reference_solution: |
  MessageServiceImpl:
  - Remove @Autowired UniversalSearchService
  - Remove UniversalSearch* imports
  - queryPage: build LambdaQueryWrapper<Message> with:
    - .eq(Message::getDelFlag, 0)
    - .eq(Message::getMsgType, form.getMsgType()) when not null
    - .and(w -> w.like(Message::getTitle, keyword).or().like(Message::getContent, keyword)) when keyword not blank
    - Use page(new Page<>(pageNum, pageSize), wrapper).convert(this::toDetailVO)

  MessageUserServiceImpl:
  - Remove @Autowired UniversalSearchService
  - countUnreadByUserId: use count(new LambdaQueryWrapper<MessageUser>()
      .eq(MessageUser::getUserId, userId)
      .eq(MessageUser::getReadFlag, MessageUser.READ_FLAG_UN_READ))
  - Note: MyBatis-Plus count() returns long, must handle type correctly

  HazardServiceImpl:
  - Remove @Autowired UniversalSearchService
  - queryPage: build LambdaQueryWrapper<Hazard> with:
    - .eq(Hazard::getDelFlag, 0)
    - .eq for each non-null filter (hazardLevel, status, hazardType, responsibleId, deptId)
    - .and(w -> w.like(Hazard::getHazardNo, keyword).or().like(Hazard::getDescription, keyword).or().like(Hazard::getLocation, keyword))
    - Use page(new Page<>(pageNum, pageSize), wrapper).convert(this::convertToVO)

