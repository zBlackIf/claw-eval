services: []

prompt:
  text: |
    我刚完成了一次 MySQL 从1标准硬件维护，发现现有 SOP 文档有几个地方跟实际操作不一致，
    需要按以下实操经验改一下 /workspace/fixtures/ops-sop/slave1-hardware-maintenance.md：

    1. 操作时间窗口：非工作日可以提前到 21:00 开始（不用等到 22:00），公告时间也改成 21:00~24:00
    2. 停止 MySQL 实例的命令改成循环脚本：
       for PORT in $(/usr/local/mysql/reportMysql.sh | grep 'runing' | awk '{print $1}'); do /usr/local/mysql/stopMysql.sh $PORT; done
    3. 启动 MySQL 实例的命令改成：
       for PORT in $(/usr/local/mysql/reportMysql.sh | grep 'stopped' | awk '{print $1}'); do touch /data/mysql/mysql_$PORT/logs/localhost.err; chown mysql:mysql /data/mysql/mysql_$PORT/logs/localhost.err;/usr/local/mysql/startMysql.sh $PORT; done
    4. 恢复 keepalived 只执行 systemctl start keepalived，不要加 systemctl enable（不要开机启动）
    5. exec-02 业务迁移到主库那步，要加 processlist 检查命令确认从库无业务连接后才能继续：
       for PORT in $(/usr/local/mysql/reportMysql.sh | grep 'runing' | awk '{print $1}'); do mysql -h 127.0.0.1 -u$(grep '^user=' /usr/local/backup/config.conf | cut -d '=' -f2) -p$(grep '^password=' /usr/local/backup/config.conf | cut -d '=' -f2) -P $PORT -e "SHOW processlist"; done
    6. exec-09 和 acc-02 的主从同步检查统一改成循环命令：
       for PORT in $(/usr/local/mysql/reportMysql.sh | grep 'runing' | awk '{print $1}'); do mysql -h 127.0.0.1 -u$(grep '^user=' /usr/local/backup/config.conf | cut -d '=' -f2) -p$(grep '^password=' /usr/local/backup/config.conf | cut -d '=' -f2) -P $PORT -e "SHOW slave status\G"; done

    改完以后确保文档结构完整、格式统一。
