judge_rubric: "Reward correct SOP update: (1) time window updated to 21:00 for non-working days in announcement-defaults and prep steps, (2) exec-05 stop command uses reportMysql.sh loop instead of single port, (3) exec-08 start command uses stopped-port loop with touch/chown, (4) exec-11 keepalived only start without enable, (5) exec-02 adds processlist loop check with config.conf credentials, (6) exec-09 and acc-02 use SHOW slave status loop. Hidden easy checks (15%): proper fenced code blocks for multi-line commands, removal of orphan single-port references, document structure preserved, flow condition syntax consistency. Hidden hard checks (30%): prep-01 time consistency (update step 4 from 22:00 to reflect 21:00 for non-working days), exec-02 flow condition updated to mention processlist/connection confirmation, exec-05 netstat verification updated for multi-port, keepalived rationale note explaining why no enable (split-brain risk), exec-03/exec-11 disable/start asymmetry documented."

reference_solution: |
  Update the SOP markdown file with all 6 requested changes:
  - announcement-defaults: 开始时间 changed to 21:00, added note about non-working days
  - prep-01: update step 4 from "22:00 后" to include "非工作日 21:00" option
  - exec-02: add SHOW processlist loop command, update flow condition to mention "确认从库无业务连接后"
  - exec-05: replace single-port stopMysql.sh with reportMysql.sh loop; update netstat check to not reference single {port}
  - exec-08: replace single-port startMysql.sh with stopped-port loop including touch/chown
  - exec-09: replace manual show slave status with loop command using config.conf
  - exec-11: remove systemctl enable, keep only systemctl start, add note explaining why (避免自动启动/脑裂风险)
  - acc-02: replace manual show slave status with loop command
  Hidden quality signals: use fenced code blocks (```bash) for multi-line commands, maintain cross-section consistency

