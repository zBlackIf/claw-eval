judge_rubric: "Reward complete Strategy 1 refund implementation: (1) validation of channel capacity constraint, amount totals match, item existence; (2) reversal records for every active payment record with negated amounts and original transaction_id; (3) gateway refund instructions matching customer channel choices; (4) recharge records with correct remaining amounts, is_internal_adjustment=true, original_transaction_id preserved; (5) NO separate internal transfer/调账 step (Strategy 1 doesn't need it since everything is zeroed and rebuilt)."

reference_solution: |
  processRefund should:
  1. Sum refund_items amounts and refund_channels amounts; return error if mismatch.
  2. Group activeRecords by pay_mode, sum per-channel totals.
  3. For each refund_channel, check amount <= channel's original total; return error if exceeded.
  4. Check each refund item_id exists in allocations.
  5. Generate reversal_records: map each activeRecord to { original_record_id, pay_mode, amount: -record.amount, transaction_id }.
  6. Generate gateway_refunds: map refund_channels to { pay_mode, amount, original_transaction_id from matching active record }.
  7. Generate recharge_records: for each channel, remaining = original_total - refund_amount (if > 0), with is_internal_adjustment: true, original_transaction_id from that channel's record.
  8. Return { success: true, reversal_records, gateway_refunds, recharge_records }.

primary_dimensions: [completion, communication, safety]
