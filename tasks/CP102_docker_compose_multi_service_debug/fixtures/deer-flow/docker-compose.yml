version: "3.8"

services:
  deer-flow-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "2026:80"
    depends_on:
      - deer-flow-api
      - deer-flow-provisioner
    environment:
      - NEXT_PUBLIC_API_URL=http://192.168.65.2:2024

  deer-flow-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "2024:2024"
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - kubeconfig:/root/.kube/config

  deer-flow-provisioner:
    build:
      context: .
      dockerfile: Dockerfile.provisioner
    env_file:
      - .env
    depends_on:
      - deer-flow-api

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - deer-flow-web
      - deer-flow-api

volumes:
  kubeconfig:
