server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://deer-flow-web:80;
        proxy_set_header Host $host;
    }

    location /api/langgraph/ {
        # BUG: Using external IP instead of Docker service name
        proxy_pass http://192.168.65.2:2024/;
        proxy_set_header Host $host;
    }

    location /api/ {
        # BUG: Same issue - should use Docker service name
        proxy_pass http://192.168.65.2:2024/;
        proxy_set_header Host $host;
    }
}
