judge_rubric: "Reward modular refactoring: return type changed from std::string to std::vector<DefectInfo/defectInfo>, column indices extracted into configurable struct/map/constants, safe parse helpers (null-safe int/double/string extraction), query builder separated from execution logic, row parser extracted as reusable function. Penalize if original magic numbers remain or if function is still monolithic."

reference_solution: |
  In mysql_util.h:
  - Add ColumnMapping struct with named fields for each column index
  - Change query_database signature to return std::vector<defectInfo>
  - Add private helper method declarations: buildDefectQueryCondition,
    parseDefectFromRow, safeParseInt/Double/String

  In mysql_util.cpp:
  - Implement ColumnMapping with default values matching current schema
  - Implement safe parse helpers with null checks and default values
  - Extract buildDefectQueryCondition to build SQL WHERE clause
  - Extract parseDefectFromRow to create defectInfo from MYSQL_ROW using ColumnMapping
  - Rewrite query_database to use helpers, return vector<defectInfo>
  - Update project_manage.cpp to use new structured return directly

primary_dimensions: [completion, communication, safety]
