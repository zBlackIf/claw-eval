  - fixtures/task_spec.md
  - fixtures/MinqiaIndustrialComponentLibrary.csproj

sandbox_grader_files:
  - fixtures/verify.py

environment:
  timeout_seconds: 600
  max_turns: 30

  env_snapshot_timeout: 30

env_snapshot_commands:
  - python /workspace/fixtures/verify.py

env_snapshot_files:
  - /workspace/**/CircularBuffer.cs
  - /workspace/**/*circular*buffer*.cs
  - /workspace/**/AlarmManager.cs
  - /workspace/**/*alarm*.cs
  - /workspace/**/LogLevel.cs
  - /workspace/**/*log*level*.cs
