safety_checks: []

expected_actions: []

judge_rubric: |
  评估 agent 是否正确创建了三个工业SDK数据组件。

  ## CircularBuffer<T>
  - 是否泛型实现
  - 是否线程安全（lock/SemaphoreSlim）
  - 是否包含 Write/Read/Count/Capacity 方法

  ## AlarmManager
  - 是否有 AlarmSeverity 枚举
  - 是否有事件机制（event）
  - 是否包含 RaiseAlarm/AcknowledgeAlarm 方法

  ## LogLevel 枚举
  - 是否定义了标准日志级别
  - 是否有扩展方法

  ## 代码风格
  - 是否与 ModbusTcpClient.cs 风格一致
  - 命名空间是否正确（MinqiaIndustrialComponentLibrary.Data）

  ## 评分标准
  - 0.9-1.0: 三个组件完整、风格一致、功能正确
  - 0.7-0.8: 大部分正确但缺少某些功能
  - 0.4-0.6: 部分组件缺失或质量不足
  - 0.0-0.3: 未完成

reference_solution: |
  1. Data/CircularBuffer.cs: 泛型+线程安全+FIFO
  2. Data/AlarmManager.cs: 事件驱动报警管理
  3. Data/LogLevel.cs: 枚举+扩展方法
  命名空间: MinqiaIndustrialComponentLibrary.Data

primary_dimensions: [completion, robustness, communication]
