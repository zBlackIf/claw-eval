scoring_components: []
safety_checks: []
expected_actions: []

judge_rubric: "Reward a complete audit service that: creates an AuditService class as a dedicated service, implements hash-chain integrity (each record hashes with previous), uses date-based daily file rotation under files/audit/, covers all three event types (alarm, device control, task dispatch), provides tamper verification capability, and integrates cleanly with existing services via event listeners or direct wiring."

reference_solution: |
  Create src/services/AuditService.js:
  - Singleton class with log(eventType, data) method
  - Uses crypto.createHash('sha256') for hash chain
  - Each entry: {timestamp, eventType, data, prevHash, hash}
  - Daily file rotation: files/audit/YYYY-MM-DD.audit (JSON Lines)
  - Companion .chain file or inline verification
  - verify() method to validate chain integrity
  - Read-only enforcement via fs.chmodSync after write or O_APPEND flag

  Update src/app.js:
  - Import and instantiate AuditService
  - Wire event listeners: alarmService.on('alarm:triggered', ...)
  - Wire: deviceService.on('device:controlled', ...)
  - Wire: taskDispatcher events or wrap dispatch method

  Optional but strong:
  - Cron job (node-schedule) for daily rotation/archive
  - HTML/text report generation
  - Integrity check on startup

primary_dimensions: [completion, communication, safety]
