    FireBot 消防系统要加审计功能——在 files/ 下建一个 audit/ 目录，按日期生成审计
    日志。报警来了记一条、控制设备记一条、下发任务也记一条，时间戳要精确。日志写
    完之后只能看不能改，要是被人动过能查得出来。

    代码在 /workspace/fixtures/firebot/，你看看现有的 service 结构然后加上去。
