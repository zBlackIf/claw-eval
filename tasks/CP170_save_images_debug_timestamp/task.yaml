judge_rubric: "Reward correct conditional _save_images: when config logging.level == DEBUG, filenames include the ts timestamp variable; otherwise fixed names (raw.jpg/det.jpg). Must use project config logger (cfg.logging.level or logger.level/getEffectiveLevel), NOT Python stdlib logging.DEBUG import. Timestamp format should be preserved from original code."

reference_solution: |
  In _save_images, add a conditional check:
    if logger.level <= logging.DEBUG:  # or cfg.logging.level == "DEBUG"
        raw_path = save_dir / f"raw_{ts}.jpg"
        det_path = save_dir / f"det_{ts}.jpg"
    else:
        raw_path = save_dir / "raw.jpg"
        det_path = save_dir / "det.jpg"
  Key: use logger.level or logger.getEffectiveLevel() or cfg.logging.level
  for the check, not `import logging` as a new dependency for level detection.

