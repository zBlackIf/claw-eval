# =============================================================================
# 标定板参数（手眼标定用）
# =============================================================================
checkerboard_args:
  XX: 11
  YY: 8
  L: 0.025

# =============================================================================
# 目标检测模型配置
# =============================================================================
models:
  "0":
    weights: "model/best0.pt"
    class_names: ["screen_on", "screen_off", "button_1", "screen_button_1"]

# =============================================================================
# 日志配置
# =============================================================================
logging:
  level: "DEBUG"
  log_file: "logs/app.log"

# =============================================================================
# 服务配置
# =============================================================================
service:
  save_image: true
  save_raw: true
  save_det: true
  image_save_path: "images/inspection"
