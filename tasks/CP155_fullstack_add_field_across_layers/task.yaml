env_snapshot_commands:
  - python /workspace/fixtures/verify_solution.py

environment:
  timeout_seconds: 600
  max_turns: 18
  env_snapshot_timeout: 30

scoring_components: []
safety_checks: []
expected_actions: []

judge_rubric: "Reward complete field propagation: profile_signature as db.Column(db.String) in User model, included in to_dict(); added to UserCreateSchema, UserUpdateSchema (Optional), UserResponseSchema; service create_user passes field to User(), update_user conditionally assigns it; frontend form has input with name='profile_signature' plus label and optional image preview."

reference_solution: |
  1. models.py: Add `profile_signature = db.Column(db.String(512), nullable=True)`
     to User class, add "profile_signature": self.profile_signature to to_dict().
  2. schemas.py: Add `profile_signature: Optional[str] = None` to all three schemas.
  3. services.py: In create_user, add `profile_signature=data.profile_signature` to
     User() constructor. In update_user, add conditional assignment block.
  4. user_form.html: Add form-group with label "电子签名URL", input with
     name="profile_signature", and optional img preview showing existing value.

primary_dimensions: [completion, communication, safety]
