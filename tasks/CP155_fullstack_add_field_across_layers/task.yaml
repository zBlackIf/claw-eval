services: []

prompt:
  text: |
    用户管理系统需要增加"电子签名"功能。请在 /workspace/fixtures/user-management-app/
    中添加 profile_signature 字段（存储签名图片URL），需要贯穿所有层：

    1. 数据模型（models.py）
    2. 接口 Schema（schemas.py 的创建/更新/响应 schema）
    3. Service 层（services.py 的 create_user 和 update_user）
    4. 前端表单（templates/user_form.html 增加签名图片URL输入和预览）

    字段类型为字符串，存储签名图片的URL地址。确保新增和编辑用户时都能正确
    处理这个字段。
  language: zh

tools: []
tool_endpoints: []

