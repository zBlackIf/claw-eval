source_description: "Real session where user asks agent to remove unused pages, API modules, models, stores, and enums from a legacy Vue project. The new project only uses routes defined in mock/asyncRoutes.ts. Agent must analyze dependencies and safely remove all dead code while preserving active modules."

services: []

prompt:
  text: |
    We are developing a new project based on an old project's codebase. The page
    structure is similar so some places still reference old interfaces.

    I need you to delete the unused pages, API modules, models, stores, enums,
    mock files, and components that belong to the old project.

    The new project ONLY includes the pages defined in
    /workspace/fixtures/frontend-app/mock/asyncRoutes.ts — everything else is
    from the old project and should be removed.

    Also update the barrel (index.ts) files so they no longer re-export the
    removed modules. Make sure you don't break any of the active pages.
  language: en

