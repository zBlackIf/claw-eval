judge_rubric: "Reward a complete AuditService implementation: (1) dedicated AuditService class/module as singleton, (2) hash chain where each record contains prevHash forming a linked chain for tamper detection, (3) daily file rotation with date-based filenames, (4) defined event categories covering alarms/device-control/tasks, (5) verification method that can detect if any record was modified, (6) integration with existing services via event listeners, (7) file-level write protection (append-only or chmod)."

reference_solution: |
  src/services/AuditService.js:
  - Singleton class with methods: log(category, event, data), verify(date), verifyAll()
  - Uses crypto.createHash('sha256') to build hash chain
  - Each record: { seq, timestamp, category, event, data, prevHash, hash }
  - hash = sha256(seq + timestamp + category + event + JSON(data) + prevHash)
  - Daily rotation: files/audit/YYYY-MM-DD.audit (JSON Lines format)
  - Optional .chain file storing day-end hash for cross-day sealing
  - verify() re-reads file, recomputes each hash, checks chain continuity
  - fs.appendFileSync for write + fs.chmodSync(0o444) after first flush or on day-end
  - Subscribes to DeviceService('device:control'), AlarmService('alarm:triggered'),
    TaskScheduleService('task:dispatched') events
  - Categories: ALARM, DEVICE_CONTROL, TASK_DISPATCH, DEVICE_STATUS, SYSTEM

primary_dimensions: [completion, communication, safety]
