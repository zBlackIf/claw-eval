source_description: "Real session: implement post-evaluation (后评价) checks for a 2D CAD rebar drawing library. Key checks: rebar inside contour, anchor angle >= 90 deg, anchor-body clearance >= 16mm, spacing uniformity."

services: []

prompt:
  text: |
    cad2d_base 库（/workspace/fixtures/cad2d_base/）已有基本的 Entity、Polyline、
    LineRebar 和 geometry 模块。现在需要实现一个后评价（post-evaluation）模块，
    用来校验配筋图绘制结果是否满足工程规范。

    请在 cad2d_base/entities/ 下新建 evaluation.py，实现 evaluate_rebar_layout
    函数，接收参数：contour (Wire2D), dist_rebar_positions (list of (x,y) tuples),
    stirrups (list of LineRebar), config (dict)。

    需要实现以下检查项：
    1. 钢筋在轮廓内检查（考虑保护层 cover 内缩）
    2. 锚固段弯折角度检查（不小于 90 度）
    3. 锚固段与主体段净距检查（不小于 config 中的 min_anchor_clearance）
    4. 分布筋间距检查（不超过 config 中的 spacing）

    返回格式：{'passed': bool, 'checks': [{'name': str, 'passed': bool, 'detail': str}]}

    test_layout.py 里有测试数据可以验证：stirrup_0 有锚固贴近主体的问题，
    stirrup_2 有锚固角度问题，你的检查应该能识别出来。
  language: zh

