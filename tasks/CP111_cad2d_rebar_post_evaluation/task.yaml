judge_rubric: "Reward complete post-evaluation implementation: evaluate_rebar_layout function with (1) point-in-polygon check with cover offset for rebar containment, (2) vector angle computation at anchor bends >= 90 degrees, (3) anchor-to-body segment distance/clearance check >= 16mm, (4) distribution rebar spacing check. Must return structured dict with 'passed' bool and 'checks' list. Must correctly identify violations in test_layout stirrup_0 (clearance) and stirrup_2 (angle)."

reference_solution: |
  In cad2d_base/entities/evaluation.py:
  - evaluate_rebar_layout(contour, dist_rebar_positions, stirrups, config) -> dict
  - _check_rebars_inside_contour(): point-in-polygon with cover offset
  - _check_anchor_angles(): vector angle at each bend point >= 90 deg
  - _check_anchor_clearance(): point-to-segment distance between anchor and body
  - _check_spacing(): consecutive rebar distance <= max spacing
  - Returns {'passed': bool, 'checks': [{'name': str, 'passed': bool, 'detail': str}]}
  - Correctly identifies stirrup_0 clearance violation and stirrup_2 angle violation

