judge_rubric: "Reward a complete desktop transfer cabin detail page that: (1) creates a dedicated component or extends DeviceDetailPage with desktop_transfer_cabin support, (2) displays all blood info fields (donation code, blood type, specification, category), (3) shows device code, status, datetime, operator, (4) includes batch/docking/heat-sealing concepts, (5) adds TypeScript interface for the cabin detail data, (6) integrates into the routing so the page can be reached, (7) maintains UI consistency with existing device pages (GlassCard, InfoRow, table patterns, cyan/slate color scheme)."

reference_solution: |
  Option A: Create a new file src/components/pages/DesktopTransferCabinPage.tsx with:
  - Left panel: GlassCard showing device info (code, status), current batch info
  - Right panel: Table of blood items (donation code, blood type, spec, category)
  - Operation records with operator, timestamp
  - Heat seal time display per batch
  - Integrate in DeviceDetailPage routing for desktop_transfer_cabin type

  Option B: Extend DeviceDetailPage.tsx by adding:
  - DesktopTransferCabinLeftPanel component
  - DesktopTransferCabinRightPanel component
  - Routing case for desktop_transfer_cabin in the main render

  Both require:
  - New interface DesktopTransferCabinDetail in types/index.ts
  - Mock data for cabin batches in mock-data.ts
  - UI consistent with AutoSorter/QuickFreezer patterns

primary_dimensions: [completion, communication, safety]
