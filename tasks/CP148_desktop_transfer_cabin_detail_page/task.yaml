source_description: "从真实用户会话提取：为医疗血液设备监控系统中的桌面式交接舱创建设备详情二级页面，展示血液信息、设备状态、操作者、接驳批次等数据，需与现有设备页面保持UI风格一致。"

services: []

prompt:
  text: |
    桌面式交接舱需要一个二级页面展示该节点相关数据。现有项目在
    /workspace/fixtures/blood-device-monitor/ 下，其他设备（自动分拣机、速冻机、
    离心机）的详情页已经实现好了，参考 DeviceDetailPage.tsx 的模式。

    桌面式交接舱的二级页面需要展示以下信息：
    - 血液详细信息：献血码、血型、规格、品类
    - 设备编号
    - 设备工作状态
    - 日期时间
    - 操作者
    - 物料的接驳热合时间

    请实现这个二级页面，要求：
    1. 与现有设备页面的交互和UI样式保持一致
    2. 有批次的概念，展示接驳批次信息
    3. 需要在 types 中补充相应的 TypeScript 类型定义
    4. 确保页面能从主路由正确渲染
  language: zh

