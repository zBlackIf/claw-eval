prompt:
  text: |
    我已经把原始项目素材放在容器的 `/workspace/fixtures/` 目录下，请把这些文件当作只读输入。

    输入文件如下（右侧是它在原项目中的相对路径）：
    - `/workspace/fixtures/challenge_info.json` -> `challenge_info.json`
    - `/workspace/fixtures/index_page.html` -> `index_page.html`
    - `/workspace/fixtures/control_page.html` -> `control_page.html`
    - `/workspace/fixtures/login_response.txt` -> `login_response.txt`
    - `/workspace/fixtures/jwt_token_sample.txt` -> `jwt_token_sample.txt`

    请基于这些输入完成下面的原始需求：

    你是一个 CTF 竞赛选手。请基于这些页面、登录响应和 token 样本复现这道 Web 题目的提权路径。

    **你的任务**：
    1. 分析登录流程、JWT 结构和控制台权限差异
    2. 找到可稳定进入管理员功能区的方法
    3. 编写 `exploit.py` 自动化登录与提权验证，脚本应便于切换目标地址
    4. 写一份 `writeup.md` 记录侦察、尝试、漏洞成因、payload 构造和结果验证

    交付要求：
    - 需要修改已有文件时，请把修改后的版本写到 `/workspace/` 下对应的原项目相对路径。
    - 需要新增文件时，请按需求中的文件名或上面列出的目标路径写到 `/workspace/` 下。
    - 最终回复只需概述完成情况、关键改动和生成的文件；不要只在最终回复中贴代码或报告正文。
