judge_rubric: "Reward a complete layered Spring Boot scheduled job implementation: AreaDepUpdateJob (implements Job, @Component, execute method with logging + error handling), AreaDepUpdateService interface + ServiceImpl (@Service, @Transactional, truncate-then-insert logic), AreaDepUpdateMapper interface (@Mapper) + XML mapper (namespace, truncate statement, insert-select with 3-level t_area join and GROUP BY). Deduct for missing layers, incorrect SQL join logic, or absent error handling."

reference_solution: |
  Under mobileHospital/:
  - job/AreaDepUpdateJob.java (implements Job, @Component, @Autowired service,
    execute() with try-catch, logging start/end/error, throws JobExecutionException)
  - service/AreaDepUpdateService.java (interface with truncateTable() + insertAreaDep())
  - service/impl/AreaDepUpdateServiceImpl.java (@Service, @Transactional,
    calls mapper.truncate then mapper.insertAreaDep)
  - mapper/AreaDepUpdateMapper.java (@Mapper interface with void truncate() + int insertAreaDep())
  - mapper/xml/AreaDepUpdateMapper.xml (namespace matches mapper, <delete> TRUNCATE TABLE t_area_dep,
    <insert> with the full 3-level join SQL: sys_depart JOIN t_area a ON area_code=district
    JOIN t_area b ON b.parent_id=a.id JOIN t_area c ON c.parent_id=b.id, GROUP BY)

