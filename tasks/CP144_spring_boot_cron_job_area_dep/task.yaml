services: []

prompt:
  text: |
    项目是 Jeecg-Boot（Spring Boot + MyBatis + Quartz），现在需要新建一个定时任务
    AreaDepUpdateJob，功能是定时清空 t_area_dep 表并重新写入统计数据。

    SQL 逻辑如下：先 truncate t_area_dep，然后执行：
    INSERT INTO t_area_dep
    (SELECT s.depart_name, s.area_name, s.town, count(0) as community_sum
     FROM (
       SELECT s.depart_name, a.area_name, b.area_name as town, c.area_name as village
       FROM sys_depart s
       JOIN t_area a ON a.area_code = s.district
       JOIN t_area b ON b.parent_id = a.id
       JOIN t_area c ON c.parent_id = b.id
       WHERE c.parent_id IS NOT NULL
     ) s
     GROUP BY s.depart_name, s.area_name, s.town)

    请参照 /workspace/fixtures/jeecg-boot-module-family/ 下已有的
    InstrumentPanelArchiveJob 的分层模式（Job → Service → Mapper + XML），
    创建完整的 AreaDepUpdateJob 相关文件。代码放到
    /workspace/jeecg-boot-module-family/src/ 下对应目录。

    要求：
    - Job 类实现 Quartz Job 接口
    - Service 层接口 + 实现
    - Mapper 接口 + XML（SQL 写在 XML 中）
    - 合理的日志和异常处理
  language: zh

