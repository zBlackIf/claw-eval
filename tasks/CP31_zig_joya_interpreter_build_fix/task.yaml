prompt:
  text: |
    我已经把原始项目素材放在容器的 `/workspace/fixtures/` 目录下，请把这些文件当作只读输入。

    输入文件如下（右侧是它在原项目中的相对路径）：
    - `/workspace/fixtures/joya.md` -> `joya.md`
    - `/workspace/fixtures/build.zig` -> `build.zig`
    - `/workspace/fixtures/src/main.zig` -> `src/main.zig`
    - `/workspace/fixtures/src/lexer.zig` -> `src/lexer.zig`
    - `/workspace/fixtures/src/parser.zig` -> `src/parser.zig`
    - `/workspace/fixtures/src/ast.zig` -> `src/ast.zig`
    - `/workspace/fixtures/examples/hello.joya` -> `examples/hello.joya`
    - `/workspace/fixtures/zig_016_migration.md` -> `zig_016_migration.md`

    请基于这些输入完成下面的原始需求：

    D:\joya\joya.md 是我的任务，D:\joya 作为工作空间。

    zig build 报错了：
    ```
    build.zig:9:10: error: no field named 'root_source_file' in struct 'Build.ExecutableOptions'
    ```

    我用的是 Zig 0.16.0。帮我修好 build.zig，然后把编译错误都修掉（lexer、parser里有unused variable之类的warning当error处理了），让整个项目能 zig build 成功并运行 examples/hello.joya。

    交付要求：
    - 需要修改已有文件时，请把修改后的版本写到 `/workspace/` 下对应的原项目相对路径。
    - 需要新增文件时，请按需求中的文件名或上面列出的目标路径写到 `/workspace/` 下。
    - 最终回复只需概述完成情况、关键改动和生成的文件；不要只在最终回复中贴代码或报告正文。
  language: zh
