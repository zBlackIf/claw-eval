judge_rubric: |
  ## Expected Behavior

  1. Agent reads joya.md to understand the project structure
  2. Agent fixes build.zig for Zig 0.16.0 API (root_module pattern instead of root_source_file)
  3. Agent fixes lexer.zig unused local constant
  4. Agent fixes parser.zig unused function parameter and var->const issues
  5. Agent creates interpreter.zig if missing
  6. Project should build and run the example

  ## Grading Criteria

  - [ ] build_zig_fixed: build.zig uses Zig 0.16.0 API (root_module or addExecutable new signature) (RED LINE)
  - [ ] lexer_compiles: lexer.zig has no unused variable errors
  - [ ] parser_compiles: parser.zig has no unused parameter or var-should-be-const errors
  - [ ] interpreter_exists: interpreter.zig exists with basic tree-walking implementation
  - [ ] example_structure: examples/hello.joya preserved and parseable by the implementation

  ## LLM Judge Rubric

  ### Criterion 1: Zig 0.16.0 API Knowledge (Weight: 30%)
    - 1.0: Correctly uses the Zig 0.16.0 Build API (root_module with .root_source_file sub-field, or correct addExecutable signature), build.zig compiles
    - 0.75: Close but minor API detail wrong
    - 0.5: Shows awareness of API change but wrong fix
    - 0.25: Tries multiple approaches without success
    - 0.0: Does not address the build.zig API issue

  ### Criterion 2: Compiler Error Resolution (Weight: 25%)
    - 1.0: Fixes all compiler errors (unused vars, unused params, var->const) correctly using Zig idioms (_ = self, const instead of var)
    - 0.75: Fixes most errors but one remains
    - 0.5: Fixes some but introduces new errors
    - 0.25: Attempts fixes but breaks other things
    - 0.0: Does not address compiler errors

  ### Criterion 3: Interpreter Implementation (Weight: 25%)
    - 1.0: Complete interpreter.zig with variable storage (HashMap), print support, arithmetic evaluation, and if/else execution
    - 0.75: Handles print and variables but missing if/else
    - 0.5: Basic skeleton that handles some cases
    - 0.25: Stub only
    - 0.0: No interpreter implementation

  ### Criterion 4: Overall Project Coherence (Weight: 20%)
    - 1.0: All files work together, AST types match between parser and interpreter, example can be parsed and executed
    - 0.75: Most files coherent but one minor mismatch
    - 0.5: Files exist but integration has issues
    - 0.25: Significant mismatches between modules
    - 0.0: Project does not cohere
