judge_rubric: "Reward a complete cgroup v2 resource management solution: (1) early-boot SysV init script that verifies cgroup2 mount, enables controllers via subtree_control, creates business cgroup with cpuset+memory limits; (2) helper library with reusable functions for moving processes to cgroups; (3) proper resource limits - cpuset.cpus=0-1, memory.max~300MB, ideally memory.high soft limit and swap disabled; (4) IRQ affinity setup binding UART/USB interrupts to CPU2+3 via smp_affinity; (5) modification of 4 service scripts to integrate cgroup placement on start/restart; (6) background watcher/polling mechanism for the dhd_dpc WiFi kernel thread that appears after driver load."

reference_solution: |
  Create package/snapmaker/cgroup_mgmt/ with:
  - S05cgroup_setup: SysV init script (priority 05) that checks cgroup v2 mount,
    enables cpuset+cpu+memory controllers, creates /sys/fs/cgroup/business with
    cpuset.cpus=0-1, cpuset.mems=0, memory.high=256MB, memory.max=300MB,
    memory.swap.max=0; sets IRQ affinity for UART/USB to 0x0c (CPU2+3);
    starts background watcher polling for dhd_dpc thread.
  - cgroup_helper.sh: Sourceable library with cgroup_add_proc(),
    cgroup_add_proc_by_name(), cgroup_add_from_pidfile() functions.
  - Modify S61moonraker, S99screen, S50nginx, S91unisrv to source
    cgroup_helper.sh and call cgroup placement after process start.

primary_dimensions: [completion, communication, safety]
