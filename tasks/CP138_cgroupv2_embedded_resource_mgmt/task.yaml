source_description: "Real user session: configuring cgroup v2 resource isolation for a Buildroot-based 3D printer system (RK3562, Linux 6.1, BusyBox SysV init). Agent must create init scripts that set up cgroup hierarchy, configure resource limits, handle IRQ affinity, integrate with existing service scripts, and deal with a late-appearing WiFi kernel thread."

services: []

prompt:
  text: |
    我有一个基于 Buildroot 的嵌入式 Linux 系统（4核 ARM, Linux 6.1, BusyBox SysV init），
    用于运行 3D 打印机。系统服务启动脚本在 /workspace/fixtures/buildroot-project/ 下面。

    关键进程 klippy（由 S60klipper 启动）通过 UART 和 USB 与 MCU 通讯，必须保证充足的
    CPU 和内存资源。我需要用 cgroup v2 做资源隔离：

    1. klippy 和系统进程留在 root cgroup，不限制
    2. 以下进程放到 business 组，限制只能跑在 CPU0-1，内存最多 300MB：
       - moonraker（S61moonraker）
       - gui（S99screen）
       - nginx（S50nginx）
       - unisrv（S91unisrv）
       - dhd_dpc（WiFi 驱动内核线程，在 WiFi 驱动加载后才出现）
    3. UART 和 USB 的中断要绑定到 CPU2+CPU3，确保及时处理
    4. 进程被脚本重启时仍然会被划入对应的 cgroup 组

    请在项目目录下实现完整方案：
    - 创建一个早期启动的 init 脚本来初始化 cgroup 结构和资源限制
    - 创建 helper 库让其他启动脚本能方便地把进程移入 business cgroup
    - 修改现有的 4 个服务脚本（moonraker/gui/nginx/unisrv）集成 cgroup 管理
    - 处理 dhd_dpc 内核线程的延迟出现问题
