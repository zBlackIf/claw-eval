source_description: "Real user session: AMIS low-code merchant info page. Three tasks: (1) imagesQueryAdaptor ignores permissField param — needs filtering by pic_type when permission denied; (2) settlement protocol button invisible due to wrong data scope in input-table visibleOn; (3) duplicated onClick handlers need refactoring."

services: []

prompt:
  text: |
    商户详情页有两个问题要修，代码在 /workspace/fixtures/merch-info-app/src/ 下面：

    1. viewImagesDialog.ts 里的 imagesQueryAdaptor 函数已经接收了 permissField 参数，
       但完全没用。需求：如果传了 permissField，就用 btnPermission 判断是否有权限，
       没权限就按 PERMISSION_FILTER_MAP 过滤掉对应 pic_type 的图片。没传 permissField
       则向后兼容显示全部。

    2. basicInfo/detail.ts 里的子商户表格（input-table），结算协议按钮
       有 agreement_type 为 "2" 的数据但按钮不显示，收单协议（agreement_type "1"）
       却正常。帮忙排查修复。

    3. detail.ts 里收单协议和结算协议的 onClick handler 有大量重复代码，
       把 click 逻辑封装成可复用函数。
