judge_rubric: "Reward: (1) imagesQueryAdaptor actually uses permissField to call btnPermission and filters newList by pic_type via PERMISSION_FILTER_MAP when permission denied, with backward compat when no permissField; (2) detail.ts settlement protocol visibleOn fixed from data.sign_info to sign_info (row scope in input-table); (3) onClick handlers extracted into named reusable functions reducing duplication."

reference_solution: |
  viewImagesDialog.ts:
  - Add: if (permissField) { if (!btnPermission(permissField)) { filterList = newList.filter(item => !PERMISSION_FILTER_MAP[permissField]?.includes(item.pic_type)) } }
  - Return filterList instead of newList when filtered

  detail.ts:
  - Fix visibleOn: change all 'data.sign_info' to 'sign_info' in settlement protocol section
  - Extract: openElectronicProtocol(signInfo, agreementType, merchId) and openEsignProtocol(signInfo, agreementType, merchId) functions
  - Replace inline script blocks with calls to extracted functions

