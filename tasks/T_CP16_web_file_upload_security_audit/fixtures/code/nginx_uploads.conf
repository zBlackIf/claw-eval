# /etc/nginx/conf.d/uploads.conf
# 上传目录 nginx 配置
# ⚠️ 缺少：
#   - 阻止 .php / .phtml / .phar / .htaccess 等可执行扩展
#   - X-Content-Type-Options nosniff
#   - 没有限制 client_max_body_size，PHP 端 ini upload_max_filesize 默认 2M（与 100MB 矛盾）

location /uploads/ {
    root /var/www;
    autoindex off;
    # ⚠️ 没禁止 PHP 执行
}
