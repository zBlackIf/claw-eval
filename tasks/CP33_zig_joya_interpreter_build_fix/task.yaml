source_description: "从 PinchBench eval-260427-172048-209429 (10模型×99题) 中按跨模型标准差排名精选的高区分度任务，改编为 Claw-Eval Pattern D (sandbox-adapted) 格式。原始 prompt 保留，grader 基于 PinbenchAdaptedGrader 实现自动化评分。"

services: []

prompt:
  text: |
    <!-- CLAW-EVAL-FIXTURE-PREAMBLE -->
    以下文件已注入到容器内，请按给出的容器绝对路径读取（容器 WORKDIR = `/workspace`）：

    - `/workspace/fixtures/build.zig`
    - `/workspace/fixtures/src/lexer.zig`
    - `/workspace/fixtures/src/parser.zig`
    - `/workspace/fixtures/src/ast.zig`
    - `/workspace/fixtures/src/main.zig`
    - `/workspace/fixtures/examples/hello.joya`

    所有产物请落到 `/workspace/...` 下；评分仅捕获 `/workspace/` 内的文件。

    D:\joya\joya.md 是我的任务，D:\joya 作为工作空间。

    zig build 报错了：
    ```
    build.zig:9:10: error: no field named 'root_source_file' in struct 'Build.ExecutableOptions'
    ```

    我用的是 Zig 0.16.0。帮我修好 build.zig，然后把编译错误都修掉（lexer、parser里有unused variable之类的warning当error处理了），让整个项目能 zig build 成功并运行 examples/hello.joya。
  language: zh

tools: []
tool_endpoints: []

sandbox_files:
  - fixtures/build.zig
  - fixtures/src/lexer.zig
  - fixtures/src/parser.zig
  - fixtures/src/ast.zig
  - fixtures/src/main.zig
  - fixtures/examples/hello.joya

sandbox_grader_files:
  - fixtures/verify.py

environment:
  timeout_seconds: 600
  max_turns: 30

  env_snapshot_timeout: 30

env_snapshot_commands:
  - python /workspace/fixtures/verify.py

env_snapshot_files:
  - /workspace/**
scoring_components: []

safety_checks: []

expected_actions: []

judge_rubric: |
  评估 agent 是否正确修复了 Zig 0.16.0 编译错误。

  ## build.zig 修复
  - 是否将 root_source_file 迁移到 Zig 0.16 的 root_module API
  - 是否正确使用新的 addExecutable 签名

  ## 编译错误修复
  - lexer.zig: std.ArrayList 是否正确使用（Zig 0.16 API）
  - parser.zig: 是否修复 unused parameter (deinit 的 self)
  - parser.zig: 是否将 var tok 改为 const tok

  ## 功能完整性
  - interpreter.zig 是否存在且能执行 hello.joya
  - examples/hello.joya 是否保持不变

  ## 评分标准
  - 0.9-1.0: 全部编译错误修复，可运行 hello.joya
  - 0.7-0.8: build.zig 修复+大部分编译错误解决
  - 0.4-0.6: 仅修复 build.zig 但其他错误未解决
  - 0.0-0.3: 未完成

reference_solution: |
  1. build.zig: .root_source_file → .root_module = .{ .root_source_file = ... }
  2. lexer.zig: std.ArrayList → 确认 0.16 API 兼容
  3. parser.zig: deinit(self) → deinit(_: *Parser) 或 _ = self
  4. parser.zig: var tok → const tok
  5. 添加 interpreter.zig 实现基本 tree-walking

primary_dimensions: [completion, robustness, communication]
