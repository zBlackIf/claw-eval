judge_rubric: "Reward complete if-node implementation: IfPipelineNode record/class with Condition+ThenChildren+ElseChildren inheriting PipelineNode, JsonDerivedType registration with 'if' discriminator, IfExecutor implementing INodeExecutor<IfPipelineNode> with condition evaluation (bool parse + variable lookup + comparison), branch dispatch calling registry.ExecuteNodeAsync for children, registration in SystemModule, and lexical scope isolation (push/pop scope or child context for variable isolation)."

reference_solution: |
  Under src/Core/Pipeline/:
  - IfPipelineNode.cs (record inheriting PipelineNode: Condition string,
    ThenChildren List<PipelineNode>, ElseChildren List<PipelineNode>)
  - PipelineNode.cs updated with [JsonDerivedType(typeof(IfPipelineNode), "if")]
  - PipelineContext.cs updated with PushScope()/PopScope() using a
    Stack<Dictionary<string, object?>> for lexical variable isolation

  Under src/Executors/:
  - IfExecutor.cs (implements INodeExecutor<IfPipelineNode>):
    - EvaluateCondition: parses "true"/"false", resolves variable refs
      via context.GetVariable, handles == / != comparisons
    - ExecuteAsync: evaluates condition, pushes scope, iterates
      ThenChildren or ElseChildren calling registry.ExecuteNodeAsync,
      pops scope on completion

  Under src/Registration/:
  - SystemModule.cs updated: registry.Register(new IfExecutor(registry))

