services: []

prompt:
  text: |
    We have a pipeline execution engine in /workspace/fixtures/pipeline-engine/
    that currently supports "step" and "group" node types. I need you to add an
    "if" node so we can do conditional branching in our pipelines.

    The IfPipelineNode should have:
    - A string Condition property (expression to evaluate)
    - ThenChildren list (executed when condition is true)
    - ElseChildren list (executed when condition is false)

    You'll need to:
    1. Create the IfPipelineNode model (inheriting PipelineNode)
    2. Register it in the polymorphic discriminator with type "if"
    3. Implement an IfExecutor that evaluates the condition and runs the
       appropriate branch's children via the registry
    4. Register the executor in SystemModule
    5. Make sure variables set inside if-branches don't leak to the parent
       scope (lexical scoping)

    The condition evaluator should at minimum handle:
    - Boolean literals ("true"/"false")
    - Variable references from context
    - Simple comparisons

    Keep existing code working. .NET 8 / C#.
  language: en

