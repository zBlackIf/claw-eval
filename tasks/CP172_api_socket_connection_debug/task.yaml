judge_rubric: "Reward correct diagnosis and fix of socket connection failure: (1) replacing http.Agent with https.Agent for HTTPS URLs, (2) using https.request instead of http.request for HTTPS endpoints, (3) adding Accept: text/event-stream header for streaming SSE connections, (4) properly handling timeout for streaming responses (disable or extend during active stream). Partial credit for identifying some but not all issues."

reference_solution: |
  In src/api_client.js:
  1. Import https module: const https = require('https');
  2. Replace `new http.Agent(...)` with `new https.Agent(...)` (or conditionally
     select agent based on URL protocol)
  3. Replace `http.request(options, ...)` with `https.request(options, ...)`
     (or conditionally select based on protocol)
  4. Add 'Accept': 'text/event-stream' to headers when params.stream is true
  5. Disable or extend timeout when in streaming mode (e.g., don't call
     req.setTimeout for streaming requests, or clear timeout once response starts)

