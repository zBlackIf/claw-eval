task_id: CP87_r_shiny_navigation_dashboard
task_name: "R Shiny 应用导航 dashboard（CP87 / 源 taskset-260421-225115:task_18_shiny_dashboard）"
version: "1.0"
category: coding
difficulty: hard
tags: [general]

source_task_id: "task_18_shiny_dashboard"
source_dataset: "taskset-260421-225115"
source_description: "PinchBench top100 rank 49（std_trim 0.377，mean_trim 0.489——多数模型不达通过线）。Workspace WS2 R 语言任务：扫描 shiny/ 下 4 个应用，生成单文件导航 dashboard。verifier 8 个锚点（bslib/sidebar closed/reactable+filterable/_blank 启动/base64 favicon/包前缀/单文件）。"

services: []

prompt:
  text: |
    我想给自己做一个 Shiny 应用导航页，列出 /workspace/fixtures/shiny/ 下已有
    的几个应用，能筛选、能从导航页直接启动。导航页本身写成单文件 app.R 放到
    /workspace/shiny/shiny-dashboard/。视觉用 bslib + reactable 0.4.5 那套。
  language: zh

tools: []
tool_endpoints: []

sandbox_files:
  - fixtures/shiny/shiny-licensing/app.R
  - fixtures/shiny/shiny-licensing/metadata.json
  - fixtures/shiny/benchmark-heatmap/app.R
  - fixtures/shiny/benchmark-heatmap/metadata.json
  - fixtures/shiny/seq_analyzer/app.R
  - fixtures/shiny/seq_analyzer/metadata.json
  - fixtures/shiny/96well-plate-designer/app.R
  - fixtures/shiny/96well-plate-designer/metadata.json

sandbox_grader_files:
  - fixtures/verify_shiny_dashboard.py

env_snapshot_commands:
  - python /workspace/fixtures/verify_shiny_dashboard.py

env_snapshot_files:
  - /workspace/shiny/shiny-dashboard/app.R

environment:
  timeout_seconds: 900
  max_turns: 20
  env_snapshot_timeout: 30

scoring_components: []
safety_checks: []
expected_actions: []

judge_rubric: "Reward shiny/shiny-dashboard/app.R using bslib::page_sidebar + bslib::sidebar(open='closed'), reactable with filterable columns, launch buttons that open apps in new tab via target='_blank' (Shiny Server URL pattern /<app-name>/), base64-inlined favicon (no www/), function calls with package prefixes (bslib:: / reactable::), scanning shiny/ for app.R+metadata.json directories."

reference_solution: |
  Write shiny/shiny-dashboard/app.R as single file:
  - library(shiny) + library(bslib) + library(reactable) etc.
  - Scan shiny/ subdirs for app.R; read metadata.json for each.
  - UI = bslib::page_sidebar(sidebar = bslib::sidebar(open='closed'), ...
  - reactable::reactable(apps_df, filterable=TRUE,
      columns = list(launch = colDef(cell = ...
        sprintf('<a href="/%s/" target="_blank">Launch</a>', app_name),
        html=TRUE)))
  - favicon: base64 encoded inline tags$link with data: URL
  - All external functions use ::, no www/ directory needed.

primary_dimensions: [completion, communication, safety]
