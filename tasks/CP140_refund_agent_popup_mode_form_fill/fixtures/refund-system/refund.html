<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>销管系统 - 退款申请</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f0f2f5; }
        .header {
            background: white;
            padding: 16px 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 { font-size: 18px; color: #333; }
        .container { max-width: 900px; margin: 24px auto; padding: 0 24px; }
        .form-card {
            background: white;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .form-card h2 { font-size: 16px; margin-bottom: 20px; color: #333; }
        .form-group {
            margin-bottom: 16px;
            display: flex;
            align-items: center;
        }
        .form-group label {
            width: 100px;
            font-size: 14px;
            color: #666;
        }
        .form-group input, .form-group select, .form-group textarea {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-group textarea { height: 80px; resize: vertical; }
        .form-actions {
            margin-top: 24px;
            text-align: right;
        }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            margin-left: 8px;
        }
        .btn-primary { background: #1890ff; color: white; }
        .btn-default { background: #f5f5f5; color: #333; border: 1px solid #d9d9d9; }
    </style>
</head>
<body>
    <div class="header">
        <h1>销管系统 - 退款申请</h1>
        <span style="color: #999; font-size: 13px;">当前用户: 管理员</span>
    </div>
    <div class="container">
        <div class="form-card">
            <h2>退款申请表单</h2>
            <div class="form-group">
                <label>客户姓名</label>
                <input type="text" id="field-customer-name" placeholder="请输入客户姓名">
            </div>
            <div class="form-group">
                <label>退款金额</label>
                <input type="number" id="field-refund-amount" placeholder="请输入退款金额" step="0.01">
            </div>
            <div class="form-group">
                <label>退款原因</label>
                <textarea id="field-refund-reason" placeholder="请输入退款原因"></textarea>
            </div>
            <div class="form-group">
                <label>订单编号</label>
                <input type="text" id="field-order-id" placeholder="请输入订单编号">
            </div>
            <div class="form-group">
                <label>入住日期</label>
                <input type="date" id="field-checkin-date">
            </div>
            <div class="form-group">
                <label>退房日期</label>
                <input type="date" id="field-checkout-date">
            </div>
            <div class="form-actions">
                <button class="btn btn-default" type="button">取消</button>
                <button class="btn btn-primary" type="button" id="btn-submit">提交申请</button>
            </div>
        </div>
    </div>
    <!-- AI Agent 注入 -->
    <script src="http://localhost:8001/agent.js"></script>
</body>
</html>
