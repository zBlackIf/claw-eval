services: []

prompt:
  text: |
    我们的 DCCRN-ANC 项目当前使用 4 层编码器 + Real LSTM + Real FiLM。
    需要升级为方案A：Complex LSTM + Complex FiLM + 5 层编解码器。

    具体要求：
    1. 新建 core/complex_lstm.py，实现 ComplexLSTM（复数域 LSTM，门控机制在复数域运算）
    2. 在 core/dccrn.py 中实现 ComplexFiLM（复数域仿射调制：(γ_r+iγ_i)*(h_r+ih_i)+(β_r+iβ_i)）
    3. 编码器从 4 层扩展到 5 层（通道：1→16→32→64→128→256），解码器对应 5 层
    4. ComplexFiLM 初始化为恒等变换（γ_r=1, γ_i=0, β_r=0, β_i=0）
    5. DCCRN 的 lstm_type 参数设为 'complex' 时使用新的 Complex LSTM

    项目代码在 /workspace/fixtures/dccrn_anc/，确保修改后 test_model.py 能通过。
