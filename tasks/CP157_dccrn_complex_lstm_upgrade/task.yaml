judge_rubric: "Reward complete Complex LSTM + Complex FiLM + 5-layer upgrade: (1) ComplexLSTM class with proper complex-valued gate operations (not just concatenating real/imag), (2) ComplexFiLM with correct complex multiplication (gamma_r*h_r - gamma_i*h_i, gamma_r*h_i + gamma_i*h_r) + complex beta, (3) 5-layer encoder (channels up to 256), (4) identity initialization for FiLM, (5) working forward pass with correct output shapes."

reference_solution: |
  1. core/complex_lstm.py:
     - ComplexLinear: W_r*x_r - W_i*x_i, W_r*x_i + W_i*x_r
     - ComplexLSTMCell: 4 complex gates (input/forget/cell/output), complex tanh/sigmoid
     - ComplexLSTM: wraps cells, returns (h_r, c_r, h_i, c_i) state

  2. core/dccrn.py modifications:
     - ComplexFiLM class: gamma/beta projections for both real and imaginary
       forward: out_r = gamma_r*h_r - gamma_i*h_i + beta_r
               out_i = gamma_r*h_i + gamma_i*h_r + beta_i
       init: gamma_r=1, gamma_i=0, beta_r=0, beta_i=0
     - encoder_channels = [1, 16, 32, 64, 128, 256], 5 encoder/decoder layers
     - LSTM input size recalculated for freq_bins=6 (161->81->41->21->11->6)
     - When lstm_type='complex', use ComplexLSTM with split real/imag input

  3. Forward pass verified: output shape (B,1,161,T), non-zero imaginary output

primary_dimensions: [completion, communication, safety]
