judge_rubric: "Reward complete MVP implementation: correct directory structure (main.py + collectors/system_collector.py + models/metrics.py + utils/formatter.py), SystemMetric class with all 9 fields, psutil-based collector collecting CPU/memory/loadavg/disk, main.py that runs and outputs valid JSON with all required fields and layer=SYSTEM. Penalize over-engineering (flask/fastapi/DB/logging framework). Key discrimination: whether main.py actually runs and produces valid structured output vs just writing code that looks right."

reference_solution: |
  Under perfdiag_starter/:
  - main.py: imports system_collector, calls collect(), converts to dict, prints json.dumps(indent=2)
  - collectors/__init__.py + system_collector.py: uses psutil.cpu_percent(), psutil.virtual_memory().percent,
    os.getloadavg() or psutil equivalent, psutil.disk_usage('/').percent
  - models/__init__.py + metrics.py: dataclass/NamedTuple SystemMetric with layer/hostname/timestamp/
    cpu_usage/memory_usage/load_avg_1m/5m/15m/disk_usage, to_dict() method
  - utils/__init__.py + formatter.py: optional JSON formatting helper
  - requirements.txt already provided with psutil>=5.9.0

primary_dimensions: [completion, communication, safety]
