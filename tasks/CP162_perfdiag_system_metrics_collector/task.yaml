source_description: "Workspace WS2 Python project scaffolding. Agent must create a perfdiag project with proper structure (collectors/models/utils), use psutil for system metrics, define a SystemMetric data model, and produce valid JSON output from main.py. Hidden checks: structure correctness, data model fields, psutil usage, runtime JSON validation, no over-engineering."

services: []

prompt:
  text: |
    帮我创建一个 Python 项目 perfdiag（Performance Diagnosis Engine）。
    目标是 MVP-1：系统层性能数据采集 + 标准化 JSON 输出。

    项目放在 /workspace/fixtures/perfdiag_starter/ 下面（那里已经有
    requirements.txt 和 README）。

    项目结构：
    perfdiag_starter/
      main.py
      collectors/
        system_collector.py
      models/
        metrics.py
      utils/
        formatter.py

    system_collector.py 用 psutil 采集：CPU 使用率、内存使用率、
    Load Average（1/5/15min）、磁盘使用率（根分区）。

    models/metrics.py 定义 SystemMetric 数据结构，字段：layer（固定 "SYSTEM"）、
    hostname、timestamp（ISO）、cpu_usage、memory_usage、load_avg_1m/5m/15m、
    disk_usage。

    main.py 调用 collector，把结果转成格式化 JSON 打印到 stdout。
    不要引入 web 框架、数据库、日志系统，只做采集+输出。
  language: zh

