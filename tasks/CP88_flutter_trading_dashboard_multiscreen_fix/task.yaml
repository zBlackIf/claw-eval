judge_rubric: "Reward fixes for all 5 screens: dashboard not empty (asset/pnl/position metrics), risk not empty (drawdown/loss limit/concentration), order not empty with DataTable/ListView, alert displaying readable Chinese (no \\u escapes or mojibake), strategy showing version + weight + winRate + addVersion (NOT addStrategy button), using Material widgets across files."

reference_solution: |
  Read requirements/strategy_module.md. For each empty page replace
  return Container() with Scaffold + Column/ListView showing real metrics.
  Dashboard: 4 Card widgets (总资产/今日盈亏/持仓数量/策略状态).
  Risk: drawdown/loss limit/concentration/risk level indicators.
  Order: DataTable with order_id/pair/side/price/qty/status/time columns.
  Alert: re-save Chinese strings as proper UTF-8 (no \uXXXX).
  Strategy: rebuild data model with [{name, version, weight, win_rate}],
  display as List + add-version button, remove any addStrategy/新增策略
  button (only addVersion).

