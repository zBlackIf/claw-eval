judge_rubric: |
  Evaluate whether the agent correctly implemented streaming download with early termination.
  - Streaming: uses httpx async streaming (aiter_bytes/aiter_raw or stream context)
  - Early stop: stops download after MAX_FRAMES extracted
  - Fallback: graceful fallback to full download on stream error
  - Interface: load_video signature unchanged
  - Config: stream-related parameters added

reference_solution: |
  1. Add stream config to config.py: STREAM_CHUNK_SIZE, FRAME_CHECK_INTERVAL
  2. New method _stream_download_video() using httpx client.stream("GET", url)
  3. In stream loop: write chunks to temp file, every N chunks try OpenCV VideoCapture
  4. When extracted >= MAX_FRAMES: break out of stream, close response
  5. Wrap _stream_download_video in try/except, fallback to existing _download_video
  6. load_video() calls stream method first, signature unchanged

primary_dimensions: [completion, robustness, communication]
