services: []

prompt:
  text: |
    <!-- CLAW-EVAL-FIXTURE-PREAMBLE -->
    以下文件已注入到容器内，请按给出的容器绝对路径读取（容器 WORKDIR = `/workspace`）：

    - `/workspace/fixtures/video_loader.py`
    - `/workspace/fixtures/config.py`
    - `/workspace/fixtures/video_processor.py`

    所有产物请落到 `/workspace/...` 下；评分仅捕获 `/workspace/` 内的文件。

    The current project is a video cover recommendation service. When videos are large, download time is long, but we only need the first 100 frames for cover recommendation. Downloading the entire video wastes time and bandwidth.

    Please modify video_loader.py to implement a streaming download + early termination approach:
    - Use httpx streaming requests when downloading video
    - Write chunks to a temp file while downloading, periodically attempt frame extraction with OpenCV
    - Stop downloading immediately after extracting enough frames (MAX_FRAMES from config)
    - If streaming fails, fall back to the original full download method
    - Add relevant configuration to config.py
    - Keep the original load_video interface unchanged (same method signature and return type)

    Reference files:
    - video_loader.py: current implementation (downloads full file)
    - config.py: application settings
    - video_processor.py: frame extraction logic (for reference)
  language: en

