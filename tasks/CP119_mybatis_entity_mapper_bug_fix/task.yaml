judge_rubric: "Reward correct diagnosis and fix of both bugs: (1) Adding @TableField annotations to Product.java for processValue1-5 mapping them to process_value_1 through process_value_5; (2) Creating AccessoryPolicyMapper.xml with correct namespace, selectPageWithFilters with dynamic SQL (<if> conditions), selectBySupplierId, selectByStandardSku queries against supplier_accessory_policy table with soft-delete filter."

reference_solution: |
  Bug 1 fix - Product.java:
  Add @TableField("process_value_1") through @TableField("process_value_5") annotations
  above processValue1 through processValue5 fields respectively.

  Bug 2 fix - Create AccessoryPolicyMapper.xml:
  - namespace: com.hof.basedata.mapper.AccessoryPolicyMapper
  - selectPageWithFilters: SELECT from supplier_accessory_policy with <if> conditions
    for supplierId, accessoryCategory, sourcingType, WHERE deleted = 0, ORDER BY created_at DESC
  - selectBySupplierId: SELECT WHERE supplier_id = #{supplierId} AND deleted = 0
  - selectByStandardSku: SELECT with JOIN or subquery for standardSku filter

