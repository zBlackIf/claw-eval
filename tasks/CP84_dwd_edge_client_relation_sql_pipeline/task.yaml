judge_rubric: "Reward a substantive SQL file dwd_gu_user_gdb_edge_client_to_meta.sql with: two JOINs (source_node→node_id, target_node→node_id), filter source.node_type='edge_pp_client' AND target.node_type='pp_client', recent_time computed as GREATEST/MAX of 3 timestamps with FROM_UNIXTIME conversion, json_value derived via merge (CONCAT/JSON_ARRAY) and unx_value via GREATEST/MAX."

reference_solution: |
  Read requirements.md. Write dwd_gu_user_gdb_edge_client_to_meta.sql:
  SELECT ... FROM edge_table e
  JOIN node_table s ON s.node_id = e.source_node AND s.node_type='edge_pp_client'
  JOIN node_table t ON t.node_id = e.target_node AND t.node_type='pp_client'
  with recent_time = FROM_UNIXTIME(GREATEST(s.update_ts, t.update_ts, e.update_ts))
  and json_value = CONCAT(s.json_attr, ',', t.json_attr) (or similar merge)
  and unx_value = GREATEST(s.unx_value, t.unx_value).

primary_dimensions: [completion, communication, safety]
