judge_rubric: "Reward complete LVGL server selection UI: dedicated header+implementation files, key handling (UP/DOWN navigation + MIDDLE confirm), both server URLs present, config write-back mechanism, blocking wait loop with LVGL timer handler, proper LVGL UI elements (screen/labels/style highlight), and integration in app_main.c before WebSocket task creation."

reference_solution: |
  Under main/ui/:
  - ui_server_select.h (header guard, function declaration with SemaphoreHandle_t param)
  - ui_server_select.c:
    - Includes app_config.h, drv_key.h, lvgl.h
    - Defines server URL options array
    - Creates LVGL screen with title, option cards, hint text
    - Polling loop: reads key, UP/DOWN cycles selection, MIDDLE confirms
    - Updates visual highlight on selection change (border/bg color)
    - Calls lv_timer_handler() in loop for display refresh
    - After confirm: writes URL to config via setter or strncpy
    - Deletes selection screen
  In app_main.c:
  - #include "ui_server_select.h"
  - Call ui_server_select_wait() after ui_common_init() but BEFORE xTaskCreate(task_ws_connect)
  In app_config.h/c:
  - Add app_config_set_ws_url(const char *url) function

