    ESP32 AI 台灯项目（/workspace/fixtures/ai_lamp/）需要加一个开机服务器选择功能。
    要求：
    1. 开机后显示服务器选择页面，选项为 ws://20.tcp.vip.cpolar.cn:10244 和 ws://192.168.50.233:61032
    2. 上下键切换选项高亮，中键确认
    3. 确认后将选中的 URL 写入 g_cfg（通过 app_config 模块）
    4. 在用户确认选择之前，不能执行 WebSocket 连接等后续开机操作

    现有代码结构见 main/ 目录，按键驱动在 drivers/drv_key.h，配置在 app_config.h/c，
