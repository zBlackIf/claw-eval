scoring_components: []
safety_checks: []
expected_actions: []

judge_rubric: "Reward complete factory-pattern framework: OssClient interface (upload/download/delete), AbstractS3OssClient (abstract + S3Client via software.amazon.awssdk), MinioOssClient extends AbstractS3OssClient, OssClientFactory managing enabled clients, OssStorageService facade for business layer, Spring Boot auto-config. No aliyun/tencent/aws subdirectories scaffolded (only the core extension framework)."

reference_solution: |
  Under store/oss/:
  - OssClient.java (interface: upload/download/delete/exists/presignedUrl)
  - AbstractS3OssClient.java (abstract class implements OssClient using
    S3Client from software.amazon.awssdk, holds S3Client + bucket, common
    operations templated, subclasses provide config)
  - minio/MinioOssClient.java (extends AbstractS3OssClient, configures
    S3Client with MinioProperties endpoint)
  - OssClientFactory.java (Spring component, maps name → OssClient,
    supports getClient + isEnabled)
  - OssStorageService.java (facade with simple upload/download API)
  - OssAutoConfiguration.java (@Configuration @ConditionalOnProperty
    registers factory + clients)

primary_dimensions: [completion, communication, safety]
