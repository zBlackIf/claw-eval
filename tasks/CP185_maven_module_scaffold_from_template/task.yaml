judge_rubric: "Reward a complete multi-module Maven scaffold for dc-print-vision mirroring dc-print-external structure: parent pom.xml (packaging=pom, two submodules), api submodule with VisionApi interface, biz submodule with proper dependencies (mybatis, web, api), domain classes (VisionTask + VisionResult with meaningful fields and annotations), mapper interfaces extending BaseMapper, service interface + impl, REST controllers, MyBatis XML mapper files, correct package naming (cn.iocoder.yudao.module.vision), and root pom.xml updated to include the new module."

