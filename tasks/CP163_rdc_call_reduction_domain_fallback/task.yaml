source_description: "Real session: user debugging RequirementImpactAnalyzer with 50 redundant RDC calls and empty domain due to missing fetch_data fallback. Workspace WS2 pattern. 5 hidden dimensions: domain fallback, known_type passthrough, aggregated children query, call count reduction, correctness."

services: []

prompt:
  text: |
    精准测试项目的 RequirementImpactAnalyzer 有两个问题需要修复：

    1. RAN-1455434 这个需求的领域查出来是空的，但实际上应该是 "07-5G-SPA"。
       排查发现 batch_get_work_items 的 System_AreaPath 字段为空，但 fetch_data
       接口返回的 Area.persistentValue.name 有正确值。需要在 _resolve_domain_from_rdc
       里加 fetch_data fallback。

    2. 用 RAN-5620900 走一遍流程发现有太多次 RDC 调用（理论上聚合查询不应该
       这么多次）。主要原因：
       - _step1_resolve_functions 每次都调 judge_pr_or_mr_or_us，但从
         batch_query_relations 已经知道了需求类型，应该用 known_type 参数跳过
       - 查子需求用了分开的 batch_get_child_prs_from_mr 和
         batch_get_child_uss_from_pr，应该合并用 batch_get_children_by_type
         一次查出所有子类型

    代码在 /workspace/fixtures/precision_testing/core/ 下面。修好后确保
    analyze("RAN-5620900") 仍然能正确过滤掉不同领域的 PR（RAN-5620906 是
    03-LTE-RRM 域的，应被过滤）。
