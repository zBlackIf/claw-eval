judge_rubric: |
  Reward fixes that: (1) add fetch_data fallback in _resolve_domain_from_rdc when
  System_AreaPath is empty, extracting Area.persistentValue.name; (2) make
  _step1_resolve_functions actually USE the known_type parameter to skip
  judge_pr_or_mr_or_us; (3) replace separate batch_get_child_prs_from_mr +
  batch_get_child_uss_from_pr with single batch_get_children_by_type call;
  (4) reduce total RDC calls from ~50 to <=10; (5) maintain correctness of
  domain filtering (exclude RAN-5620906 from results).

reference_solution: |
  In _resolve_domain_from_rdc: after batch_get_work_items returns empty
  System_AreaPath, call fetch_data(req_id) and extract
  result["fields"]["Area"]["persistentValue"]["name"].

  In _step1_resolve_functions: when known_type is provided, use it directly
  instead of calling judge_pr_or_mr_or_us. Only call the API if known_type
  is empty.

  In _analyze_single: replace batch_get_child_prs_from_mr([req_id]) +
  batch_get_child_uss_from_pr(filtered_prs) with a single
  batch_get_children_by_type([req_id]) call that returns all child types
  at once. For grandchild USs, use batch_get_children_by_type(filtered_prs).

  Pass known_type when calling _step1_resolve_functions from the entities loop:
  self._step1_resolve_functions(entity_id, known_type=entity_type)

primary_dimensions: [completion, robustness, efficiency_turns]
