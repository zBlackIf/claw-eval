source_description: "从 PinchBench eval-260427-172048-209429 (10模型×99题) 中按跨模型标准差排名精选的高区分度任务，改编为 Claw-Eval Pattern D (sandbox-adapted) 格式。原始 prompt 保留，grader 基于 PinbenchAdaptedGrader 实现自动化评分。"

services: []

prompt:
  text: |
    <!-- CLAW-EVAL-FIXTURE-PREAMBLE -->
    以下文件已注入到容器内，请按给出的容器绝对路径读取（容器 WORKDIR = `/workspace`）：

    - `/workspace/fixtures/gateway/platforms/weixin.py`
    - `/workspace/fixtures/gateway/bridges/express_bridge.py`

    所有产物请落到 `/workspace/...` 下；评分仅捕获 `/workspace/` 内的文件。

    把当前服务器整理成长期稳定、好维护、少改主链、可持续扩展的结构。请先查当前代码，再小步执行。

    一、总目标

    不要继续把快递、火车票、提醒这些业务硬编码进 `gateway/platforms/weixin.py`，而是整理为：

    1. **主系统稳定**：`weixin.py` 只负责消息接收、标准化、交给路由器、发送结果。不再在主入口里塞业务判断和业务调用。

    2. **统一路由**：创建 `gateway/router.py` 负责统一分流。路由至少支持：
       - express（快递）
       - train（火车票）
       - reminder（提醒）
       - chat（普通聊天）
       路由优先级明确、可读、可维护。

    3. **模块化能力**：所有具体业务能力都收进 `gateway/bridges/` 目录：
       - `express_bridge.py`（已存在，需要接入 router）
       - `train_bridge.py`（新建，预留接口）
       - `reminder_bridge.py`（新建，预留接口）
       - `chat_bridge.py`（新建，LLM 对话兜底）

    4. **分层排查规范**：在代码注释或文档中标注排查顺序：入口层 -> 路由层 -> bridge层 -> 业务层

    要求：
    - `weixin.py` 重构后只保留消息收发职责
    - `router.py` 是新文件，路由规则清晰
    - 每个 bridge 有统一接口：`async def handle(user_id: str, message: str) -> str`
    - express_bridge 要真正接入（从 weixin.py 迁移 API 调用逻辑）
  language: zh

