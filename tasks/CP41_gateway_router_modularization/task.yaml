prompt:
  text: |
    我已经把原始项目素材放在容器的 `/workspace/fixtures/` 目录下，请把这些文件当作只读输入。

    输入文件如下（右侧是它在原项目中的相对路径）：
    - `/workspace/fixtures/gateway/platforms/weixin.py` -> `gateway/platforms/weixin.py`
    - `/workspace/fixtures/gateway/bridges/express_bridge.py` -> `gateway/bridges/express_bridge.py`
    - `/workspace/fixtures/modularization_requirements.md` -> `modularization_requirements.md`

    请基于这些输入完成下面的原始需求：

    把当前服务器整理成长期稳定、好维护、少改主链、可持续扩展的结构。请先查当前代码，再按 `modularization_requirements.md` 小步执行重构。

    交付要求：
    - 需要修改已有文件时，请把修改后的版本写到 `/workspace/` 下对应的原项目相对路径。
    - 需要新增文件时，请按需求中的文件名或上面列出的目标路径写到 `/workspace/` 下。
    - 最终回复只需概述完成情况、关键改动和生成的文件；不要只在最终回复中贴代码或报告正文。
