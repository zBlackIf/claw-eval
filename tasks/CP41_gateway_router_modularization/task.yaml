env_snapshot_files:
  - /workspace/gateway/router.py
  - /workspace/gateway/platforms/weixin.py
  - /workspace/gateway/bridges
  - /workspace/**/router.py
scoring_components: []

safety_checks: []

expected_actions: []

judge_rubric: |
  评估 agent 对 Gateway Router 模块化重构的质量。

  ## 核心检查
  - router.py 是否存在且包含 express/train/reminder/chat 路由
  - weixin.py 是否被简化（不再包含业务判断逻辑）
  - 4 个 bridge 文件是否都存在
  - 每个 bridge 是否有统一 handle 接口
  - express_bridge 是否真正接入了 API 调用逻辑

  ## 评分标准
  - 0.9-1.0: 完整重构，router + 4 bridges + weixin 简化 + express API 迁移
  - 0.7-0.8: 大部分完成，express API 可能未完整迁移
  - 0.4-0.6: 部分文件创建但未真正解耦
  - 0.0-0.3: 未完成

reference_solution: |
  1. 创建 gateway/router.py，实现路由逻辑
  2. 简化 weixin.py，只保留消息收发
  3. 创建 4 个 bridge，各有 async def handle(user_id, message) -> str
  4. express_bridge 包含 aiohttp API 调用逻辑

primary_dimensions: [completion, robustness, communication]
