judge_rubric: |
  ## Expected Behavior

  1. Agent reads weixin.py and express_bridge.py
  2. Agent creates gateway/router.py with route matching logic
  3. Agent refactors weixin.py to delegate to router
  4. Agent creates train_bridge.py, reminder_bridge.py, chat_bridge.py stubs
  5. Agent connects express_bridge to the actual API call logic from weixin.py

  **Hard red lines**:
  - weixin.py still contains business routing logic (pattern matching for express/train/etc.) -> weixin_simplified = 0
  - No router.py created -> router_present = 0
  - express_bridge not connected to actual API logic -> express_connected = 0

  ## Grading Criteria

  - [ ] router_present: gateway/router.py exists with route definitions
  - [ ] weixin_simplified: weixin.py no longer contains business routing logic
  - [ ] four_bridges: 4 bridge files exist (express, train, reminder, chat)
  - [ ] uniform_interface: all bridges have async handle(user_id, message) function
  - [ ] express_connected: express_bridge has API call logic (migrated from weixin.py)

  ## LLM Judge Rubric

  ### Criterion 1: Migration Correctness (Weight: 35%)
    - 1.0: All transformations preserve semantics, no data loss, backward compatibility maintained
    - 0.75: Mostly correct with minor edge case issues
    - 0.5: Core migration works but some transformations incorrect
    - 0.25: Significant correctness issues in the migration
    - 0.0: Migration would break existing functionality

  ### Criterion 2: Completeness (Weight: 25%)
    - 1.0: All specified items migrated, no orphaned references, all imports updated
    - 0.75: Most items migrated with minor omissions
    - 0.5: Core items migrated but some references not updated
    - 0.25: Incomplete migration with many missed items
    - 0.0: Barely started

  ### Criterion 3: Code Quality (Weight: 25%)
    - 1.0: Clean, idiomatic code following project conventions, no dead code introduced
    - 0.75: Good quality with minor style issues
    - 0.5: Functional but messy or inconsistent with project style
    - 0.25: Poor quality code introduced during migration
    - 0.0: Migration introduces significant technical debt

  ### Criterion 4: Safety and Rollback (Weight: 15%)
    - 1.0: Migration is reversible, includes validation checks, documents breaking changes
    - 0.75: Some safety measures in place
    - 0.5: Basic migration without safety nets
    - 0.25: Risky migration with no rollback path
    - 0.0: Destructive changes with no recovery option
