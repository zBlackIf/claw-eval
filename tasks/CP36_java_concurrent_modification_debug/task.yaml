judge_rubric: |
  ## Expected Behavior

  1. Agent reads the error stacktrace and source files
  2. Agent identifies that RequestUtil.contains iterates over a shared mutable ArrayList using an Iterator
  3. Agent identifies that AntiSqlInjectionfilter modifies the list (or shares state) across threads
  4. Agent fixes the iteration to be thread-safe (using CopyOnWriteArrayList, synchronized block, or converting to array before iteration)
  5. Agent writes diagnosis.md explaining the root cause and fix

  ## Grading Criteria

  - [ ] root_cause_identified: diagnosis.md explains shared mutable ArrayList being iterated and modified concurrently
  - [ ] fix_applied: RequestUtil.java no longer uses bare ArrayList iterator on shared state
  - [ ] thread_safety_approach: Fix uses a recognized thread-safe pattern (CopyOnWriteArrayList, Collections.unmodifiableList, toArray, synchronized, or stream)
  - [ ] diagnosis_doc_exists: diagnosis.md exists with concurrency explanation
  - [ ] red_line_no_suppress: Fix does NOT simply catch and swallow ConcurrentModificationException

  ## LLM Judge Rubric

  ### Criterion 1: Root Cause Diagnosis (Weight: 30%)
    - 1.0: Correctly identifies shared mutable state, explains Iterator fail-fast mechanism, and describes the race condition timing
    - 0.75: Identifies shared state issue but explanation of fail-fast is superficial
    - 0.5: Knows it is a concurrency issue but does not pinpoint the exact shared list
    - 0.25: Generic "concurrency problem" without specific analysis
    - 0.0: Misdiagnoses the issue entirely

  ### Criterion 2: Fix Correctness (Weight: 30%)
    - 1.0: Fix is thread-safe, preserves filter functionality, and handles edge cases (null values, empty lists)
    - 0.75: Fix is thread-safe but misses an edge case
    - 0.5: Fix reduces but does not eliminate the race condition
    - 0.25: Fix changes code but introduces a different bug
    - 0.0: No fix or fix makes the problem worse

  ### Criterion 3: Java Concurrency Knowledge (Weight: 20%)
    - 1.0: Demonstrates deep understanding of Java memory model, Iterator contract, and appropriate concurrent collection choice
    - 0.75: Good understanding, mentions the right collection types but explanation is brief
    - 0.5: Knows CopyOnWriteArrayList or synchronized but does not explain trade-offs
    - 0.25: Mentions "thread safety" without demonstrating understanding
    - 0.0: No concurrency awareness

  ### Criterion 4: Documentation Quality (Weight: 20%)
    - 1.0: diagnosis.md is clear, structured, explains the problem to a non-expert, includes before/after code snippets
    - 0.75: Good explanation but missing code snippets or visual aids
    - 0.5: Explanation is correct but hard to follow
    - 0.25: Minimal documentation
    - 0.0: No documentation
