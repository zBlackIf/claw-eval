    Use those inputs to complete the original request below:

    This government OA system runs on TongWeb and the anti-SQL-injection filter intermittently fails only when concurrent requests hit it. The captured exception stack is in `/workspace/fixtures/error_stacktrace.txt`.

    Examine `RequestUtil.java`, `AntiSqlInjectionfilter.java`, and the stacktrace, diagnose the root cause, and fix the code. Write a `diagnosis.md` explaining what causes the intermittent failure and why it only manifests under concurrency.

    Delivery requirements:
    - When you modify an existing file, write the modified version under `/workspace/` using the same project-relative path.
    - When you create a new file, write it under `/workspace/` using the filename or target path requested above.
    - In your final response, only summarize the status, key changes, and generated files; do not only paste code or report text in chat.
