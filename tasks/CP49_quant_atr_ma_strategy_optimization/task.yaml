task_id: CP49_quant_atr_ma_strategy_optimization
task_name: 量化策略优化：ATR+MA信号修复
version: "1.0"
category: debugging
difficulty: medium
tags: [general, single_turn, coding_plan]

source_task_id: "task_14_quant_atr_ma_strategy"
source_dataset: "taskset-260408-163403"
source_description: "从 PinchBench eval-260427-172048-209429 (10模型×99题) 中按跨模型标准差排名精选的高区分度任务，改编为 Claw-Eval Pattern D (sandbox-adapted) 格式。原始 prompt 保留，grader 基于 PinbenchAdaptedGrader 实现自动化评分。"

services: []

prompt:
  text: |
    <!-- CLAW-EVAL-FIXTURE-PREAMBLE -->
    以下文件已注入到容器内，请按给出的容器绝对路径读取（容器 WORKDIR = `/workspace`）：

    - `/workspace/fixtures/strategy_broken.py`
    - `/workspace/fixtures/optimization_rules.md`
    - `/workspace/fixtures/backtest_results.csv`

    所有产物请落到 `/workspace/...` 下；评分仅捕获 `/workspace/` 内的文件。

    请修复并优化 strategy_broken.py 中的量化策略代码。当前代码存在以下问题：
    1. ATR计算的rolling窗口参数被截断（`rolling(windo` 不完整）
    2. entries和exits使用了位运算符 &/|，违反了语法规范要求使用 and/or/not
    3. 回测指标显示策略表现很差（负收益、高回撤、低胜率）

    请严格遵守 optimization_rules.md 中的约束，参考 backtest_results.csv 分析当前策略弱点，生成优化后的 strategy_optimized.py。所有代码必须在全局作用域，不使用自定义函数定义。
  language: zh

tools: []
tool_endpoints: []

sandbox_files:
  - fixtures/strategy_broken.py
  - fixtures/optimization_rules.md
  - fixtures/backtest_results.csv

sandbox_grader_files:
  - fixtures/verify.py

environment:
  timeout_seconds: 600
  max_turns: 30

  env_snapshot_timeout: 30

env_snapshot_commands:
  - python /workspace/fixtures/verify.py

env_snapshot_files:
  - /workspace/strategy_optimized.py
scoring_components: []

safety_checks: []

expected_actions: []

judge_rubric: |
  评估 agent 是否正确修复语法错误并优化策略。
  - 语法修复：rolling(window=14)补全、&/|替换为and/or
  - 策略优化：增加有效过滤条件、改善信号质量
  - 约束遵守：全局作用域、无自定义函数、无未来函数
  - 代码质量：变量命名规范、逻辑清晰

reference_solution: |
  1. 修复 rolling(windo → rolling(window=14)
  2. 替换 & → and, | → or (vectorbt语法)
  3. 增加趋势确认：MA交叉+成交量确认
  4. 增加ATR动态止损
  5. 优化参数：扩大MA窗口减少噪声信号
  6. 全局作用域，使用price_df/pd/np

primary_dimensions: [completion, robustness, communication]
