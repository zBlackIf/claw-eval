task_id: T175_zh_a_share_etf_fee_reduction_impact
task_name: "A股ETF降费改革影响分析"
version: "1.0"
category: finance
difficulty: easy
tags: [general]

services:
  - name: web_real
    command: python mock_services/web_real/server.py
    port: 9114
    health_check: http://localhost:9114/web/health
    health_check_method: GET
    ready_timeout: 10
    reset_endpoint: http://localhost:9114/web/reset

prompt:
  text: |
    我最近在研究基金投资，听说2023年以来中国公募基金行业在推ETF降费改革，很多头部ETF的管理费和托管费都降了。
    我想了解具体情况，帮我做一个调研。

    请搜索以下信息：

    1. 中国公募基金降费改革的时间线：什么时候开始的？分几个阶段？
    2. ETF降费前后的费率变化：
       - 股票型ETF管理费从多少降到多少？
       - 托管费从多少降到多少？
       - 综合费率（管理费+托管费）降了多少个基点？
    3. 哪些头部基金公司率先降费？覆盖了哪些主流指数？
    4. 降费对投资者的实际影响：
       - 以一笔10万元的沪深300ETF投资为例，一年能省多少费用？
       - 对基金公司营收的影响

    5. 和美国ETF（如Vanguard、iShares）的费率对比，中国ETF降费后差距还有多大？

    输出一份面向普通投资者的分析报告，结论要回答："现在买ETF比以前便宜了多少？值得从主动基金换到ETF吗？"
  language: zh

tools:
