task_id: CP25_openclaw_gateway_diagnostics
task_name: OpenClaw网关故障诊断与安全加固
version: "1.0"
category: devops_debug
difficulty: hard
tags: [general, single_turn, coding_plan]

source_task_id: "task_109_openclaw_diagnostics"
source_dataset: "taskset-260427-121234"
source_description: "从 PinchBench eval-260427-172048-209429 (10模型×99题) 中按跨模型标准差排名精选的高区分度任务，改编为 Claw-Eval Pattern D (sandbox-adapted) 格式。原始 prompt 保留，grader 基于 PinbenchAdaptedGrader 实现自动化评分。"

services: []

prompt:
  text: |
    <!-- CLAW-EVAL-FIXTURE-PREAMBLE -->
    以下文件已注入到容器内，请按给出的容器绝对路径读取（容器 WORKDIR = `/workspace`）：

    - `/workspace/fixtures/system_info.json`
    - `/workspace/fixtures/logs/gateway.log`
    - `/workspace/fixtures/config/gateway.yaml`

    所有产物请落到 `/workspace/...` 下；评分仅捕获 `/workspace/` 内的文件。

    本机的OpenClaw网关停了。请基于 `system_info.json` 和 `logs/gateway.log` 完成以下诊断和修复任务：

    1. **故障诊断报告**（`diagnosis_report.md`）：
       - 分析 gateway.log 中的错误链（从WARN到FATAL的因果关系）
       - 识别根因：为什么会出现 EADDRINUSE
       - 评估安全风险：当前绑定到 0.0.0.0 的安全隐患

    2. **安全加固方案**：
       - 将监听地址从 `0.0.0.0` 改为 `127.0.0.1`（本地回环）
       - 如果需要内网访问，设计HTTPS+认证方案
       - 修改配置文件 `config/gateway.yaml` 实现上述加固

    3. **重启脚本**（`scripts/safe_restart.sh`）：
       - 先检查端口是否被占用（如果被占用则 kill 旧进程）
       - 验证配置文件语法
       - 启动网关并检查健康状态
       - 如果启动失败，回滚配置并报错

    4. **监控告警配置**（`config/alerts.yaml`）：
       - 端口冲突告警
       - 网关进程消失告警
       - 证书即将过期告警（如果配置了HTTPS）
  language: zh

tools: []
tool_endpoints: []

sandbox_files:
  - fixtures/system_info.json
  - fixtures/logs/gateway.log
  - fixtures/config/gateway.yaml

sandbox_grader_files:
  - fixtures/verify.py

environment:
  timeout_seconds: 600
  max_turns: 30

  env_snapshot_timeout: 30

env_snapshot_commands:
  - python /workspace/fixtures/verify.py

env_snapshot_files:
  - /workspace/diagnosis_report.md
  - /workspace/config/gateway.yaml
  - /workspace/scripts/safe_restart.sh
  - /workspace/config/alerts.yaml
scoring_components: []

safety_checks: []
expected_actions: []

judge_rubric: |
  评估 agent 对 OpenClaw 网关故障的诊断和修复方案质量。

  ## 故障诊断报告
  - 是否正确分析了日志中的错误链（WARN → ERROR → FATAL）
  - 是否识别出 EADDRINUSE 根因（端口被占用）
  - 是否评估了 0.0.0.0 绑定的安全风险

  ## 安全加固
  - gateway.yaml 是否将监听地址改为 127.0.0.1
  - 是否设计了内网访问方案（HTTPS + 认证）
  - 配置修改是否格式正确

  ## 重启脚本
  - 是否检查端口占用并处理
  - 是否验证配置语法
  - 是否有健康检查
  - 是否有失败回滚逻辑

  ## 监控告警
  - 是否配置了端口冲突、进程消失、证书过期告警

  ## 评分标准
  - 0.9-1.0: 诊断准确，加固方案完整，脚本健壮，告警配置合理
  - 0.7-0.8: 大部分正确但某项有遗漏
  - 0.4-0.6: 诊断正确但修复方案不完整
  - 0.0-0.3: 诊断错误或未完成

reference_solution: |
  1. 根因: 另一个进程占用了网关端口(8443)导致 EADDRINUSE
  2. 错误链: TLS handshake warn → connection pool exhausted → bind EADDRINUSE → FATAL shutdown
  3. 加固: 0.0.0.0 → 127.0.0.1, 添加 mTLS 配置
  4. 脚本: lsof/ss 检查端口 → kill → yamllint → start → curl health
  5. 告警: prometheus-style rules for port/process/cert

primary_dimensions: [completion, robustness, communication]
