services: []
prompt:
  text: |
    我已经把原始项目素材放在容器的 `/workspace/fixtures/` 目录下，请把这些文件当作只读输入。

    输入文件如下（右侧是它在原项目中的相对路径）：
    - `/workspace/fixtures/system_info.json` -> `system_info.json`
    - `/workspace/fixtures/logs/gateway.log` -> `logs/gateway.log`

    请基于这些输入完成下面的原始需求：

    本机的OpenClaw网关停了。请基于 `system_info.json` 和 `logs/gateway.log` 完成以下诊断和修复任务：

    1. **故障诊断报告**（`diagnosis_report.md`）：
       - 分析 gateway.log 中的错误链（从WARN到FATAL的因果关系）
       - 识别根因：为什么会出现 EADDRINUSE
       - 评估安全风险：当前绑定到 0.0.0.0 的安全隐患

    2. **安全加固方案**：
       - 将监听地址从 `0.0.0.0` 改为 `127.0.0.1`（本地回环）
       - 如果需要内网访问，设计HTTPS+认证方案
       - 输出修改后的配置片段

    3. **重启脚本**（`restart_gateway.sh`）：
       - 先检查并终止占用18789端口的进程
       - 等待端口释放
       - 以新的安全配置启动OpenClaw
       - 验证启动成功（检查端口监听、日志无错误）
       - 包含重启失败时的回滚逻辑

    4. **健康检查脚本**（`health_check.sh`）：
       - 检查OpenClaw进程是否运行
       - 检查端口是否监听
       - 检查是否绑定到127.0.0.1而非0.0.0.0
       - 检查本地模型服务（8081/8082/8083）是否正常
       - 输出结构化状态报告

    交付要求：
    - 需要修改已有文件时，请把修改后的版本写到 `/workspace/` 下对应的原项目相对路径。
    - 需要新增文件时，请按需求中的文件名或上面列出的目标路径写到 `/workspace/` 下。
    - 最终回复只需概述完成情况、关键改动和生成的文件；不要只在最终回复中贴代码或报告正文。
  language: zh
