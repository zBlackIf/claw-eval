  text: |
    我们板子上跑的 YOLO 检测管线有个问题——QA 对比了可视化画框和导出的
    JSON/TXT 标注文件，发现 Y 方向坐标和高度对不上。可视化那边画的框是对的，
    但 json_exporter 导出的归一化坐标跟 visualizer 结果不一致。代码在
    /workspace/fixtures/video_pipeline/，帮我查一下哪里坐标换算逻辑跟 visualizer
    不统一，改掉让三处输出一致。改完给我说一下根因和改了什么。
  language: zh

