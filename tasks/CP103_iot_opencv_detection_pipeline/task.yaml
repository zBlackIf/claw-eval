scoring_components: []
safety_checks: []
expected_actions: []

judge_rubric: "Reward fixing the Y-direction scaling bug in json_exporter.cpp (both JSON and TXT functions should use 384/VPSS_H/SCALED_H instead of 640/MODEL_INPUT_W for y and height mapping), fixing the detectImage buffer initialization issue, handling negative coordinates from border-region detections, and maintaining consistency with the visualizer's coordinate transformation."

reference_solution: |
  Root cause: json_exporter.cpp uses MODEL_INPUT_W (640) for y-direction scaling
  when it should use SCALED_H (384), matching the visualizer's approach.

  Fixes needed:
  1. json_exporter.cpp saveDetectionResultToJson():
     - orig_y = (obj.rect.y - 128) * image_height / 384.0f  (was /640.0f)
     - orig_h = obj.rect.height * image_height / 384.0f  (was /640.0f)
  2. json_exporter.cpp saveDetectionResultToTxt():
     - Same fix: use 384 for y/h scaling instead of 640
  3. yolo_detector_acl.cpp detectImage():
     - Add memset(input_buffer_, 0, YOLO_MODEL_INPUT_SIZE) before partial copy
     - Or restructure to pad+convert full 640x640 buffer like detect() does
  4. (Bonus) Add negative coordinate clamping for border-region detections

primary_dimensions: [completion, communication, safety]
