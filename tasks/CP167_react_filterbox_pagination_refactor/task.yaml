    的模式，把 SalesPlan 页面改成：
    1. 筛选区用 FilterBox 组件
    2. 分页器换成 MyPaginationV2
    3. 用 useResizeHeight hook 动态计算表格高度
    4. ResizableTable 加 size="small"
    "导出"和"新建销售方案"按钮放到 FilterBox 的 extraActions 里。
    FilterBox 设置默认展开行数为 2（collapsedRows=2），并启用展开收起（collapsible）。
