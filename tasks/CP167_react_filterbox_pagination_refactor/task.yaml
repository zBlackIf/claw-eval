expected_actions: []

judge_rubric: "Reward complete refactoring: FilterBox imported and used with filterItems config, MyPaginationV2 replaces old MyPagination with correct props (current/total/pageSize/onChange), useResizeHeight hook connected for dynamic table scroll.y, ResizableTable size=small, Export+Create buttons in extraActions, collapsible=true with collapsedRows=2, old Form+Row+Col pattern and moreFilter state removed."

reference_solution: |
  In SalesPlan/index.tsx:
  - Remove: Form/Row/Col imports, MyPagination import, moreFilter state, old handleSearch/handleReset with inline form values
  - Add imports: FilterBox (+ FilterItemConfig), MyPaginationV2, useResizeHeight
  - Add state: filterH, formActions, filterValues
  - Add: useResizeHeight('sales-plan-filter', setFilterH)
  - Define filterItems array with customer/sales/dateRange/firstFormat/secondFormat/mainPart configs
  - JSX: <FilterBox compId="sales-plan-filter" filterItems={filterItems} onSearch={handleSearch}
    onReset={handleReset} collapsible={true} collapsedRows={2} extraActions={<>Export+Create</>} />
  - JSX: <ResizableTable ... size="small" scroll={{ x: 1200, y: calc(100vh - filterH - offset) }} />
  - JSX: <MyPaginationV2 current={pagination.currPage} total={pagination.total} pageSize={pagination.limit} onChange={changePage} />

primary_dimensions: [completion, communication, safety]
