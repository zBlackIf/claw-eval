services: []

prompt:
  text: |
    项目里 SalesPlan 页面（/workspace/fixtures/salestable/src/pages/SalesPlan/index.tsx）
    还在用老式的 Form + Row + Col 做筛选，MyPagination 做分页。参照同项目已完成的
