judge_rubric: |
  ## Expected Behavior

  1. Agent 读取 csproj 文件了解项目配置（.NET 6, nullable enabled）
  2. Agent 读取 ModbusTcpClient.cs 学习项目代码风格（XML注释、SemaphoreSlim、命名空间格式等）
  3. Agent 读取 task_spec.md 了解要创建的组件详细要求
  4. 创建 Data/Buffer/CircularBuffer.cs - 线程安全泛型环形缓冲区
  5. 创建 Data/Alarm/AlarmManager.cs - 报警管理系统
  6. 创建 Data/Log/LogLevel.cs - 日志级别枚举及扩展方法

  ## Grading Criteria

  - [ ] read_existing_code
  - [ ] read_spec
  - [ ] buffer_created
  - [ ] buffer_quality
  - [ ] alarm_created
  - [ ] alarm_quality
  - [ ] log_created
  - [ ] log_quality
  - [ ] namespace_consistent

  ## LLM Judge Rubric

  ### Criterion 1: 代码风格一致性 (Weight: 25%)
  **Score 1.0**: 新创建的三个文件完全匹配现有ModbusTcpClient.cs的代码风格：使用XML summary注释、命名空间格式为MinqiaIndustrialComponentLibrary.Data.XXX、使用nullable reference types、SemaphoreSlim/lock做线程安全、遵循C# 10语法特性。
  **Score 0.75**: 风格大体一致，但XML注释不够完整或nullable使用不一致。
  **Score 0.5**: 基本的C#代码风格正确但未特别匹配现有项目风格。
  **Score 0.25**: 代码风格与项目明显不一致。
  **Score 0.0**: 未参考现有代码风格。

  ### Criterion 2: CircularBuffer实现质量 (Weight: 30%)
  **Score 1.0**: 泛型实现正确；线程安全使用SemaphoreSlim或lock；Write/Read/Peek/Clear全部实现；满时覆盖最旧数据、空时Read抛异常的逻辑正确；Count/Capacity/IsEmpty/IsFull属性正确；内部使用数组+head/tail指针的经典实现。
  **Score 0.75**: 核心功能正确，但边界条件处理有小问题（如满时覆盖逻辑不完美）。
  **Score 0.5**: 基本结构正确但线程安全缺失或部分方法未实现。
  **Score 0.25**: 仅有类骨架，大部分方法未实现。
  **Score 0.0**: 未创建环形缓冲区组件。

  ### Criterion 3: AlarmManager设计合理性 (Weight: 25%)
  **Score 1.0**: AlarmEntry包含全部字段；AlarmSeverity枚举完整；AlarmManager线程安全，包含event OnAlarmRaised；RaiseAlarm/AcknowledgeAlarm/GetActiveAlarms/GetAlarmHistory/ClearAll全部实现；active和history分离管理。
  **Score 0.75**: 主要功能实现但event机制缺失或history管理不完善。
  **Score 0.5**: 基本CRUD功能有但缺少线程安全或事件机制。
  **Score 0.25**: 仅有AlarmEntry定义，Manager功能不完整。
  **Score 0.0**: 未创建报警管理组件。

  ### Criterion 4: LogLevel枚举与扩展方法 (Weight: 20%)
  **Score 1.0**: LogLevel枚举包含Trace到Fatal全部6个级别；LogLevelExtensions静态类包含ToDisplayString()和IsHigherThan()扩展方法；代码简洁，有XML注释。
  **Score 0.75**: 枚举和扩展方法都有但扩展方法实现不够优雅。
  **Score 0.5**: 有枚举但缺少扩展方法类。
  **Score 0.25**: 枚举级别不完整。
  **Score 0.0**: 未创建日志级别组件。
