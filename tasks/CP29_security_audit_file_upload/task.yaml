judge_rubric: |
  ## Expected Behavior

  1. Agent读取 project_structure.txt 了解项目布局
  2. Agent读取 upload.service.ts 发现前端无文件类型校验
  3. Agent读取 UploadHandler.java 发现3个漏洞（路径穿越、无大小限制、web root内存储）
  4. Agent读取 ETLHandler.java 发现2个漏洞（Content-Type易伪造、文件名未净化）
  5. Agent读取 SecurityConfig.java 发现缺失安全配置
  6. Agent生成 audit_report.md（漏洞清单+风险等级+修复建议）
  7. Agent生成修复代码示例

  ## Grading Criteria

  - [ ] read_inputs
  - [ ] report_created
  - [ ] vulns_identified
  - [ ] risk_rated
  - [ ] has_recommendations
  - [ ] fix_code

  ## LLM Judge Rubric

  ### Criterion 1: 漏洞识别完整性 (Weight: 30%)
  **Score 1.0**: 识别了全部关键漏洞——UploadHandler中的路径穿越（未净化文件名）、无文件大小限制、存储在web root内可直接访问；ETLHandler中的Content-Type伪造绕过、文件名注入；前端upload.service无类型校验；SecurityConfig缺失CSRF和CSP配置。
  **Score 0.75**: 识别了5-6个漏洞。
  **Score 0.5**: 识别了3-4个漏洞。
  **Score 0.25**: 仅识别了1-2个漏洞。
  **Score 0.0**: 未有效识别漏洞。

  ### Criterion 2: 攻击向量分析深度 (Weight: 25%)
  **Score 1.0**: 对每个漏洞给出了具体的攻击场景——路径穿越payload（../../etc/crontab）、双扩展名绕过（shell.php.jpg）、Content-Type伪造上传恶意ETL配置执行命令；分析了攻击链（上传webshell到web root -> 直接访问执行）。
  **Score 0.75**: 给出了主要攻击向量但不够详细。
  **Score 0.5**: 有攻击分析但缺少具体payload。
  **Score 0.25**: 攻击分析过于笼统。
  **Score 0.0**: 未进行攻击向量分析。

  ### Criterion 3: 修复建议可操作性 (Weight: 25%)
  **Score 1.0**: 提供了具体可操作的修复代码——文件名净化（去除路径分隔符/特殊字符）、扩展名白名单校验、magic bytes检查、存储路径移到web root外、配置文件大小限制、添加CSRF Token；修复代码可直接集成。
  **Score 0.75**: 修复建议具体但部分缺少代码示例。
  **Score 0.5**: 有修复方向但不够具体。
  **Score 0.25**: 仅有笼统的安全建议。
  **Score 0.0**: 未提供修复建议。

  ### Criterion 4: 报告结构与风险评级 (Weight: 20%)
  **Score 1.0**: audit_report.md结构专业——包含执行摘要、审计范围、漏洞清单（每项含描述/风险等级/影响/PoC/修复建议）、风险矩阵（按严重性排序）、总体评估；风险等级准确（路径穿越=高危，缺少大小限制=中危）。
  **Score 0.75**: 报告结构完整但风险评级个别有偏差。
  **Score 0.5**: 报告基本完整但不够专业。
  **Score 0.25**: 报告简略。
  **Score 0.0**: 未生成报告。
