services: []
prompt:
  text: |
    我已经把原始项目素材放在容器的 `/workspace/fixtures/` 目录下，请把这些文件当作只读输入。

    输入文件如下（右侧是它在原项目中的相对路径）：
    - `/workspace/fixtures/project_structure.txt` -> `project_structure.txt`
    - `/workspace/fixtures/src/app/shared/services/upload.service.ts` -> `src/app/shared/services/upload.service.ts`
    - `/workspace/fixtures/server/api/UploadHandler.java` -> `server/api/UploadHandler.java`
    - `/workspace/fixtures/server/api/ETLHandler.java` -> `server/api/ETLHandler.java`
    - `/workspace/fixtures/server/config/SecurityConfig.java` -> `server/config/SecurityConfig.java`

    请基于这些输入完成下面的原始需求：

    请对提供的项目代码进行文件上传漏洞安全审计。项目结构在 project_structure.txt 中，关键代码文件包括前端的 upload.service.ts 和后端的 UploadHandler.java、ETLHandler.java、SecurityConfig.java。

    请完成以下审计任务：
    1. 分析项目结构，定位所有文件上传处理点
    2. 对每个上传点检查6项安全措施：扩展名白名单、MIME校验、magic bytes校验、文件名净化、存储路径安全、大小限制
    3. 深入分析可利用的攻击向量（路径穿越、双扩展名绕过等）
    4. 生成 audit_report.md 安全审计报告，包含漏洞列表、风险等级、修复建议
    5. 生成 security_fix.java 示例修复代码

    交付要求：
    - 需要修改已有文件时，请把修改后的版本写到 `/workspace/` 下对应的原项目相对路径。
    - 需要新增文件时，请按需求中的文件名或上面列出的目标路径写到 `/workspace/` 下。
    - 最终回复只需概述完成情况、关键改动和生成的文件；不要只在最终回复中贴代码或报告正文。
  language: zh
