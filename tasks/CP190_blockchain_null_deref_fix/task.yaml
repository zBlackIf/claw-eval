judge_rubric: "Reward null-safe fix in getChainType(): (1) proper null check on nodeEntity, (2) meaningful fallback value or exception — NOT assigning null to chainType, (3) error logging with useful context, (4) unit test covering the null branch with mock/stub and assertion, (5) preserving original code structure and style."

reference_solution: |
  In getChainType():
  - Add null check: if (nodeEntity != null) { chainType = nodeEntity.getChainType(); }
  - Else branch: assign "UNKNOWN" or throw IllegalStateException, with log.error
  - Do NOT assign null (downstream path concat creates "/data/blocks/null/sync")
  In test file:
  - Mock IRpcRoutingService to return null/failed RpcRouteInfo
  - Mock/stub ChainRegistryHelper.getNodeByIdentifier to return null
  - Assert that getChainType handles null gracefully (no NPE, returns default or throws expected exception)

