    Use the skills in .claude/skills/ to generate rsdd.md for the requirement
    in workspace/REQ-20250301/. Follow each skill (01 through 05) in order.
    The voc.md file has all the input you need. Output the final rsdd.md into
    workspace/REQ-20250301/rsdd.md.
  language: en

