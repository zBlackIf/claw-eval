sandbox_files:
  - fixtures/project/.claude/skills/01-rsdd-requirement/SKILL.md
  - fixtures/project/.claude/skills/01-rsdd-requirement/template-chapter.md
  - fixtures/project/.claude/skills/02-rsdd-environment/SKILL.md
  - fixtures/project/.claude/skills/02-rsdd-environment/template-chapter.md
  - fixtures/project/.claude/skills/03-rsdd-scenario/SKILL.md
