    旧的 Vue 2 / uni-app 项目迁移过来的表单 change 事件处理模块（mixin 写法）。

    请帮我把它转换成 Vue 3 的独立 ES 模块，输出到：
    /workspace/fixtures/cm-form-designer-h5/plugin/utils/change-runner.js

    要求：
    - 不再用 mixin，改为纯函数导出（composable 风格也行）
