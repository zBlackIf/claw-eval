judge_rubric: "Reward correct conversion: (1) eval() completely removed, replaced with new Function(); (2) separate Map for string cache + WeakMap for function cache (the key bug); (3) cache size limit to prevent unbounded growth; (4) explicit context object parameter replacing mixin this; (5) try/catch error boundaries with console.warn; (6) no #ifdef/#endif directives; (7) exports createChangeContext, resolveChangeHandler, runFieldChange."

reference_solution: |
  plugin/utils/change-runner.js should export:
  - createChangeContext({ form, option, globalOptions }) → context object
    with { form, option, findObject, axios }
  - resolveChangeHandler(change, context) → function or undefined
    - String branch: normalize source, check stringFactoryCache (Map, size-limited),
      rewrite this→context via regex, compile with new Function('context', ...),
      cache result, call factory(context), wrap in try/catch
    - Function branch: check functionFactoryCache (WeakMap), if source has this,
      rewrite and compile, cache in WeakMap, else return directly
  - runFieldChange(prop, { form, option, globalOptions }) → void
    - finds field via findObject, resolves handler, calls it with { value, column, form }

primary_dimensions: [completion, communication, safety]
