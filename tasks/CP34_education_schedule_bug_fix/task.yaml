services: []
prompt:
  text: |
    我已经把原始项目素材放在容器的 `/workspace/fixtures/` 目录下，请把这些文件当作只读输入。

    输入文件如下（右侧是它在原项目中的相对路径）：
    - `/workspace/fixtures/backend/schedule_api.py` -> `backend/schedule_api.py`
    - `/workspace/fixtures/frontend/ScheduleView.vue` -> `frontend/ScheduleView.vue`

    请基于这些输入完成下面的原始需求：

    教务排课系统有几个用户反馈的bug，代码在 `backend/schedule_api.py` 和 `frontend/ScheduleView.vue`。

    用户反馈：
    1. 重复排课时，排的周二的课，但排到了每周三
    2. 教师、教室下拉框选择不了
    3. 排课成功后卡片不显示课程名、教师名和教室名，刷新后才正常
    4. 排课卡片太窄，文字换行显示不全

    请逐一排查并修复这些bug。每个bug需要：
    - 说明根因
    - 给出修复方案
    - 修改代码

    交付要求：
    - 需要修改已有文件时，请把修改后的版本写到 `/workspace/` 下对应的原项目相对路径。
    - 需要新增文件时，请按需求中的文件名或上面列出的目标路径写到 `/workspace/` 下。
    - 最终回复只需概述完成情况、关键改动和生成的文件；不要只在最终回复中贴代码或报告正文。
