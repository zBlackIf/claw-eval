judge_rubric: |
  ## Expected Behavior

  1. Agent reads both files thoroughly
  2. Agent identifies 4 distinct bugs:
     - Day-of-week off-by-one in repeat scheduling (DAY_MAP vs frontend indexing)
     - Dropdown binding: :value="t" binds object instead of t.id
     - Schedule cards: API returns only IDs, not joined names; frontend push without name resolution
     - CSS: schedule-card has no min-width
  3. Agent fixes all bugs in both backend and frontend code
  4. Agent explains root cause for each

  ## Grading Criteria

  - [ ] day_off_by_one_identified: Root cause of wrong-day bug explained
  - [ ] day_off_by_one_fixed: Code fix applied to resolve day mapping
  - [ ] dropdown_binding_fixed: Teacher/classroom dropdown :value uses ID not object
  - [ ] api_returns_names: Backend get_teachers/get_classrooms returns value/label format OR schedule response includes names
  - [ ] card_display_fixed: Frontend schedule cards show names immediately after creation (not requiring refresh)
  - [ ] card_min_width_added: CSS min-width added to schedule-card

  ## LLM Judge Rubric

  ### Criterion 1: Root Cause Analysis (Weight: 30%)

  **Score 1.0**: All 4 bugs have clear, correct root cause explanations with reference to specific code lines. Day-off-by-one traced to DAY_MAP vs frontend 1-indexing. Dropdown traced to :value binding object vs ID. Card display traced to API returning only IDs. CSS width explicitly mentioned.
  **Score 0.75**: 3 of 4 root causes correctly identified and explained.
  **Score 0.5**: 2 root causes correct.
  **Score 0.25**: Only 1 correct.
  **Score 0.0**: No correct root cause analysis.

  ### Criterion 2: Fix Correctness (Weight: 35%)

  **Score 1.0**: All 4 fixes are correct and complete. Day mapping adjusted properly. Dropdown binds to integer ID. API enriches response with names (either in list endpoint or in creation response). CSS has min-width.
  **Score 0.75**: 3 of 4 fixes correct and complete.
  **Score 0.5**: 2 fixes correct.
  **Score 0.25**: 1 fix correct.
  **Score 0.0**: No correct fix.

  ### Criterion 3: Code Quality of Fixes (Weight: 20%)

  **Score 1.0**: Fixes are minimal, targeted, and idiomatic for both Python and Vue. No unnecessary refactoring. Comments explain the fix rationale.
  **Score 0.75**: Good quality but slightly over-engineered or under-documented.
  **Score 0.5**: Fixes work but code quality is poor (e.g., duplicated lookup logic).
  **Score 0.25**: Fixes partially work with significant code issues.
  **Score 0.0**: Broken code.

  ### Criterion 4: Completeness (Weight: 15%)

  **Score 1.0**: All 4 bugs addressed with both backend and frontend changes where needed. No introduced regressions.
  **Score 0.75**: 3 of 4 fully addressed.
  **Score 0.5**: 2 of 4 addressed.
  **Score 0.25**: Only 1 addressed.
  **Score 0.0**: None addressed.
