judge_rubric: |
  评估 agent 是否正确重写了 mPython 光电测速系统。

  ## 核心修复
  - 是否实现了动态校准流程（A键开始/B键结束）
  - 阈值是否基于实测电压动态计算（非硬编码）
  - 状态机是否完整（未校准→校准中→已校准→测量中）
  - 每个脉冲是否产生速度数据（非时间批次）
  - 是否有2秒超时自动停止

  ## API 合规
  - 是否使用正确的 mPython API（MPythonPin, PinMode, read_analog, oled, button_a/b）
  - 是否参考了 sensor_test_reference.py 的引脚初始化

  ## 评分标准
  - 0.9-1.0: 全部功能正确实现，API合规
  - 0.7-0.8: 主要功能正确，少量API不合规
  - 0.4-0.6: 部分功能实现但有明显错误
  - 0.0-0.3: 未完成或严重错误

reference_solution: |
  1. 主机程序实现动态校准+状态机+逐脉冲测速
  2. 从机程序接收无线数据并串口输出
  3. 两个说明md文件

primary_dimensions: [completion, robustness, communication]
