services: []
prompt:
  text: |
    我已经把原始项目素材放在容器的 `/workspace/fixtures/` 目录下，请把这些文件当作只读输入。

    输入文件如下（右侧是它在原项目中的相对路径）：
    - `/workspace/fixtures/DS_speed_car/diagnostic_data.csv` -> `DS_speed_car/diagnostic_data.csv`
    - `/workspace/fixtures/DS_speed_car/sensor_test_reference.py` -> `DS_speed_car/sensor_test_reference.py`

    请基于这些输入完成下面的原始需求：

    现在请你充当一下硬件工程师。

    我有两套掌控板2.0，要开发光电测速系统。硬件配置：主机掌控板激光模块接P0（数字输出），光敏模块接P1（模拟输入）。从机掌控板用无线通信模块（频道2）。物理参数：轮径49.52mm，漏光缝12个（30度/缝），缝间距弧长12.97mm。

    之前的版本有严重bug：阈值写死导致环境光变化时完全无法检测脉冲。诊断数据在 DS_speed_car/diagnostic_data.csv 里，你可以看到电压范围是 1359-4095，之前的固定阈值(661.5-773.5)完全不在这个范围内。

    现在需要重写主机程序，修复以下问题：

    1. 增加校准流程：按A键开始校准，用户转动轮子，按B键结束校准。基于实测电压范围自动计算阈值（建议用10%-90%范围设高低阈值）
    2. 状态机：未校准->A键校准->B键结束校准->已校准->A键测量->B键停测量
    3. 每个脉冲（暗->亮跳变）都应该产生一个速度数据，不要用时间间隔限制发送频率
    4. 2秒无脉冲自动停止
    5. 测量结束OLED显示：初速度、末速度、最小速度、最大速度
    6. 无线发送每个速度数据给从机，从机串口输出"timestamp,speed"格式

    代码必须符合mPython的microPython规范，参考 DS_speed_car/sensor_test_reference.py 中的引脚初始化方式。

    同时给每个程序附一个说明md文件。

    交付要求：
    - 需要修改已有文件时，请把修改后的版本写到 `/workspace/` 下对应的原项目相对路径。
    - 需要新增文件时，请按需求中的文件名或上面列出的目标路径写到 `/workspace/` 下。
    - 最终回复只需概述完成情况、关键改动和生成的文件；不要只在最终回复中贴代码或报告正文。
