judge_rubric: |
  ## Expected Behavior

  1. Agent reads diagnostic data to understand actual voltage ranges
  2. Agent reads reference code to understand mPython API conventions
  3. Creates master program with calibration state machine
  4. Creates slave program for wireless data reception
  5. Creates documentation for both programs
  6. Uses correct mPython APIs (MPythonPin, PinMode, button_a, oled, etc.)

  ## Grading Criteria

  - [ ] master_program_created: Master program .py file created
  - [ ] slave_program_created: Slave program .py file created
  - [ ] calibration_flow: Master has A-key calibration, B-key stop calibration logic
  - [ ] dynamic_threshold: Threshold computed from calibration data, not hardcoded
  - [ ] per_pulse_speed: Each pulse generates a speed data point
  - [ ] auto_stop: 2-second timeout stops measurement
  - [ ] correct_mpython_api: Uses MPythonPin, PinMode.ANALOG, oled.DispChar etc.

  ## LLM Judge Rubric

  ### Criterion 1: Bug Fix Effectiveness (Weight: 30%)
    - 1.0: Dynamic calibration fully replaces hardcoded thresholds, addresses the exact voltage range issue (1359-4095) shown in diagnostic data
    - 0.75: Calibration implemented but might not handle the full voltage range
    - 0.5: Partial fix - wider thresholds but still hardcoded
    - 0.25: Acknowledges the problem but fix is insufficient
    - 0.0: Same hardcoded thresholds or worse

  ### Criterion 2: State Machine Design (Weight: 25%)
    - 1.0: Clean state machine with proper transitions (idle->calibrating->calibrated->measuring->done), handles edge cases
    - 0.75: State machine works but edge cases not handled
    - 0.5: States exist but transitions are fragile
    - 0.25: No clear state machine, ad-hoc logic
    - 0.0: No state management

  ### Criterion 3: Signal Processing (Weight: 25%)
    - 1.0: Correct hysteresis filter with dynamic thresholds, per-pulse speed calculation using arc distance, proper edge detection
    - 0.75: Good signal processing with minor issues
    - 0.5: Basic edge detection but no hysteresis
    - 0.25: Speed calculation has physics errors
    - 0.0: No meaningful signal processing

  ### Criterion 4: mPython API Compliance (Weight: 20%)
    - 1.0: All APIs match mPython spec (MPythonPin, read_analog, write_digital, oled.DispChar, button_a.value, wifi/radio for wireless)
    - 0.75: Most APIs correct, 1-2 wrong
    - 0.5: Mix of correct and incorrect APIs
    - 0.25: Mostly standard Python, not mPython
    - 0.0: No mPython-specific APIs used
