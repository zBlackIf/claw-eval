judge_rubric: |
  ## Expected Behavior

  1. Agent reads all four source files and traces the data flow from AgentView -> PlanChatPanel -> agentChatManagerDB -> server routes
  2. Agent identifies the race condition in the watch(currentChatId) that fires without cancelling pending auto-saves
  3. Agent identifies the debounce bug in PlanChatPanel where props.chat.id can change between schedule and execution
  4. Agent identifies the missing dirty-check before chat switching in handleSelectChat
  5. Agent identifies the lack of optimistic locking / version control in the PUT endpoint
  6. Agent produces concrete code fixes addressing at least the top 3 issues

  ## Grading Criteria

  - [ ] race_condition_identified: Agent identifies the auto-save race condition when switching chats
  - [ ] cross_chat_overwrite_fixed: PlanChatPanel auto-save pins the chat ID at schedule time, not execution time
  - [ ] dirty_check_added: handleSelectChat warns or saves before switching if context is dirty
  - [ ] request_dedup_or_cancel: Added AbortController, request dedup, or pending-save cancellation
  - [ ] server_concurrency_addressed: Agent mentions or fixes the last-write-wins problem on the PUT endpoint

  ## LLM Judge Rubric

  ### Criterion 1: Root Cause Analysis Depth (Weight: 30%)
    - 1.0: Identifies all 4+ race conditions (auto-save cross-chat, watcher overlap, no dirty-check, no server locking), traces full data flow across all files
    - 0.75: Identifies 3 of the race conditions with clear explanation
    - 0.5: Identifies the main auto-save race but misses dirty-check or server-side issues
    - 0.25: Vaguely mentions "timing issues" without specific trace
    - 0.0: Wrong diagnosis or only surface-level observation

  ### Criterion 2: Fix Quality - Client Side (Weight: 30%)
    - 1.0: Fixes pin chatId at debounce-schedule time, adds AbortController or cancel-on-switch, adds dirty-check with save-or-discard prompt
    - 0.75: Fixes 2 of the 3 client-side issues correctly
    - 0.5: Fixes auto-save pinning but misses cancel/dirty-check
    - 0.25: Attempted fixes that are incomplete or introduce new bugs
    - 0.0: No code changes or wrong fixes

  ### Criterion 3: Fix Quality - Server/DB Side (Weight: 20%)
    - 1.0: Adds optimistic locking (version column or ETag) to PUT context, removes inline message loading from GET /
    - 0.75: Addresses one of the two server issues
    - 0.5: Mentions the server issues but fix is incomplete
    - 0.25: Only adds comments about the problem
    - 0.0: Does not address server-side issues

  ### Criterion 4: Solution Architecture (Weight: 20%)
    - 1.0: Proposes centralized data manager pattern (e.g. chatDataManager) or Pinia store to prevent future race conditions, with clear separation of concerns
    - 0.75: Good architectural improvement but not fully centralized
    - 0.5: Fixes are scattered across files without a unifying pattern
    - 0.25: Fixes work but are fragile
    - 0.0: No architectural consideration
