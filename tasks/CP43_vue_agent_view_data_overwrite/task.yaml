services: []
prompt:
  text: |
    我已经把原始项目素材放在容器的 `/workspace/fixtures/` 目录下，请把这些文件当作只读输入。

    输入文件如下（右侧是它在原项目中的相对路径）：
    - `/workspace/fixtures/web/src/views/AgentView.vue` -> `web/src/views/AgentView.vue`
    - `/workspace/fixtures/web/src/components/PlanChatPanel.vue` -> `web/src/components/PlanChatPanel.vue`
    - `/workspace/fixtures/web/src/utils/agentChatManagerDB.js` -> `web/src/utils/agentChatManagerDB.js`
    - `/workspace/fixtures/server/src/routes/agentChats.js` -> `server/src/routes/agentChats.js`

    请基于这些输入完成下面的原始需求：

    帮我分析，web/src/views/AgentView.vue 及子组件内，由于加载数据及编辑时，会造成 agent_chats，agent_chat_context 及相关数据表的数据列被覆盖、错位等致命问题。

    具体来说：切换聊天时，正在编辑的上下文（context）没保存就丢了；自动保存可能把A聊天的内容写到B聊天里去；加载聊天列表会覆盖掉本地还没同步的修改。

    帮我找到根因并给出修复方案，要改代码。

    交付要求：
    - 需要修改已有文件时，请把修改后的版本写到 `/workspace/` 下对应的原项目相对路径。
    - 需要新增文件时，请按需求中的文件名或上面列出的目标路径写到 `/workspace/` 下。
    - 最终回复只需概述完成情况、关键改动和生成的文件；不要只在最终回复中贴代码或报告正文。
  language: zh
