services: []

prompt:
  text: |
    <!-- CLAW-EVAL-FIXTURE-PREAMBLE -->
    以下文件已注入到容器内，请按给出的容器绝对路径读取（容器 WORKDIR = `/workspace`）：

    - `/workspace/fixtures/web/src/views/AgentView.vue`
    - `/workspace/fixtures/web/src/components/PlanChatPanel.vue`
    - `/workspace/fixtures/web/src/utils/agentChatManagerDB.js`
    - `/workspace/fixtures/server/src/routes/agentChats.js`

    所有产物请落到 `/workspace/...` 下；评分仅捕获 `/workspace/` 内的文件。

    帮我分析，web/src/views/AgentView.vue 及子组件内，由于加载数据及编辑时，会造成 agent_chats，agent_chat_context 及相关数据表的数据列被覆盖、错位等致命问题。

    具体来说：切换聊天时，正在编辑的上下文（context）没保存就丢了；自动保存可能把A聊天的内容写到B聊天里去；加载聊天列表会覆盖掉本地还没同步的修改。

    帮我找到根因并给出修复方案，要改代码。
  language: zh

