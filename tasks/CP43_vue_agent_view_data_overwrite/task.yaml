judge_rubric: |
  评估 agent 对 Vue 数据覆盖问题的诊断和修复质量。

  ## 关键问题识别
  - 是否识别 debounced autoSave 的竞态（chat ID 在 debounce 期间可能改变）
  - 是否识别 loadChats 全量覆盖本地状态的问题
  - 是否识别切换聊天时缺少 dirty check

  ## 修复质量
  - PlanChatPanel: autoSave 是否固定了 chatId（闭包捕获或 ref）
  - AgentView: handleSelectChat 是否增加了脏检查或自动保存
  - 是否有请求取消/去重机制

  ## 评分标准
  - 0.9-1.0: 全部问题识别且修复完整
  - 0.7-0.8: 核心竞态修复，部分问题遗漏
  - 0.4-0.6: 识别问题但修复不完整
  - 0.0-0.3: 未识别核心问题

reference_solution: |
  1. PlanChatPanel: 在 autoSave 闭包中捕获 chatId 快照
  2. AgentView: handleSelectChat 先取消 pending autoSave，再检查 dirty
  3. 添加 AbortController 或请求去重
  4. 服务端添加版本号/etag 防止 last-write-wins

primary_dimensions: [completion, robustness, communication]
