judge_rubric: "Reward correct implementation of API version guards for Android backward compatibility: (1) OverlayForegroundController must check Build.VERSION.SDK_INT >= UPSIDE_DOWN_CAKE before using FOREGROUND_SERVICE_TYPE_SPECIAL_USE, with plain startForeground for older APIs; (2) HyperIsleApp must replace lateinit with safe defaults using FallbackVersionEnforcer; (3) ScreenRecordingController must guard API 34+ calls; (4) ScreenCaptureDetectorActivity must early-finish on pre-34 devices; (5) EncryptedSharedPreferences must have try-catch with fallback to plain SharedPreferences."

reference_solution: |
  1. OverlayForegroundController.startForeground():
     if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
         service.startForeground(id, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
     } else {
         service.startForeground(id, notification)
     }

  2. FallbackVersionEnforcer.kt:
     class FallbackVersionEnforcer : VersionEnforcer {
         override val versionStatus = MutableStateFlow(VersionStatus.Allowed).asStateFlow()
         override suspend fun checkVersion() = VersionCheckResult.Allowed
     }
     HyperIsleApp: var versionEnforcer: VersionEnforcer = FallbackVersionEnforcer()

  3. OverlayScreenRecordingController.register()/unregister():
     if (Build.VERSION.SDK_INT < Build.VERSION_CODES.UPSIDE_DOWN_CAKE) return

  4. ScreenCaptureDetectorActivity.onCreate():
     if (Build.VERSION.SDK_INT < Build.VERSION_CODES.UPSIDE_DOWN_CAKE) { finish(); return }

  5. HyperIsleApp.createEncryptedPrefs():
     try { EncryptedSharedPreferences... }
     catch (e: Exception) { getSharedPreferences("fallback_prefs", MODE_PRIVATE) }

