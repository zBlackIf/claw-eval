services: []

prompt:
  text: |
    HyperIsle2 项目（compileSdk=36, minSdk=26）在 Android 9 (API 28) 设备上频繁崩溃。
    代码在 /workspace/fixtures/HyperIsle2/。请修复以下问题：

    1. OverlayForegroundController 里 startForeground() 使用了
       ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE，这是 API 34+ 才有的。
       低于 API 34 的设备上要用不带 type 参数的 startForeground(id, notification)。

    2. HyperIsleApp 里 versionEnforcer 等字段是 lateinit var，如果 initializeFeatureControl()
       抛异常就会导致后续访问时 UninitializedPropertyAccessException 崩溃。
       需要创建 FallbackVersionEnforcer（checkVersion 永远返回 Allowed）作为安全默认值，
       把 lateinit 改成带默认值的 var。

    3. OverlayScreenRecordingController 使用了 API 34+ 的 addScreenRecordingCallback，
       低版本设备会 NoSuchMethodError。需要加 Build.VERSION.SDK_INT >= 34 的检查，
       低版本直接 return。

    4. ScreenCaptureDetectorActivity 使用了 API 34+ 的 registerScreenCaptureCallback，
       低版本设备要在 onCreate 里检查版本，如果低于 API 34 直接 finish() 退出。

    5. createEncryptedPrefs() 在 Huawei Android 9 上 KeyStore 会抛异常。
       要加 try-catch，失败时 fallback 到普通 SharedPreferences。
  language: zh

