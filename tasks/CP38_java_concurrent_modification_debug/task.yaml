judge_rubric: |
  Evaluate the agent's diagnosis and fix of the ConcurrentModificationException.

  ## Root Cause Understanding
  - Does the agent correctly identify the shared mutable static ArrayList as the root cause?
  - Does it explain why iteration + modification from concurrent threads causes CME?
  - Does it understand the fail-fast iterator mechanism?

  ## Fix Quality
  - Does the fix use a proper thread-safe approach (CopyOnWriteArrayList, Collections.unmodifiableList, synchronized, etc.)?
  - Does the fix NOT simply catch and swallow the exception?
  - Is the fix minimal and targeted?

  ## Scoring
  - 0.9-1.0: Correct root cause, proper thread-safe fix, clear explanation
  - 0.7-0.8: Correct fix but explanation lacks depth
  - 0.4-0.6: Partial fix or incorrect root cause
  - 0.0-0.3: Suppresses exception or fails to fix

reference_solution: |
  Root cause: SQL_KEYWORDS is a static ArrayList shared across all threads.
  The addKeyword/removeKeyword methods modify it while contains() iterates it.
  Under concurrency, one thread iterates (for-each via Iterator) while another
  thread calls addKeyword(), triggering the fail-fast CME.

  Fix: Replace ArrayList with CopyOnWriteArrayList, or make the list unmodifiable
  after initialization and use a separate lock for modifications.

