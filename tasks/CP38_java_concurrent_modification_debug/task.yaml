        at java.util.ArrayList$Itr.checkForComodification(ArrayList.java:911)
        at java.util.ArrayList$Itr.next(ArrayList.java:861)
        at cn.dreamit.p1000.util.RequestUtil.contains(RequestUtil.java:37)
        at cn.dreamit.p1000.util.RequestUtil.contains(RequestUtil.java:23)
        at cn.dreamit.p1000.filter.AntiSqlInjectionfilter.doFilter(AntiSqlInjectionfilter.java:125)

