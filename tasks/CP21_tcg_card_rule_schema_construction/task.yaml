judge_rubric: |
  ## Expected Behavior

  1. Agent creates rule.json with all game mechanics faithfully encoded
  2. Agent creates 6+ card JSON files following the schema
  3. Agent creates the skill file
  4. Agent does NOT invent extra rules or mechanics not stated

  **Hard red lines**:
  - rule.json missing any of the 5 card types -> card_types_complete = 0
  - Any card JSON missing required fields (name, type, tier for heroes) -> card_schema_valid = 0
  - Adding game mechanics not described in the prompt -> no_extra_rules = 0

  ## Grading Criteria

  - [ ] rule_json_present: rule.json exists and is valid JSON
  - [ ] card_types_complete: all 5 card types defined in rule.json
  - [ ] card_files_count: at least 6 card JSON files created
  - [ ] card_schema_valid: all card files contain required fields
  - [ ] turn_actions_complete: all 9 turn actions defined in rule.json
  - [ ] no_extra_rules: no mechanics invented beyond the prompt

  ## LLM Judge Rubric

  ### Criterion 1: Workflow Design (Weight: 30%)
    - 1.0: Clear step-by-step workflow with proper sequencing, conditions, and error handling
    - 0.75: Good workflow with minor sequencing or condition gaps
    - 0.5: Basic workflow present but missing important steps or conditions
    - 0.25: Incomplete or poorly designed workflow
    - 0.0: No meaningful workflow design

  ### Criterion 2: Implementation Completeness (Weight: 30%)
    - 1.0: All required components implemented, tested, and documented
    - 0.75: Most components present with minor omissions
    - 0.5: Core functionality present but missing important pieces
    - 0.25: Partial implementation with critical gaps
    - 0.0: Barely started or non-functional

  ### Criterion 3: Integration Quality (Weight: 25%)
    - 1.0: Seamless integration with existing systems, proper API usage, and data flow
    - 0.75: Generally well-integrated with minor issues
    - 0.5: Basic integration but some compatibility issues
    - 0.25: Poor integration, significant friction with existing systems
    - 0.0: No meaningful integration

  ### Criterion 4: Documentation (Weight: 15%)
    - 1.0: Clear usage instructions, configuration guide, and troubleshooting tips
    - 0.75: Good documentation with minor gaps
    - 0.5: Basic documentation present
    - 0.25: Minimal or unclear documentation
    - 0.0: No documentation
