judge_rubric: |
  评估 agent 是否严格按照用户描述的规则创建了完整的 TCG 游戏规则系统。

  ## 规则完整性
  - rule.json 是否包含全部 7 个规则模块（卡牌类型、场面结构、卡组构筑、费用系统、回合操作、英雄卡要素、击败与胜负）
  - 每个模块的细节是否与 prompt 完全一致（如手牌上限 7、卡组 30 张、同名至多 4 张等数字）
  - 回合操作的 9 个阶段是否按正确顺序列出

  ## 卡牌文件质量
  - 是否创建了至少 6 张卡牌（2 英雄不同阶 + 装备 + 谋略 + 技能 + 野怪）
  - 英雄卡是否包含全部 9 个要素（name, card_art, hp, retreat_cost, defeat_cost, revive_cost, effects, tags, tier）
  - 非英雄卡是否对不适用字段留 null
  - JSON 格式是否合法且 schema 一致

  ## 严格性
  - 是否添加了 prompt 未要求的额外规则或机制
  - 是否遗漏了 prompt 中明确要求的任何内容

  ## 文档质量
  - arena_tcg_card_import.md 是否描述了标准操作流程

  ## 评分标准
  - 0.9-1.0: 完美执行，所有规则模块完整且精确，6+ 张卡牌 schema 一致，无额外内容
  - 0.7-0.8: 大部分正确，少量细节遗漏或 schema 不一致
  - 0.4-0.6: 结构存在但有明显错误或遗漏
  - 0.0-0.3: 未完成或严重偏离要求

reference_solution: |
  1. 创建 /workspace/data/rules/arena_tcg/rule.json，包含：
     - card_types: [hero, equipment, strategy, skill, monster]，hero 分 tier1/2/3
     - zones: {front(max 1), back, deck(30), monster_deck(10), summoner_skill(1), discard, hand(max 7)}
     - deck_building: 5 heroes 各取 1 阶不计入 30 张，主卡组 30 张(2/3 阶+谋略+装备，同名≤4)，野怪 10 张(同名≤4)，1 召唤师技能
     - cost_system: {initial: 0, per_turn_increment: 1, max: 10, refill_on_turn_start: true}
     - turn_phases: [draw, revive, swift, active, strategy, equip, upgrade, replace, retreat, end_turn]
     - hero_card_fields: [name, card_art, hp, retreat_cost, defeat_cost, revive_cost, effects{swift,active,upgrade_replace}, tags, tier]
     - defeat_victory: HP→0→defeat_cost(discard from deck)→dead state→swap if front→opponent draws monster→deck_out or all_dead = lose
  2. 创建 6+ 张卡牌 JSON 文件
  3. 创建 /workspace/skills/arena_tcg_card_import.md SOP

primary_dimensions: [completion, robustness, communication]
