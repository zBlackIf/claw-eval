prompt:
  text: |
    我已经把原始项目素材放在容器的 `/workspace/fixtures/` 目录下，请把这些文件当作只读输入。

    输入文件如下（右侧是它在原项目中的相对路径）：
    - `/workspace/fixtures/data/rules/arena_tcg/rule_template.json` -> `data/rules/arena_tcg/rule_template.json`
    - `/workspace/fixtures/data/rules/arena_tcg/cards/sample_hero.json` -> `data/rules/arena_tcg/cards/sample_hero.json`

    请基于这些输入完成下面的原始需求：

    我要为一个 TCG 引擎创建新的游戏规则。游戏名为"Arena TCG"。请严格按照我描述的规则进行，不要添加任何额外内容。如果有不明确的细节，请向我询问。

    规则如下：

    1. **卡牌类型**：5种 -- 英雄牌(hero)、装备牌(equipment)、谋略牌(strategy)、技能牌(skill)、野怪牌(monster)。英雄牌分为 1阶(tier1)、2阶(tier2)、3阶(tier3)。

    2. **场面结构**：每位玩家拥有：前场(front, 至多1名英雄)、后场(back, 其余英雄)、主卡组(deck, 30张)、野怪卡组(monster_deck, 10张)、技能(summoner_skill, 1张)、弃牌堆(discard)、手牌(hand, 上限7张)。前后场合计始终5名英雄。

    3. **卡组构筑**：选定5名英雄，各取1阶卡一张(不计入30张)；主卡组由该5名英雄的2/3阶卡+谋略牌+装备牌组成(30张，同名卡至多4张)；野怪卡组10张(同名至多4张)；1张召唤师技能。

    4. **费用系统**：初始0，每回合上限+1(上限10)，回合开始回满。

    5. **回合操作**(按顺序声明)：
       - 回合开始：抽1张牌，然后可决定复归已死亡英雄(支付复归代价)
       - 迅捷(swift)：一回合一次，使用一个英雄的迅捷效果
       - 主动(active)：一回合一次，使用一个英雄的主动效果，立即结束回合
       - 谋略(strategy)：一回合任意次，使用手牌中的谋略牌
       - 装备(equip)：一回合任意次，给英雄装备(旧装备进弃牌堆)
       - 升级(upgrade)：一回合任意次，将英雄从N阶升到N+1阶(不可跳阶)
       - 替换(replace)：一回合任意次，3阶英雄替换为手中另一张同名3阶卡
       - 撤退(retreat)：支付撤退代价，前场英雄与后场英雄交换，恢复血量
       - 结束回合

    6. **英雄卡要素**：name, card_art, hp, retreat_cost, defeat_cost, revive_cost, effects(分为swift/active/upgrade_replace三类), tags, tier

    7. **击败与胜负**：英雄HP归零则被击败 -> 支付击败代价(从卡组顶部弃N张) -> 死亡英雄留在场上(死亡状态) -> 若在前场须与后场存活英雄交换 -> 对手翻野怪牌结算奖励。卡组耗尽或全部英雄死亡则输。

    请完成以下任务：
    1. 在 `data/rules/arena_tcg/rule.json` 中写入完整的游戏规则定义(JSON格式)
    2. 创建至少6张卡牌JSON文件在 `data/rules/arena_tcg/cards/` 目录下(至少包含：2张英雄牌不同阶、1张装备牌、1张谋略牌、1张技能牌、1张野怪牌)
    3. 创建 `skills/arena_tcg_card_import.md` 描述从卡图提取卡牌信息的标准操作流程
    4. 所有卡牌JSON必须包含上述英雄卡的全部9个要素(非英雄卡不适用的字段留null)

    交付要求：
    - 需要修改已有文件时，请把修改后的版本写到 `/workspace/` 下对应的原项目相对路径。
    - 需要新增文件时，请按需求中的文件名或上面列出的目标路径写到 `/workspace/` 下。
    - 最终回复只需概述完成情况、关键改动和生成的文件；不要只在最终回复中贴代码或报告正文。
