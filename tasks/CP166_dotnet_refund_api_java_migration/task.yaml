judge_rubric: "Reward complete dotnet-to-Java migration: controller with /financial-system-refund endpoint (POST, @RequestBody), DTO with orderCode/refundAmount/orderType/refundReason/operatorName fields, service interface method, service impl with order-type branching (AppointmentOrder→汇付 refundPartially, ShopOrder→微信 WeChatRefund), status update after success, RPC client @PostExchange, fallback factory method. Route must use kebab-case matching frontend API convention."

reference_solution: |
  1. Controller: @PostMapping("/financial-system-refund") in HospitalTenPayController
  2. DTO: FinancialSystemRefundReq with orderCode, refundAmount (Long, nullable),
     orderType (enum/String), refundReason, operatorName
  3. Service interface: Result financialSystemRefund(FinancialSystemRefundReq req)
  4. Service impl:
     - if orderType == AppointmentOrder → call rpcClient.refundPartially(...)
     - if orderType == ShopOrder → call rpcClient.weChatRefund(...)
     - on success → update order status to Refunded
     - on failure → throw BusinessException
  5. RPC client: @PostExchange("/api/gw/hospital-ten-pay/financial-system-refund")
  6. Fallback factory: return Result.fail(...) for financialSystemRefund

primary_dimensions: [completion, communication, safety]
