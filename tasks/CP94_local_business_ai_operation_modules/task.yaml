source_description: "PinchBench top100 rank 64（std_trim 0.354）。Workspace WS2 大型代码补全：3 个核心引擎 + 测试。verifier 9 个隐藏锚点（3 引擎文件 + 子模块集成 + 投流人工审核 + 无自动扣费 + 测试 + async）。"

services: []

prompt:
  text: |
    /workspace/fixtures/ 下是 local-business-ai 项目骨架（main.py + core/
    score_engine / rank_chase / promotion 三大子模块）。把最后这三个核心
    模块的 engine.py 补全 + 配套测试，全行业通用、合规运营、不自动扣费。
    产物到 /workspace/。
  language: zh

tools: []
tool_endpoints: []

sandbox_files:
  - fixtures/main.py
  - fixtures/core/score_engine/diagnoser.py
  - fixtures/core/score_engine/industry_adapter.py
  - fixtures/core/rank_chase/diagnoser.py
  - fixtures/core/rank_chase/industry_adapter.py
  - fixtures/core/promotion/flow_strategy.py
  - fixtures/core/promotion/material_optimizer.py

