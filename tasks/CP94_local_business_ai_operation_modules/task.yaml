env_snapshot_commands:
  - python /workspace/fixtures/verify_biz_modules.py

env_snapshot_files:
  - /workspace/core/score_engine/engine.py
  - /workspace/core/rank_chase/engine.py
  - /workspace/core/promotion/engine.py

environment:
  timeout_seconds: 900
  max_turns: 22
