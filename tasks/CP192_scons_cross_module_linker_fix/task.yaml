prompt:
  text: |
    我在构建一个嵌入式 Modem 固件项目（SCons 构建系统），编译报错：

    ```
    libfibo_qmi_svc.a(qmi_fibo_svc.o): undefined reference to `fs_set_sync_timer'
    ```

    项目在 /workspace/fixtures/modem_project/，构建日志见 build_error.log。

    `fs_set_sync_timer` 定义在 core/storage/efs/src/fs_rmts_pm.c，声明在
    core/storage/efs/inc/fs_rmts_pm.h。OEM 模块 oem/fibo_qmi/ 需要调用这个
    函数来在进入低功耗前触发 FS sync。

    请帮我修复构建配置，让项目能正确编译链接。注意：
    1. 不要把 fs_rmts_pm.c 复制到 OEM 目录（应该由 efs 模块自己编译）
    2. 保持模块间的正确依赖关系
    3. 修改完后确保 `make all` 能成功
