judge_rubric: "Reward correct identification and fix of the detectImage memory copy bug. The main issue is that detectImage only copies 384 rows of NV12 data to the middle of the input buffer (mimicking VPSS path), but the source is already a full 640x640 NV12 frame from OpenCV. Fix should either: (A) copy the full YOLO_MODEL_INPUT_SIZE buffer without offset, or (B) properly offset the source address and ensure borders are pre-initialized. Secondary: fix TXT export clamping inconsistency (clamp all or none). Must not regress the preprocess() video path."

reference_solution: |
  Primary fix in yolo_detector_acl.cpp detectImage():
  - Replace partial copy (dest offset + wrong source) with full buffer copy:
    std::memcpy(input_buffer_, nv12_640x640, YOLO_MODEL_INPUT_SIZE);
  - This copies the complete 640x640 NV12 including OpenCV-filled black borders.
  - No need for separate border initialization since OpenCV already padded them.

  Secondary fix in json_exporter.cpp saveDetectionResultToTxt():
  - Either clamp all 4 values (center_x, center_y, norm_w, norm_h) consistently
  - Or remove clamping entirely (let upstream handle out-of-bounds filtering)

  Do NOT modify preprocess() — it correctly handles VPSS 640x384 input.

primary_dimensions: [completion, communication, safety]
