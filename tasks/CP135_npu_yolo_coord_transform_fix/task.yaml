source_description: "Real user session: NPU YOLO detection pipeline on embedded device (Ascend 310). The detectImage function for single-image inference incorrectly mimics the VPSS video path by only copying middle 384 rows to the NPU buffer, leaving top/bottom border regions as garbage data. This causes detection coordinates to be inconsistent with the visualizer path (preprocess+detect). Additionally, the TXT export applies clamping only to center coordinates but not to width/height, causing geometric distortion for edge-case boxes."

