    坐标总是偏小偏低。代码在 /workspace/fixtures/video_pipeline/ 里。

    请分析 detectImage 函数的内存拷贝逻辑，找出为什么它和 preprocess+detect 路径
    产生不同的推理结果，然后修复。同时检查 json_exporter.cpp 的 TXT 导出是否有
    一致性问题。
