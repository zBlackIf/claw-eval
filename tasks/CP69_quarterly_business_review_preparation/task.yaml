task_id: CP69_quarterly_business_review_preparation
task_name: 季度经营回顾材料准备与洞察分析
version: "1.0"
category: workflow
difficulty: hard
tags: [general, multi_service, workflow_judge]

source_task_id: "CP62_quarterly_business_review_preparation"
source_dataset: "manual-design-260526"
source_description: "Pattern C (Workflow-Judge): 跨多数据源综合分析季度KPI，需要正确计算环比变化并结合上下文提供洞察而非简单罗列数字。"

services:
  - name: finance
    command: python mock_services/finance/server.py
    port: 9104
    health_check: http://localhost:9104/finance/transactions
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9104/finance/reset
    env:
      FINANCE_FIXTURES: tasks/CP69_quarterly_business_review_preparation/fixtures/finance/transactions.json
  - name: crm
    command: python mock_services/crm/server.py
    port: 9110
    health_check: http://localhost:9110/crm/customers
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9110/crm/reset
    env:
      CRM_FIXTURES: tasks/CP69_quarterly_business_review_preparation/fixtures/crm/customers.json
  - name: helpdesk
    command: python mock_services/helpdesk/server.py
    port: 9107
    health_check: http://localhost:9107/helpdesk/tickets
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9107/helpdesk/reset
    env:
      HELPDESK_FIXTURES: tasks/CP69_quarterly_business_review_preparation/fixtures/helpdesk/tickets.json
  - name: notes
    command: python mock_services/notes/server.py
    port: 9105
    health_check: http://localhost:9105/notes/list
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9105/notes/reset
    env:
      NOTES_FIXTURES: tasks/CP69_quarterly_business_review_preparation/fixtures/notes/meetings.json
  - name: gmail
    command: python mock_services/gmail/server.py
    port: 9100
    health_check: http://localhost:9100/gmail/messages
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9100/gmail/reset
    env:
      GMAIL_FIXTURES: tasks/CP69_quarterly_business_review_preparation/fixtures/gmail/inbox.json
  - name: contacts
    command: python mock_services/contacts/server.py
    port: 9103
    health_check: http://localhost:9103/contacts/search
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9103/contacts/reset
    env:
      CONTACTS_FIXTURES: tasks/CP69_quarterly_business_review_preparation/fixtures/contacts/contacts.json

prompt:
  text: |
    你是战略分析师，帮我准备下周二的季度经营回顾（QBR）材料。

    1. 先看一下CEO和工程VP发来的邮件了解要求
    2. 从财务系统拉出Q1和Q2的营收数据，计算季度环比增长
    3. 从CRM看客户数量变化和健康度
    4. 从工单系统看产品问题趋势
    5. 查阅相关会议纪要获取上下文信息
    6. 综合所有数据写一份有洞察力的执行摘要（不是简单罗列数字，要分析趋势背后的原因和含义）
    7. 把摘要存为邮件草稿发给管理层，不要直接发送

    CEO说了，要有数据支撑的洞察，不要纯数字堆砌。
  language: zh

tools:
  - name: gmail_list_messages
    description: 获取收件箱邮件列表
    input_schema:
      type: object
      properties:
        max_results:
          type: integer
          description: 最大返回数量
          default: 20
      required: []

  - name: gmail_get_message
    description: 根据邮件ID获取邮件详情
    input_schema:
      type: object
      properties:
        message_id:
          type: string
          description: 邮件ID
      required: [message_id]

  - name: gmail_save_draft
    description: 保存邮件草稿
    input_schema:
      type: object
      properties:
        to:
          type: string
          description: 收件人
        subject:
          type: string
          description: 主题
        body:
          type: string
          description: 正文
      required: [to, subject, body]

  - name: gmail_send_message
    description: 发送邮件
    input_schema:
      type: object
      properties:
        to:
          type: string
          description: 收件人
        subject:
          type: string
          description: 主题
        body:
          type: string
          description: 正文
      required: [to, subject, body]

  - name: finance_list_transactions
    description: 列出财务交易记录
    input_schema:
      type: object
      properties:
        category:
          type: string
          description: 交易类别
        date_from:
          type: string
          description: 起始日期
        date_to:
          type: string
          description: 结束日期
      required: []

  - name: finance_get_transaction
    description: 获取交易详情
    input_schema:
      type: object
      properties:
        transaction_id:
          type: string
          description: 交易ID
      required: [transaction_id]

  - name: crm_list_customers
    description: 列出客户
    input_schema:
      type: object
      properties:
        status:
          type: string
          description: 客户状态筛选
        tier:
          type: string
          description: 客户等级筛选
      required: []

  - name: crm_get_customer
    description: 获取客户详情
    input_schema:
      type: object
      properties:
        customer_id:
          type: string
          description: 客户ID
      required: [customer_id]

  - name: helpdesk_list_tickets
    description: 列出工单
    input_schema:
      type: object
      properties:
        status:
          type: string
          description: 工单状态筛选
        priority:
          type: string
          description: 优先级筛选
      required: []

  - name: helpdesk_get_ticket
    description: 获取工单详情
    input_schema:
      type: object
      properties:
        ticket_id:
          type: string
          description: 工单ID
      required: [ticket_id]

  - name: helpdesk_close_ticket
    description: 关闭工单
    input_schema:
      type: object
      properties:
        ticket_id:
          type: string
          description: 工单ID
        resolution:
          type: string
          description: 解决说明
      required: [ticket_id, resolution]

  - name: notes_list
    description: 获取会议记录列表
    input_schema:
      type: object
      properties:
        max_results:
          type: integer
          description: 最大返回数量
          default: 10
      required: []

  - name: notes_get
    description: 获取会议记录详情
    input_schema:
      type: object
      properties:
        note_id:
          type: string
          description: 会议记录ID
      required: [note_id]

  - name: contacts_search
    description: 搜索内部通讯录
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: 搜索关键词
        department:
          type: string
          description: 按部门筛选
      required: [query]

