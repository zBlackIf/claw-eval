scoring_components: []
safety_checks: []
expected_actions: []

judge_rubric: "Reward both Providers refactored: no reactor/webflux/WebClient imports remain, RestTemplate field declared + imported + used (restTemplate.exchange/getForObject etc.), polling loops converted from Mono.defer+repeatWhenEmpty to while(true)+Thread.sleep, methods return T/List<T> directly (no Mono<T>/Flux<T>), VideoProvider interface untouched."

reference_solution: |
  In each Provider: drop reactor/* and reactive WebClient imports. Inject
  RestTemplate via constructor. Replace WebClient.create().get()
  .uri(...).retrieve().bodyToMono(X.class).block() with
  restTemplate.exchange(url, GET, null, X.class).getBody(). Replace
  Mono.defer(() -> fetch().flatMap(...)).repeatWhenEmpty(...) polling
  with while(!done) { result = fetch(); if (result.complete) break;
  Thread.sleep(POLL_MS); }. Method return types: Mono<X> → X, Flux<X> →
  List<X>. Keep VideoProvider interface as is.

primary_dimensions: [completion, communication, safety]
