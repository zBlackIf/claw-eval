source_description: "PinchBench top100 rank 68（std_trim 0.345）。Workspace WS2 大型重构：两个 Provider 从 WebFlux 反应式 API 改成 WebMVC 同步 API。verifier 8 个隐藏锚点（无 reactor 引用 / RestTemplate 字段+导入+用法 / 无 WebClient / while+Thread.sleep 轮询替换 Mono.defer+repeatWhenEmpty / 接口不动）。"

