services: []

prompt:
  text: |
    AiClone 频道管理模块要重构。/workspace/fixtures/src/ 下：

    1. `ChannelMapInstaller::convertToVendorChannel` 现在用输出参数返回结果
       （ErrorCode + VendorChannel*），照着 `ChannelMapBuilder` 里的
       `convertVendorChannelToBaseChannel` 那种写法改成 unique_ptr 返回值，
       错误走异常或 optional。
    2. `VendorChannelAdapter` 基类加一个新接口 `addDirectTuneChannel(VendorChannel)
       → ErrorCode`，NVT 和 MTK 两个子类都得实现。

    所有调用点和头文件都要同步改。修改后的代码写到 /workspace/src/（保持
    原目录结构）。
