judge_rubric: "Reward fixes to all 5 issues: (1) selectActivityList mobile filters status!=2 (mapper xml or service impl), (2) register userId from UserInfo/SecurityUtils (NOT dto.getUserId), (3) checkRegister endpoint added returning status codes 0/1/2 (满员/已关闭/已报名), (4) detail endpoint added with isRegistered + registration info, (5) contactPhone AES decrypted before returning to mobile."

reference_solution: |
  Mapper XML: add WHERE status != 2 (or expired check via NOW() > end_time)
  to selectActivityList mobile path. Service impl: register() reads
  UserInfo via SecurityUtils.getLoginUser(), not dto.getUserId(). Controller:
  add @PostMapping /checkRegister with switch returning 0/1/2; @GetMapping
  /detail returning Activity + isRegistered + registrationInfo. Service:
  before returning Activity, decrypt contactPhone via AESUtils.decrypt(...)
  or equivalent.

primary_dimensions: [completion, communication, safety]
