judge_rubric: "Reward correct tokenization fix: English words kept as single tokens (not char-by-char), connectors (/, -, ') between letters merge into the word unit, CJK chars still split individually with width 2, semantic newlines preserved, output lines respect width limit. Key hidden checks: VOR/DME as single token, don't as single token, co-ordinate as single token, available not split."

reference_solution: |
  Fix tokenize() alpha branch to:
  1. When encountering a letter, collect all consecutive letters
  2. After collecting letters, peek at next char: if it's a connector (-, ', /)
     AND the char after that is also a letter, include connector and continue
     collecting the next word segment
  3. This produces tokens like "VOR/DME", "don't", "co-ordinate", "available"
  4. Numbers and CJK remain unchanged
  Example implementation:
    elif ch.isalpha():
        j = i
        while j < len(text):
            # collect consecutive letters
            while j < len(text) and text[j].isalpha():
                j += 1
            # check for connector followed by letter
            if j < len(text) - 1 and text[j] in "-'/" and text[j+1].isalpha():
                j += 1  # include connector
            else:
                break
        tokens.append(text[i:j])
        i = j

