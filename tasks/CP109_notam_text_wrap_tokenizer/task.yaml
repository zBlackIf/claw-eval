    2. 与字母紧邻的连接符（如 - ' /）也要合并进去（如 VOR/DME、don't、co-ordinate）
    3. 保留已有的 CJK 单字符分词、数字分词、换行保留等逻辑不变
    4. wrap_lines() 的换行算法不需要改，只修 tokenize() 即可

    修好后确保代码可运行且通过基本自测。
