    弱网下 UI 直接卡死；还有 ScreenCaptureCallback 等 API 34 方法在低版本直接 NoSuchMethodError。
    代码在 /workspace/fixtures/hyperisle-app/，你把这些问题都修了——能在 API 28 上正常跑就行。
