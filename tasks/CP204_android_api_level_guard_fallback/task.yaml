judge_rubric: "Reward comprehensive Android 9 compatibility fixes: (1) Build.VERSION.SDK_INT >= 34 guard around FOREGROUND_SERVICE_TYPE_SPECIAL_USE with plain startForeground fallback, (2) lateinit var replaced with default fallback (FallbackVersionEnforcer pattern), (3) EncryptedSharedPreferences wrapped in try-catch with KeyStore cleanup retry and plain SharedPreferences fallback, (4) withTimeout on Firebase version check with cache/Allowed fallback, (5) API 34 guards on ScreenCaptureCallback usage with early return/finish, (6) Huawei-specific overlay permission intent chain."

reference_solution: |
  1. OverlayForegroundController: Add if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE)
     before startForeground with FOREGROUND_SERVICE_TYPE_SPECIAL_USE; else call plain startForeground(id, notification).
  2. HyperIsleApp: Replace lateinit var versionEnforcer with default FallbackVersionEnforcer() that
     returns VersionStatus.Allowed. Same pattern for featureFlagRepository, premiumGate, premiumStatusRepository.
  3. createEncryptedPrefs(): Try EncryptedSharedPreferences, on exception delete KeyStore entry and retry,
     on second failure fall back to getSharedPreferences() and log warning.
  4. VersionEnforcerImpl.checkVersion(): Wrap fetchMinimumVersion() in withTimeout(10_000L),
     catch TimeoutCancellationException, use cache.getMinimumVersion() or return Allowed.
  5. ScreenCaptureDetectorActivity: Check SDK_INT >= 34 in onCreate, finish() immediately if below.
     OverlayScreenRecordingController: Same guard around registerScreenCaptureCallback.
  6. OverlayPermissionChecker: Try Huawei SystemManager intent first, resolveActivity check,
     fall back to standard ACTION_MANAGE_OVERLAY_PERMISSION, then ACTION_SETTINGS.

