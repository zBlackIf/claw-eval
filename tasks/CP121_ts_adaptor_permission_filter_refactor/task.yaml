judge_rubric: "Reward correct implementation of permission-based filtering in the adaptor: (1) btnPermission imported from common, (2) conditional filtering using btnPermission(permissFeild) check, (3) list filtered by pic_type !== 'A10' when permission denied, (4) permissFeild made optional, (5) viewImagesDialog updated to accept and forward permissFeild, (6) settlement panel caller passes 'viewCustomerSettleInfo', (7) general panel does not pass permission (preserves original behavior)."

reference_solution: |
  In viewImagesDialog.ts:
  - Add: import { btnPermission } from 'src/assets/js/common'
  - Make permissFeild optional: (payload, response, permissFeild?) =>
  - Add filtering logic:
      let filterList = newList
      if (permissFeild && !btnPermission(permissFeild)) {
        filterList = newList.filter(item => item.pic_type !== 'A10')
      }
  - Return filterList instead of newList in the data
  - Update viewImagesDialog signature: (url, params, title = '', permissFeild = '')
  - Update adaptor in viewImagesDialog: adaptor: payload => imagesQueryAdaptor(payload, null, permissFeild)

  In detail.ts:
  - Settlement panel adaptor: payload => imagesQueryAdaptor(payload, null, 'viewCustomerSettleInfo')
  - General panel adaptor: unchanged (no permission field)

