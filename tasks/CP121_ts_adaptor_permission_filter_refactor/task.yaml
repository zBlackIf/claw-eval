services: []

prompt:
  text: |
    The file `/workspace/fixtures/emp-app/src/pages/merchInfo/merchInfoSearch/components/viewImagesDialog.ts`
    has a function `imagesQueryAdaptor(payload, response, permissFeild)` that currently ignores
    the `permissFeild` parameter. I need you to:

    1. Import `btnPermission` from `src/assets/js/common` in this file.
    2. Make `permissFeild` optional. When it is provided and the user does NOT have that
       permission (i.e., `btnPermission(permissFeild)` returns false), filter out items
       whose `pic_type === 'A10'` from the result list.
    3. Update `viewImagesDialog` to accept an optional `permissFeild` parameter and pass it
       through to `imagesQueryAdaptor` in the adaptor callback.
    4. In the caller file `basicInfo/detail.ts`, the settlement panel's adaptor should
       pass `'viewCustomerSettleInfo'` as the permission field, while the general panel
       should NOT apply any permission filtering (keep existing behavior).

    All files are under `/workspace/fixtures/emp-app/`.
  language: en

