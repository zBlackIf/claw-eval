# This docker-compose file sets up the dev environment.
# It builds an app container based on Dockerfile.chemotion.dev
#
# USAGE:
# - Run development environment:
#     docker-compose -f docker-compose.dev.yml up postgres app webpacker
# - Run with logs:
#     docker-compose -f docker-compose.dev.yml up postgres app webpacker 2>&1 | tee dev.log

version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile.chemotion-dev
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres/chemotion
      RAILS_ENV: development
    volumes:
      - .:/app:cached

  webpacker:
    build:
      context: .
      dockerfile: Dockerfile.chemotion-dev
    command: bin/webpack-dev-server
    ports:
      - "3035:3035"
    volumes:
      - .:/app:cached

volumes:
  pgdata:
