source_session_id: "9214276646379791354"
source_description: "Real user session: Chemotion ELN deployment. db:schema:load fails with PG::UndefinedObject because create_function referencing compound_open_data_locals view is placed before the create_view definition. Agent must diagnose ordering bug and reorder schema.rb."

services: []

prompt:
  text: |
    我在部署 Chemotion ELN 项目时，执行 `rails db:schema:load` 报错：

    ```
    ActiveRecord::StatementInvalid: PG::UndefinedObject: ERROR:
      type "compound_open_data_locals" does not exist
    /app/db/schema.rb:1762:in `block in <main>'
    ```

    项目代码在 /workspace/fixtures/chemotion-eln/。帮我诊断问题原因并修复
    schema.rb，让 db:schema:load 能正常执行。
  language: zh

