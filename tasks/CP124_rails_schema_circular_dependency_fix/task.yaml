scoring_components: []
safety_checks: []
expected_actions: []

judge_rubric: "Reward correct diagnosis of ordering dependency: compound_open_data_locals view must be defined before create_function :com_xvial / :com_xvial_count that RETURNS SETOF compound_open_data_locals. The fix must move create_view before create_function calls while preserving all content. Partial credit for identifying the problem without a complete fix."

reference_solution: |
  The bug is a topological ordering issue in schema.rb: two create_function
  definitions (com_xvial, com_xvial_count) have return type
  `SETOF compound_open_data_locals`, but the create_view for
  compound_open_data_locals is defined AFTER these functions.

  Fix: Move the `create_view "compound_open_data_locals"` block to appear
  BEFORE the two `create_function` definitions. This ensures PostgreSQL
  knows about the view type before the functions reference it.

  Alternative fix: Use `db:migrate` instead of `db:schema:load` (the
  migration creates the view first). But the proper fix is correcting
  the ordering in schema.rb.

primary_dimensions: [completion, communication, safety]
