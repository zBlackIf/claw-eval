task_id: T167_zh_kagi_chart_d3v7_quant_analysis
task_name: "Kagi 图技术分析可视化（D3.js v7 + 多日行情数据）"
version: "1.0"
category: end_to_end
difficulty: hard
tags: [general]

services:
  - name: web_real
    command: python mock_services/web_real/server.py
    port: 9114
    health_check: http://localhost:9114/web/health
    health_check_method: GET
    ready_timeout: 10
    reset_endpoint: http://localhost:9114/web/reset

prompt:
  text: |
    我在做一个量化投资的技术分析工具，需要你帮我实现一个 Kagi 图（カギ足）的分析页面。

    背景：我最近在研究上证综指的短期趋势。K 线图噪音太多，我想用 Kagi 图来过滤短期波动，
    只关注有意义的趋势反转信号。Kagi 是日本的一种技术分析图表，不按时间等距排列，
    只在价格反转超过阈值时才画新线。我之前没实现过 Kagi，你帮我搜一下算法。

    数据和参数：
    1. 使用上证综指（SSE Composite）最近 5 个交易日的收盘价。
       今天是 2026-05-20，请搜索获取 5 月 14 日到 5 月 20 日期间的交易日收盘数据。
       注意中间可能有非交易日要跳过。

    2. 反转阈值（reversal amount）= 收盘价序列中最大值与最小值之差 的 50%。
       拿到数据后算出来，写在代码注释里。

    技术要求：
    3. 用 D3.js v7 画图。我们组统一用 v7，注意 v7 跟 v5/v6 有些 API 变化
      （比如 d3.event 移除了，要用 event 参数）。如果不确定请搜索确认。

    4. 图表要素：
       - 上升趋势粗线（阳线，绿色 #26A69A）
       - 下降趋势细线（阴线，红色 #EF5350）
       - 反转点标注日期和价格
       - X 轴不等距（Kagi 核心特征）
       - 标注反转阈值

    5. 趋势分析面板（图表下方）：
       这是最重要的产出——不只是画图，要给出可操作的分析结论：
       - 当前趋势状态：阳线（上升）还是阴线（下降）？
       - 最近一次反转发生在哪天？反转方向是什么？
       - 当前价格距离下一次可能反转还差多少点？
       - 一句话趋势判断："短期看多/看空/震荡，理由是..."

    6. 输出单个 .html 文件，底部标注：数据来源、日期范围、反转阈值计算过程、免责声明。

    我要的是一个能帮我做决策的工具页面，不只是一张好看的图。

  language: zh

