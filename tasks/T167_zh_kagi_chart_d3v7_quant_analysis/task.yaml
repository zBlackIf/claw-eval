judge_rubric: |
  评估 agent 完成 Kagi 图技术分析工具页面的质量。

  场景价值：量化投资者（CP 用户 15.6%）的日常决策工具。
  不只是画一张图——要提供趋势判断和操作建议，帮用户做投资决策。
  完成后可作为每日技术分析的参考工具。

  评分维度：

  D1. Kagi 图算法正确性 (权重 25%)
      Kagi 图的核心规则：
      - 初始方向由前两个数据点决定
      - 价格沿当前方向继续 → 延长当前线段
      - 价格反向超过"反转阈值" → 画新列，改变方向
      - 阳线/阴线区分
      - X 轴不等距（只在反转时产生新列）
      评分标准：
      - 1.0: 算法正确（反转判定 + 方向切换 + 非等距X轴）
      - 0.5: 部分正确但有关键错误
      - 0.0: 不是 Kagi 图

  D2. 历史数据获取正确性 (权重 25%)
      5 个交易日收盘价：
      - 05-14: 4177.92 | 05-15: 4135.39 | 05-18: 4131.53
      - 05-19: 4169.54 | 05-20: 4162.18
      反转阈值 = (4177.92 − 4131.53) × 50% = 23.20（±1）
      评分标准：
      - 1.0: 5 日数据全对 + 阈值计算正确
      - 0.7: 4 日正确 + 阈值接近
      - 0.4: 3 日正确
      - 0.0: 数据大部分错误

  D3. 趋势分析面板（核心价值产出）(权重 30%)
      基于正确数据和算法，应得出的分析结论：
      - 当前趋势: 阳线（从 4131.53 反转上行至 4169.54）
      - 最近反转: 05-18→05-19，从阴线转阳线（涨幅 38.01 > 阈值 23.20）
      - 距离下次反转: 当前最高 4169.54，反转需跌破 4169.54−23.20=4146.34
        当前收盘 4162.18 距离反转点还差 4162.18−4146.34=15.84 点
      - 趋势判断: 短期偏多（刚完成阴→阳反转，但最新收盘微跌需关注）
      评分标准：
      - 1.0: 趋势方向正确 + 反转点识别正确 + 给出可操作建议
      - 0.7: 趋势方向正确但细节有误
      - 0.3: 有分析面板但结论错误
      - 0.0: 无分析面板或纯图表无结论

  D4. D3.js v7 与页面可用性 (权重 20%)
      - D3 v7 正确使用（无 d3.event 反模式）
      - SVG 图表渲染
      - 阳线/阴线颜色区分
      - 底部标注 + 免责声明
      评分标准：
      - 1.0: 全部正确
      - 0.5: 部分正确
      - 0.0: 页面无法运行

  最终评分 = 0.25*D1 + 0.25*D2 + 0.30*D3 + 0.20*D4

reference_solution: |
  此任务需要 3 类搜索 + 多步数据计算：

  搜索1: Kagi 图绘制算法
    - web_search("Kagi chart drawing algorithm rules reversal")
    - web_search("カギ足 描画ルール" 或 "Kagi chart explained")
    → 理解核心规则：反转阈值、方向切换、非等距X轴
    → 关键：不是折线图！只在反转时产生新的 X 列

  搜索2: 上证综指近 5 个交易日收盘价
    - web_search("2026年5月 上证综指 历史数据 收盘价")
    - web_fetch(Yahoo Finance 或 东方财富历史行情页)
    → 必须识别交易日 vs 非交易日（跳过周末）
    → 正确数据: [4177.92, 4135.39, 4131.53, 4169.54, 4162.18]
    → 对应日期: [05-14, 05-15, 05-18, 05-19, 05-20]

  搜索3: D3.js v7 API（如不确定）
    - web_search("D3.js v7 migration changes from v6")
    → 关键变化: d3.event 移除, 用 event 参数; pointer() 替代 mouse()

  多步计算:
    - max(收盘价序列) = 4177.92
    - min(收盘价序列) = 4131.53
    - 区间 = 4177.92 - 4131.53 = 46.39
    - 反转阈值 = 46.39 × 50% = 23.20

  Kagi 图绘制过程（用上述数据 + 阈值 23.20）:
    - 起点: 4177.92
    - 4177.92 → 4135.39: 跌 42.53 > 23.20 → 反转，画阴线
    - 4135.39 → 4131.53: 继续跌 3.86 < 23.20 → 延长阴线
    - 4131.53 → 4169.54: 涨 38.01 > 23.20 → 反转，画阳线
    - 4169.54 → 4162.18: 跌 7.36 < 23.20 → 不反转（忽略）
    最终图形: 3 列（初始阴线 | 阳线 | 阳线末端停留）

  验证方法:
  - 5日收盘价精确匹配
  - 反转阈值 ≈ 23.20 (±1)
  - 图形应有非等距 X 轴（仅 2-3 列，不是 5 列等距）
  - D3 v7 反模式: 出现 d3.event 即扣分

primary_dimensions: [completion, robustness, communication]
