services: []
prompt:
  text: |
    我已经把原始项目素材放在容器的 `/workspace/fixtures/` 目录下，请把这些文件当作只读输入。

    输入文件如下（右侧是它在原项目中的相对路径）：
    - `/workspace/fixtures/src/api/request.js` -> `src/api/request.js`
    - `/workspace/fixtures/src/api/bills.js` -> `src/api/bills.js`
    - `/workspace/fixtures/src/api/members.js` -> `src/api/members.js`
    - `/workspace/fixtures/src/api/budgets.js` -> `src/api/budgets.js`
    - `/workspace/fixtures/src/pages/BillList.vue` -> `src/pages/BillList.vue`
    - `/workspace/fixtures/src/pages/MemberList.vue` -> `src/pages/MemberList.vue`

    请基于这些输入完成下面的原始需求：

    这个 Vue 金融管理后台的账单、成员、预算页面越写越重复，后续还要继续加模块。请先阅读现有代码，给出一份可执行的架构梳理和渐进式重构方案。
    要求：
    1. 逐一阅读所有源文件，理解项目结构和代码风格
    2. 分析 API 层、页面加载状态、错误处理、分页、类型约束和迁移风险中的重复模式
    3. 设计能兼容现有账单导出、成员权限等特殊接口的公共抽象
    4. 为核心抽象编写可复用示例代码
    5. 将分析结果写入 `REFACTOR_PLAN.md`，示例代码写入对应文件

    交付要求：
    - 需要修改已有文件时，请把修改后的版本写到 `/workspace/` 下对应的原项目相对路径。
    - 需要新增文件时，请按需求中的文件名或上面列出的目标路径写到 `/workspace/` 下。
    - 最终回复只需概述完成情况、关键改动和生成的文件；不要只在最终回复中贴代码或报告正文。
  language: zh
