judge_rubric: |
  ## Expected Behavior

  Agent 应该：
  1. 遍历读取所有 src/ 下的文件
  2. 识别 API 层的 CRUD 重复模式
  3. 识别页面组件的 loading/error/pagination 重复模式
  4. 创建 `src/api/createCrudApi.ts`（通用 CRUD 工厂）
  5. 创建 `src/composables/useListPage.ts`（通用列表页 Composable）
  6. 创建类型定义文件
  7. 生成完整的 REFACTOR_PLAN.md

  ## Grading Criteria

  - [ ] overall_v1_score

  ## LLM Judge Rubric


  ### Criterion 1: 代码理解深度
  Weight: 25%

  - 1.0 — Agent 是否真正理解了代码而非表面扫描？是否识别了深层次的架构问题（如 request.js 的 401 处理方式、exportBills 的 blob 下载模式）？
  - 0.75 — Mostly meets the criterion with minor gaps
  - 0.5 — Partially meets; missing key aspects
  - 0.25 — Minimal alignment
  - 0.0 — Does not meet the criterion

  ### Criterion 2: 模式识别能力
  Weight: 25%

  - 1.0 — 是否准确识别了所有重复模式？提出的抽象方案（CRUD factory、Composable）是否合理且不过度抽象？
  - 0.75 — Mostly meets the criterion with minor gaps
  - 0.5 — Partially meets; missing key aspects
  - 0.25 — Minimal alignment
  - 0.0 — Does not meet the criterion

  ### Criterion 3: 重构方案质量
  Weight: 30%

  - 1.0 — 示例代码是否可直接使用？API 工厂是否支持自定义扩展（如 bills 的 export、members 的 permissions）？useListPage 是否涵盖了 loading、error、pagination 全部关注点？
  - 0.75 — Mostly meets the criterion with minor gaps
  - 0.5 — Partially meets; missing key aspects
  - 0.25 — Minimal alignment
  - 0.0 — Does not meet the criterion

  ### Criterion 4: 计划可执行性
  Weight: 20%

  - 1.0 — 重构步骤是否有明确的优先级？是否考虑了向后兼容（渐进式迁移）？是否评估了风险和工作量？
  - 0.75 — Mostly meets the criterion with minor gaps
  - 0.5 — Partially meets; missing key aspects
  - 0.25 — Minimal alignment
  - 0.0 — Does not meet the criterion
