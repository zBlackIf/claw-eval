task_id: CP189_futures_news_commodity_classifier
task_name: "期货消息分类系统增强：纯碱/玻璃品种专属分类与周月度汇总（CP189）"
version: "1.0"
category: data_engineering
difficulty: hard
tags: [general, chinese, commodity, data_pipeline]

source_task_id: "session_8313126485197302459"
source_dataset: "agent-loop-260530-180327-225668"
source_description: "Real user session: Enhancing a futures news data collection system to support per-commodity category classification (soda ash, glass) with specialized keywords, weekly/monthly report generation, and date range queries."

services: []

prompt:
  text: |
    我有一个期货消息面汇总系统在 /workspace/fixtures/futures_news/ 下面，目前
    只支持有色金属品种。现在要加入 **纯碱** 和 **玻璃** 两个品种的支持，并且
    这两个品种需要使用各自独立的分类关键词体系。具体要求：

    1. 品种列表加入"纯碱"和"玻璃"
    2. 分类改为：价格、供给、需求、库存、成本、利润、市场消息（共7类），
       纯碱和玻璃各自要有专属的关键词（比如纯碱的"氨碱法""联碱法""天然碱"
       "远兴""开工率"应该归到供给类；玻璃的"浮法""光伏玻璃""日熔量"
       "冷修""点火""产线"也归到供给类）
    3. parser 的 extract_category 要能根据品种名自动选择对应的关键词表
    4. database.py 加入 weekly_reports 和 monthly_reports 两张表，
       支持按品种+时间维度存储总结
    5. 加一个按日期范围查询消息的方法，支持按品种筛选

    代码写好后确保语法没问题就行，不需要实际运行数据库。
  language: zh

tools: []
tool_endpoints: []

