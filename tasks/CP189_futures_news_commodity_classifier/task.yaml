env_snapshot_commands:
  - python /workspace/fixtures/verify_solution.py

environment:
  timeout_seconds: 600
  max_turns: 20
  env_snapshot_timeout: 30

scoring_components: []
safety_checks: []
expected_actions: []

judge_rubric: "Reward complete per-commodity classification system: (1) VARIETIES list includes 纯碱 and 玻璃, (2) dedicated category keyword mappings for each commodity (soda ash: 氨碱/联碱/天然碱/远兴/开工率 etc.; glass: 浮法/光伏玻璃/日熔量/冷修/点火/产线 etc.), (3) parser extract_category is variety-aware with conditional routing, (4) weekly_reports table with week_number+variety columns, (5) monthly_reports table with month+variety columns, (6) date range query method with variety filter, (7) new 7-category scheme (价格/供给/需求/库存/成本/利润/市场消息)."

reference_solution: |
  In config.py:
  - VARIETIES adds '纯碱', '玻璃'
  - New per-commodity category mappings: SODA_ASH_CATEGORY_KEYWORDS and
    GLASS_CATEGORY_KEYWORDS, each mapping 7 categories to domain-specific keywords
  - CATEGORY_ICONS updated to new 7-category scheme

  In parser.py:
  - extract_category(content, variety=None) signature
  - Conditional logic: if variety == "纯碱" use soda ash keywords,
    elif variety == "玻璃" use glass keywords, else use common mapping
  - parse_message passes variety to extract_category

  In database.py:
  - weekly_reports table: id, week_year, week_number, variety, content, created_at
  - monthly_reports table: id, year, month, variety, content, created_at
  - get_messages_by_date_range(start_date, end_date, variety=None) method
    using BETWEEN clause with optional variety filter
  - Default varieties list includes 纯碱 and 玻璃

primary_dimensions: [completion, communication, safety]
