services: []
prompt:
  text: |
    我已经把原始项目素材放在容器的 `/workspace/fixtures/` 目录下，请把这些文件当作只读输入。

    输入文件如下（右侧是它在原项目中的相对路径）：
    - `/workspace/fixtures/AGENTS.md` -> `AGENTS.md`
    - `/workspace/fixtures/workspace/TODO.md` -> `workspace/TODO.md`
    - `/workspace/fixtures/workspace/projectTest/todolist.md` -> `workspace/projectTest/todolist.md`
    - `/workspace/fixtures/memory/user_preferences.md` -> `memory/user_preferences.md`

    请基于这些输入完成下面的原始需求：

    我有一个 AI 测试运维项目（ai-tester-ops），使用结构化的测试流程。现在我想对 projectTest 项目启动测试流程。

    项目要求三级文件结构必须齐全才能开始：
    1. memory/user_preferences.md - 用户偏好
    2. workspace/TODO.md - 项目总清单
    3. workspace/projectTest/todolist.md - 项目进度

    请帮我检查当前状态，如果文件齐全就从当前未完成阶段开始执行测试流程。

    交付要求：
    - 需要修改已有文件时，请把修改后的版本写到 `/workspace/` 下对应的原项目相对路径。
    - 需要新增文件时，请按需求中的文件名或上面列出的目标路径写到 `/workspace/` 下。
    - 最终回复只需概述完成情况、关键改动和生成的文件；不要只在最终回复中贴代码或报告正文。
  language: zh
