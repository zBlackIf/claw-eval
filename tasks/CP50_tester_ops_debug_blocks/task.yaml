task_id: CP50_tester_ops_debug_blocks
task_name: Debug Test Workflow with KB Agent
version: "1.0"
category: debugging
difficulty: medium
tags: [general, single_turn, coding_plan]

source_task_id: "task_07_tester_ops_debug_blocks"
source_dataset: "taskset-260427-121234"
source_description: "从 PinchBench eval-260427-172048-209429 (10模型×99题) 中按跨模型标准差排名精选的高区分度任务，改编为 Claw-Eval Pattern D (sandbox-adapted) 格式。原始 prompt 保留，grader 基于 PinbenchAdaptedGrader 实现自动化评分。"

services: []

prompt:
  text: |
    <!-- CLAW-EVAL-FIXTURE-PREAMBLE -->
    以下文件已注入到容器内，请按给出的容器绝对路径读取（容器 WORKDIR = `/workspace`）：

    - `/workspace/fixtures/memory/user_preferences.md`
    - `/workspace/fixtures/workspace/TODO.md`
    - `/workspace/fixtures/workspace/projectTest/todolist.md`
    - `/workspace/fixtures/AGENTS.md`

    所有产物请落到 `/workspace/...` 下；评分仅捕获 `/workspace/` 内的文件。

    我有一个 AI 测试运维项目（ai-tester-ops），使用结构化的测试流程。现在我想对 projectTest 项目启动测试流程。

    项目要求三级文件结构必须齐全才能开始：
    1. memory/user_preferences.md - 用户偏好
    2. workspace/TODO.md - 项目总清单
    3. workspace/projectTest/todolist.md - 项目进度

    请帮我检查当前状态，如果文件齐全就从当前未完成阶段开始执行测试流程。

    参考 AGENTS.md 了解工作流定义和规则。
  language: zh

tools: []
tool_endpoints: []

sandbox_files:
  - fixtures/memory/user_preferences.md
  - fixtures/workspace/TODO.md
  - fixtures/workspace/projectTest/todolist.md
  - fixtures/AGENTS.md

sandbox_grader_files:
  - fixtures/verify.py

environment:
  timeout_seconds: 600
  max_turns: 30

  env_snapshot_timeout: 30

env_snapshot_commands:
  - python /workspace/fixtures/verify.py

env_snapshot_files:
  - /workspace/memory/user_preferences.md
  - /workspace/workspace/TODO.md
  - /workspace/workspace/projectTest/todolist.md
  - /workspace/workspace/projectTest/test_plan.md
  - /workspace/workspace/projectTest/phase3_test_plan.md
  - /workspace/workspace/projectTest/测试计划.md
scoring_components: []

safety_checks: []

expected_actions: []

judge_rubric: |
  评估 agent 是否正确执行了结构化测试工作流。
  - 前置检查：是否验证了三级文件结构全部存在
  - 状态解析：是否正确识别当前进度（Phase 2已完成，Phase 3待执行）
  - 恢复执行：是否从Phase 3（测试计划）开始而非从头开始
  - 进度更新：是否更新了todolist.md中的状态

reference_solution: |
  1. 检查三个文件是否存在：user_preferences.md ✓, TODO.md ✓, todolist.md ✓
  2. 读取 user_preferences.md：Zhang San, AT005988
  3. 读取 TODO.md：projectTest In Progress
  4. 读取 todolist.md：Phase 0-2 已完成 [x]，Phase 3-7 待执行 [ ]
  5. 参考 AGENTS.md 确认 Phase 3 = Test Plan (5W1H)
  6. 执行 Phase 3：生成测试计划
  7. 更新 todolist.md：标记 Phase 3 为 [x]

primary_dimensions: [completion, robustness, communication]
