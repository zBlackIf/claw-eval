judge_rubric: |
  ## Expected Behavior

  1. 检查三级文件是否都存在
  2. 读取 user_preferences.md 获取用户信息
  3. 读取 TODO.md 获取项目列表
  4. 读取 projectTest/todolist.md 获取当前进度
  5. 从当前未完成阶段开始执行
  6. 更新进度状态

  ## Grading Criteria

  - [ ] criterion_file_check: Checks all three required files before proceeding
  - [ ] criterion_read_prefs: Reads and uses user_preferences.md content
  - [ ] criterion_status_parse: Correctly parses current progress from todolist.md
  - [ ] criterion_resume: Resumes from the correct uncompleted phase
  - [ ] criterion_update: Updates status in todolist.md after work

  ## LLM Judge Rubric

  ### Criterion 1: Pre-flight Checks (Weight: 30%)
    - 1.0: Checks all three files exist in correct order, blocks if any missing
    - 0.75: Checks files but does not block on missing
    - 0.5: Checks some files
    - 0.25: Skips file checks
    - 0.0: Ignores file hierarchy requirement

  ### Criterion 2: State Management (Weight: 30%)
    - 1.0: Correctly reads progress state, identifies current phase, and resumes from correct point
    - 0.75: Reads state but minor phase identification error
    - 0.5: Partially reads state
    - 0.25: Ignores existing state
    - 0.0: Starts from scratch regardless of state

  ### Criterion 3: Workflow Execution (Weight: 25%)
    - 1.0: Executes exactly one phase with proper quality checks per the workflow definition
    - 0.75: Executes phase but skips quality checks
    - 0.5: Partial execution
    - 0.25: Wrong phase executed
    - 0.0: No execution attempted

  ### Criterion 4: Documentation Updates (Weight: 15%)
    - 1.0: Updates both todolist.md and TODO.md with correct status and timestamps
    - 0.75: Updates one file correctly
    - 0.5: Partial updates
    - 0.25: No updates
    - 0.0: Corrupts existing documentation
