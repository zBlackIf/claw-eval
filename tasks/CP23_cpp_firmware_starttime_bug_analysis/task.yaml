judge_rubric: |
  ## Expected Behavior

  1. Agent reads firmware_item.cpp, firmware_item.h, iclone_item.h, iclone_item.cpp
  2. Agent identifies: FirmwareItem::preExecuteItem overrides the base class but does NOT call the base class version (ICloneItem::preExecuteItem), which is where m_startTime and m_endTime lifecycle management normally happens
  3. Agent identifies the root cause: the derived class sets m_startTime inside an if-branch only, and does not follow the base class pattern of resetting times and managing the state machine
  4. Agent produces a fix that either calls the base class preExecuteItem or correctly replicates the time management logic
  5. Agent writes BUGFIX_REPORT.md with root cause, fix, and impact analysis

  **Hard red lines**:
  - Failing to identify that the base class preExecuteItem is not called -> root_cause_identified = 0
  - Not producing any modified firmware_item.cpp -> fix_applied = 0
  - Modifying the ICloneItem public interface -> interface_preserved = 0

  ## Grading Criteria

  - [ ] root_cause_identified: correctly identifies that FirmwareItem::preExecuteItem does not call base class
  - [ ] fix_applied: modified firmware_item.cpp exists with the fix
  - [ ] bugfix_report_present: BUGFIX_REPORT.md exists with root cause section
  - [ ] interface_preserved: iclone_item.h is not modified or public interface unchanged
  - [ ] impact_analysis_present: report discusses impact / side effects of the fix

  ## LLM Judge Rubric

  ### Criterion 1: Content Accuracy (Weight: 30%)
    - 1.0: All findings are factually correct, properly sourced from input data, no fabrications
    - 0.75: Mostly accurate with minor imprecisions
    - 0.5: Core findings correct but some inaccuracies
    - 0.25: Significant factual errors or unsupported claims
    - 0.0: Largely inaccurate or fabricated

  ### Criterion 2: Analytical Depth (Weight: 30%)
    - 1.0: Thorough analysis with meaningful insights, cross-references, and actionable conclusions
    - 0.75: Good analysis with some insights
    - 0.5: Basic analysis without deeper examination
    - 0.25: Superficial treatment of the topic
    - 0.0: No meaningful analysis

  ### Criterion 3: Structure and Formatting (Weight: 25%)
    - 1.0: Professional report structure, proper sections, tables, and visual organization
    - 0.75: Well-structured with minor formatting issues
    - 0.5: Readable but poorly organized
    - 0.25: Disorganized or hard to follow
    - 0.0: No coherent structure

  ### Criterion 4: Actionability (Weight: 15%)
    - 1.0: Clear recommendations with prioritization and implementation guidance
    - 0.75: Useful recommendations with minor gaps
    - 0.5: Some recommendations but lacking specificity
    - 0.25: Vague or impractical suggestions
    - 0.0: No actionable recommendations
