judge_rubric: "Reward correct alignment of SQL column names to actual DB schema: payment_order uses credits_to_add (not amount_credits), provider_trade_no (not trade_no); user_wallet uses balance_credits (not amount); wallet_ledger uses delta_credits (not change_credits), change_type + source_id (not order_id). Transaction safety and idempotency preserved."

reference_solution: |
  Fix SQL queries in two files:
  1. app/api/payment/confirm/route.ts:
     - SELECT: use credits_to_add instead of amount_credits
     - UPDATE: use provider_trade_no = $1 instead of trade_no = $1
     - Response: reference credits_to_add for credits_added field
  2. lib/server/wallet-service.ts:
     - addCreditsToWallet UPDATE: SET balance_credits = balance_credits + $1
       (not SET amount = amount + $1)
     - addCreditsToWallet INSERT into wallet_ledger: use columns
       (user_id, change_type, delta_credits, balance_after, source_type, source_id, idempotency_key)
       instead of (user_id, order_id, change_credits, balance_after, source_type)
     - getWalletLedger SELECT: use delta_credits, change_type, source_type, source_id
       instead of order_id, change_credits
  Keep transaction BEGIN/COMMIT/ROLLBACK and idempotency_key logic intact.

primary_dimensions: [completion, communication, safety]
