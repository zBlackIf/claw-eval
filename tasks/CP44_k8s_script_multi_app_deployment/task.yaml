judge_rubric: |
  评估 agent 对 K8s 评估脚本改进的质量。

  ## 核心检查
  - 是否 source 了 config.conf
  - 是否支持 halo/dify 应用切换（case/if 逻辑）
  - 是否区分 K8s 和 Docker 部署方式
  - 是否沿用 12b_001.sh 的模式（common_utils, log functions, main()）
  - shell 语法是否正确（then/fi 匹配，shebang 存在）

  ## 评分标准
  - 0.9-1.0: 全部满足，pattern 一致，可运行
  - 0.7-0.8: 大部分正确，小细节遗漏
  - 0.4-0.6: 部分改动但不完整
  - 0.0-0.3: 未修改或破坏原有功能

reference_solution: |
  在 03b_002.sh 中：
  1. source ./config.conf
  2. 添加 select_app() 函数（从 12b_001.sh 参考）
  3. 在 main() 中调用 select_app
  4. 用 $app_url 替换硬编码的 APP_URL

