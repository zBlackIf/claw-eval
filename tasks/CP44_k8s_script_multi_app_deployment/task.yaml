judge_rubric: |
  ## Expected Behavior

  1. 读取 config.conf 中的应用配置
  2. 支持在 dify 和 halo 之间切换
  3. 支持 K8s 和 Docker 两种部署形态
  4. 遵循 12b_001.sh 中已有的模式
  5. 保持 common_utils.sh 的日志函数调用不变

  ## Grading Criteria

  - [ ] criterion_config_read: Script sources and uses config.conf variables
  - [ ] criterion_app_switch: Supports switching between at least 2 applications
  - [ ] criterion_deploy_type: Handles both K8s and Docker deployment types
  - [ ] criterion_pattern_follow: Follows the pattern from 12b_001.sh
  - [ ] criterion_shellcheck: Script has no critical shellcheck errors

  ## LLM Judge Rubric

  ### Criterion 1: Config Integration (Weight: 30%)
    - 1.0: Correctly reads app_keyword, namespace, app_k8s flag from config.conf with proper variable expansion
    - 0.75: Reads config but misses some variables
    - 0.5: Partially integrates config
    - 0.25: Hardcodes values instead of reading config
    - 0.0: Ignores config.conf entirely

  ### Criterion 2: Multi-App Support (Weight: 30%)
    - 1.0: Clean branching logic for dify/halo with appropriate per-app test parameters
    - 0.75: Supports both apps but branching is messy
    - 0.5: Only supports one app
    - 0.25: App switching logic is broken
    - 0.0: No multi-app support

  ### Criterion 3: Pattern Consistency (Weight: 25%)
    - 1.0: Follows 12b_001.sh patterns exactly (same variable names, same function structure, same log format)
    - 0.75: Mostly consistent with minor deviations
    - 0.5: Some patterns followed, others invented
    - 0.25: Largely ignores existing patterns
    - 0.0: Completely different style

  ### Criterion 4: Script Quality (Weight: 15%)
    - 1.0: Proper quoting, error handling, exit codes, and bash best practices
    - 0.75: Minor shell scripting issues
    - 0.5: Several best practice violations
    - 0.25: Script may fail on edge cases
    - 0.0: Script has syntax errors
