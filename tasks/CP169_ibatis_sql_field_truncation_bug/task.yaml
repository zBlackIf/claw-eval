judge_rubric: "Reward fixing the data truncation bug: INSERT and UPDATE must strip the '-DESCRIPTION' suffix from costCenter (VARCHAR 4) and wce (VARCHAR 5) before writing to DB. The SELECT query should still display descriptions for the UI. Hidden check: stNo field inside PRODUCT_CODE_4 composition also carries '-DESC' from the query and needs the same treatment. Penalize if the fix breaks the display query or removes description joins."

reference_solution: |
  The root cause: SELECT returns costCenter as 'CODE-DESC' (e.g., '1234-炼钢厂'),
  wce as 'CODE-DESC' (e.g., '41001-铁合金'), stNo as 'CODE-DESC'. When the user
  edits and saves, these full strings go into INSERT/UPDATE for columns that are
  only 4/5/8 chars wide.

  Fix in JHSM3110.xml:
  - INSERT: Change `#costCenter:VARCHAR#` to
    `LEFT(#costCenter:VARCHAR#, LOCATE('-', #costCenter:VARCHAR#) - 1)` or
    equivalent truncation. Same for #wce:VARCHAR# and #stNo:VARCHAR#.
  - UPDATE: Same fix for COST_CENTER = ... and WCE = ... assignments.
  - SELECT: Keep as-is (the joins with description tables are for display only).

  Alternative: Strip in ServiceJHSM3110.java before calling dao.insert/update
  using `costCenter.split("-")[0]`.

