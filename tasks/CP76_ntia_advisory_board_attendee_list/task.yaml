task_id: CP76_ntia_advisory_board_attendee_list
task_name: "NTIA CSMAC 委员会参会名单（CP76 / 源 taskset-260424-pinchbench-v2rc2:task_meeting_advisory_attendees）"
version: "1.1"
category: data_analysis
difficulty: medium
tags: [general]

source_task_id: "task_meeting_advisory_attendees"
source_dataset: "taskset-260424-pinchbench-v2rc2"
source_description: "PinchBench top100 rank 41（std_trim 0.387）。Workflow + workspace 混合：notes service 提供会议纪要（含 transcript），agent 用 notes_list/notes_get 拿，然后写 sandbox attendees.md。notes 没有 update 端点所以输出走 sandbox。grader 评 sandbox content + notes_get 工具使用。"

services:
  - name: notes
    command: python mock_services/notes/server.py
    port: 9105
    health_check: http://localhost:9105/notes/list
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9105/notes/reset
    env:
      NOTES_FIXTURES: tasks/CP76_ntia_advisory_board_attendee_list/fixtures/notes/meetings.json

prompt:
  text: |
    昨天那场 CSMAC 委员会会议的纪要在会议系统里，帮我把所有参会人整理一份
    /workspace/attendees.md，让我能一眼看清楚谁来了、什么身份、现场还是
    电话接入。
  language: zh

tools:
  - name: notes_list
    description: 列出最近的会议纪要（返回元信息，不含全文）
    input_schema:
      type: object
      properties:
        max_results: {type: integer, default: 10}
        tag: {type: string}
        days_back: {type: integer}
      required: []
  - name: notes_get
    description: 按 note_id 取会议纪要全文
    input_schema:
      type: object
      properties:
        note_id: {type: string}
      required: [note_id]

tool_endpoints:
  - tool_name: notes_list
    url: http://localhost:9105/notes/list
    method: POST
  - tool_name: notes_get
    url: http://localhost:9105/notes/get
    method: POST

sandbox_grader_files:
  - fixtures/verify_attendees.py

env_snapshot_commands:
  - python /workspace/fixtures/verify_attendees.py

env_snapshot_files:
  - /workspace/attendees.md

environment:
  timeout_seconds: 600
  max_turns: 16
  env_snapshot_timeout: 30

scoring_components: []
safety_checks: []
expected_actions: []

judge_rubric: "Reward agent that uses notes_list → notes_get to retrieve the CSMAC meeting transcript, then writes /workspace/attendees.md identifying Fontes (Chair, NENA), ≥15 of 19 committee members, ≥4 remote attendees (Hatfield/Feldman/McGinnis/Stancil/Reaser/Donovan) tagged phone/remote, ≥3 non-member officials (Strickling/Nebbia/Power/Washington), ≥10 organization affiliations, in-person vs phone mode, Mr. Snider as public participant, total count."

reference_solution: |
  notes_list() → find note_csmac_2012_05_30. notes_get(that id) → read
  full transcript. Compose /workspace/attendees.md with sections:
  Committee Leadership (Fontes, NENA), Committee Members In-Person,
  Committee Members Remote (asterisk notation), Non-Member Officials,
  Public Participants (Snider). Include orgs + total count.

primary_dimensions: [completion, robustness, communication]
