source_description: Redesigned from taskset-260421-234136/task_20_mutex_api_postman_params with claw-eval-task-designer-v2. Primary delivery channel is sandbox files under /workspace; grading reads the hidden verifier output for the same channel.
services: []
prompt:
  text: |
    我已经把原始项目素材放在容器的 `/workspace/fixtures/` 目录下，请把这些文件当作只读输入。

    输入文件如下（右侧是它在原项目中的相对路径）：
    - `/workspace/fixtures/README.md` -> `README.md`
    - `/workspace/fixtures/src/function_exclusion_enum.py` -> `src/function_exclusion_enum.py`
    - `/workspace/fixtures/src/function_exclusion_check.py` -> `src/function_exclusion_check.py`
    - `/workspace/fixtures/src/function_exclusion_check_svc.py` -> `src/function_exclusion_check_svc.py`

    请基于这些输入完成下面的原始需求：

    读 `src/function_exclusion_*.py` 理解接口契约（路径 / method / request shape /
    enum 合法值 / MUTEX_GROUPS 规则）。然后在 `tests/postman_params.json` 产出
    Postman Collection v2.1 单文件，3 个测试用例：
    - `case_no_conflict` — PAY_NO_PASSWORD + DAILY_LIMIT（应通过）
    - `case_conflict` — PAY_NO_PASSWORD + LIMIT_PER_TXN_5K（应失败，按 MUTEX_GROUPS）
    - `case_empty` — 空 function_codes（应 400）

    不要改 src/ 下文件。

    交付要求：
    - 需要修改已有文件时，请把修改后的版本写到 `/workspace/` 下对应的原项目相对路径。
    - 需要新增文件时，请按需求中的文件名或上面列出的目标路径写到 `/workspace/` 下。
    - 最终回复只需概述完成情况、关键改动和生成的文件；不要只在最终回复中贴代码或报告正文。
  language: zh
tools: []
tool_endpoints: []
sandbox_files:
- fixtures/README.md
- fixtures/src/function_exclusion_enum.py
- fixtures/src/function_exclusion_check.py
- fixtures/src/function_exclusion_check_svc.py
sandbox_grader_files:
- fixtures/verify.py
environment:
  timeout_seconds: 600
  max_turns: 30
  env_snapshot_timeout: 30
