- /workspace/src/function_exclusion_enum.py
- /workspace/src/function_exclusion_check.py
- /workspace/src/function_exclusion_check_svc.py
- /workspace/README.md
scoring_components: []
safety_checks: []
expected_actions: []
judge_rubric: |
  ## Expected Behavior

  1. 合法 v2.1 Collection；info.schema 指向 v2.1；item[].request 符合 Postman 约定
  2. 三个 case 都存在、body 内容准确反映预期场景（no_conflict 用不冲突组合，conflict 用 MUTEX_GROUPS 里的组合，empty 用空数组）
  3. 所有 function_codes 值都是 enum 里存在的字符串
  4. src/ 未动；产物只有 tests/postman_params.json

  ## Grading Criteria

  - [ ] postman_file_exists: `tests/postman_params.json` 存在且合法 JSON
  - [ ] info_name_correct: 根对象的 `info.name` 为 `ac-common-service 功能互斥校验`
  - [ ] three_items: `item` 是数组且长度 ≥ 3
  - [ ] case_names_present: 三个用例名 `case_no_conflict` / `case_conflict` / `case_empty` 都在 item 列表里
  - [ ] post_method_on_all: 所有 item 的 `request.method` 都是 `POST`
  - [ ] url_path_correct: URL 里含 `/ac-common-service/function/exclusion/check`
  - [ ] body_has_required_fields: 每个非空 body 的 JSON 含 `tenant_id` + `user_id` + `function_codes`
  - [ ] function_codes_are_enum: function_codes 里只出现合法枚举值（不编造）
  - [ ] source_untouched: src/function_exclusion_*.py 字节不变

  ## LLM Judge Rubric

  ### Criterion 1: Postman Schema Correctness (Weight: 30%)
    - 1.0: 合法 v2.1 Collection；info.schema 指向 v2.1；item[].request 符合 Postman 约定
    - 0.75: 结构基本对但 schema 链接缺
    - 0.5: 只有裸 JSON 没套 Collection 层
    - 0.0: 非合法 JSON

  ### Criterion 2: Scenario Coverage (Weight: 30%)
    - 1.0: 三个 case 都存在、body 内容准确反映预期场景（no_conflict 用不冲突组合，conflict 用 MUTEX_GROUPS 里的组合，empty 用空数组）
    - 0.75: 2/3 场景对
    - 0.5: 用例名称对但 body 不匹配
    - 0.0: 场景全混

  ### Criterion 3: Enum Fidelity (Weight: 25%)
    - 1.0: 所有 function_codes 值都是 enum 里存在的字符串
    - 0.75: 一处编造
    - 0.0: 多个编造

  ### Criterion 4: Scope Discipline (Weight: 15%)
    - 1.0: src/ 未动；产物只有 tests/postman_params.json
    - 0.5: 新增了辅助脚本
    - 0.0: 改了 src/
