task_id: CP24_mutex_api_postman_collection
task_name: 功能互斥校验接口Postman Collection生成
version: "1.0"
category: api_testing
difficulty: medium
tags: [general, single_turn, coding_plan]

source_task_id: "task_20_mutex_api_postman_params"
source_dataset: "taskset-260421-234136"
source_description: "从 PinchBench eval-260427-172048-209429 (10模型×99题) 中按跨模型标准差排名精选的高区分度任务，改编为 Claw-Eval Pattern D (sandbox-adapted) 格式。原始 prompt 保留，grader 基于 PinbenchAdaptedGrader 实现自动化评分。"

services: []

prompt:
  text: |
    <!-- CLAW-EVAL-FIXTURE-PREAMBLE -->
    以下文件已注入到容器内，请按给出的容器绝对路径读取（容器 WORKDIR = `/workspace`）：

    - `/workspace/fixtures/src/function_exclusion_check.py`
    - `/workspace/fixtures/src/function_exclusion_check_svc.py`
    - `/workspace/fixtures/src/function_exclusion_enum.py`

    所有产物请落到 `/workspace/...` 下；评分仅捕获 `/workspace/` 内的文件。

    读 `src/function_exclusion_*.py` 理解接口契约（路径 / method / request shape /
    enum 合法值 / MUTEX_GROUPS 规则）。然后在 `tests/postman_params.json` 产出
    Postman Collection v2.1 单文件，3 个测试用例：
    - `case_no_conflict` — PAY_NO_PASSWORD + DAILY_LIMIT（应通过）
    - `case_conflict` — PAY_NO_PASSWORD + LIMIT_PER_TXN_5K（应失败，按 MUTEX_GROUPS）
    - `case_empty` — 空 function_codes（应 400）

    不要改 src/ 下文件。
  language: zh

tools: []
tool_endpoints: []

sandbox_files:
  - fixtures/src/function_exclusion_check.py
  - fixtures/src/function_exclusion_check_svc.py
  - fixtures/src/function_exclusion_enum.py

sandbox_grader_files:
  - fixtures/verify.py

environment:
  timeout_seconds: 300
  max_turns: 20

  env_snapshot_timeout: 30

env_snapshot_commands:
  - python /workspace/fixtures/verify.py

env_snapshot_files:
  - /workspace/tests/postman_params.json
  - /workspace/src
scoring_components: []

safety_checks: []
expected_actions: []

judge_rubric: |
  评估 agent 生成的 Postman Collection 是否正确覆盖了功能互斥校验接口的测试用例。

  ## Postman Collection 结构
  - 是否生成了合法的 Postman Collection v2.1 格式 JSON
  - 是否包含了 info、item 等必要字段
  - 是否有正确的请求方法（POST）和路径

  ## 测试用例覆盖
  - case_no_conflict: PAY_NO_PASSWORD + DAILY_LIMIT 应期望成功响应
  - case_conflict: PAY_NO_PASSWORD + LIMIT_PER_TXN_5K 应期望失败响应（互斥冲突）
  - case_empty: 空 function_codes 应期望 400 错误

  ## 接口契约准确性
  - 请求体格式是否符合 src 定义（function_codes 字段）
  - enum 值是否使用了正确的常量名
  - 是否正确理解了 MUTEX_GROUPS 规则

  ## 约束遵守
  - 是否未修改 src/ 下文件

  ## 评分标准
  - 0.9-1.0: 合法 Collection，3 个用例全覆盖，接口契约正确
  - 0.7-0.8: Collection 格式正确但有小细节问题
  - 0.4-0.6: 部分用例缺失或格式有误
  - 0.0-0.3: 未生成或完全错误

reference_solution: |
  1. 读取 src 文件理解：POST /api/v1/function-exclusion/check
  2. Request body: {"function_codes": ["CODE1", "CODE2"]}
  3. MUTEX_GROUPS: [[PAY_NO_PASSWORD, LIMIT_PER_TXN_5K], ...]
  4. 生成 Postman Collection v2.1 格式 JSON

primary_dimensions: [completion, robustness, communication]
