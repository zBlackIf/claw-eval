judge_rubric: "Reward complete logging unification: BaseState custom log/logError/logDebug methods removed, unified types header with DEV_ENV ifdef (logger.h in dev, SocMwLog.h in prod), CMakeLists.txt adds lib/loglib include path for htvstartsequence target, TAG macros defined in .cpp files following htvclone pattern, state implementations use LOG_INFO/LOG_ERROR/LOG_DEBUG macros instead of member function calls."

reference_solution: |
  1. Create htvstartsequence/include/htvstartsequence_types.h:
     - #ifdef DEV_ENV -> #include "logger.h"
     - #else -> #include "SocMwLog.h" + define LOG_* as SOC_MW_LOG_*
     - Optional: STATE_LOG_* convenience macros
  2. Remove BaseState::log/logError/logDebug declarations from base_state.h
  3. Remove BaseState::log/logError/logDebug implementations from base_state.cpp
  4. Remove SequenceManager::log/logError declarations and implementations
  5. Update CMakeLists.txt: add lib/loglib to htvstartsequence include dirs
  6. In each .cpp file: #include "htvstartsequence_types.h" + #define TAG "StateName"
  7. Replace log("msg") calls with LOG_INFO(TAG, "msg") pattern
  8. Replace logError("msg") with LOG_ERROR(TAG, "msg")
  9. Replace logDebug("msg") with LOG_DEBUG(TAG, "msg")

primary_dimensions: [completion, communication, safety]
