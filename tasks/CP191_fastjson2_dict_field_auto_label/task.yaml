difficulty: hard
tags: [java, spring-boot, fastjson2, annotation, serialization]

source_session_id: "12066348804520408567"
source_description: "从真实用户会话提取：用户需要在 Fastjson2 序列化时，通过注解自动为字典字段追加 Label 翻译值。涉及自定义注解、反射扫描、AfterFilter 机制、字段缓存等设计模式。Workspace WS2 模式。"

services: []

prompt:
  text: |
    项目用 Spring Boot 3.2 + Fastjson2 做 JSON 序列化。现在有个需求：实体类的字典
    字段（比如 status=1）序列化时要自动追加一个 statusLabel="启用" 字段，前端就不
    用再自己做字典翻译了。

    要求：
    1. 搞一个 @DictField("user_status") 注解，标在实体字段上，value 是字典类型编码
    2. 用 Fastjson2 的 AfterFilter 机制，在序列化完成后自动追加 {字段名}Label
    3. 字典查询抽个 DictProvider 接口出来，方便后面换成 Redis 缓存实现
    4. 把 filter 注册到已有的 WebMvcConfig 里
    5. UserEntity 的 status 和 gender 字段加上注解

    已有代码在 /workspace/fixtures/enterprise-backend/，DictDataSource 里有字典数据。
    做好放到对应包下就行。
  language: zh

tools: []
tool_endpoints: []

