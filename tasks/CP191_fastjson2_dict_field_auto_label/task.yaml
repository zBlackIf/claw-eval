expected_actions: []

judge_rubric: "Reward complete implementation: (1) @DictField annotation with @Retention(RUNTIME) @Target(FIELD) and String value(); (2) DictProvider interface with getLabel(dictType, dictValue); (3) Filter extending Fastjson2 AfterFilter that uses reflection to scan @DictField fields and calls writeKeyValue to append {field}Label; (4) Field scan results cached in ConcurrentHashMap for performance; (5) Filter registered in WebMvcConfig via setWriterFilters; (6) UserEntity status/@DictField(\"user_status\") and gender/@DictField(\"gender\") annotated."

reference_solution: |
  1. com.demo.annotation.DictField — @Retention(RUNTIME) @Target(FIELD), String value()
  2. com.demo.dict.DictProvider — interface with String getLabel(String dictType, String dictValue)
  3. com.demo.dict.DictProviderImpl — @Component implements DictProvider, delegates to DictDataSource
  4. com.demo.web.DictLabelFilter — extends AfterFilter:
     - ConcurrentHashMap<Class<?>, List<DictFieldInfo>> fieldCache
     - writeAfter(Object): scan fields via cache, read value, call dictProvider.getLabel(), writeKeyValue(fieldName+"Label", label)
     - scanDictFields(Class<?>): walk class hierarchy, find @DictField fields, setAccessible
  5. WebMvcConfig — config.setWriterFilters(new DictLabelFilter(dictProvider))
  6. UserEntity — @DictField("user_status") on status, @DictField("gender") on gender

primary_dimensions: [completion, communication, safety]
