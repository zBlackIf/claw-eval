judge_rubric: |
  ## Expected Behavior

  1. 新增流式下载方法，使用 httpx 的 stream 模式
  2. 边下载边写入临时文件，周期性尝试用 OpenCV 提取帧
  3. 达到 MAX_FRAMES 后立即停止下载
  4. 流式失败时自动回退到完整下载
  5. 在 config.py 中添加相关配置项
  6. 保持原有接口兼容

  ## Grading Criteria

  - [ ] criterion_stream_mode: Uses httpx streaming (client.stream or response.aiter_bytes)
  - [ ] criterion_early_stop: Stops downloading after extracting enough frames
  - [ ] criterion_fallback: Has fallback to full download on stream failure
  - [ ] criterion_config: Adds configuration for stream-related parameters
  - [ ] criterion_interface_compat: load_video method signature unchanged

  ## LLM Judge Rubric

  ### Criterion 1: Streaming Implementation (Weight: 35%)
    - 1.0: Correctly uses httpx async streaming with aiter_bytes/aiter_raw, writes chunks to temp file, extracts frames periodically
    - 0.75: Streaming implemented but with minor issues
    - 0.5: Partial streaming (e.g., uses Range headers but not true streaming)
    - 0.25: Claims streaming but actually downloads full file
    - 0.0: No streaming implementation

  ### Criterion 2: Early Termination Logic (Weight: 30%)
    - 1.0: Correctly stops download after MAX_FRAMES extracted, with proper OpenCV VideoCapture handling on partial file
    - 0.75: Early termination works but has edge cases
    - 0.5: Terminates but may miss frames or have race conditions
    - 0.25: Termination logic present but broken
    - 0.0: Downloads full file regardless

  ### Criterion 3: Error Handling and Fallback (Weight: 20%)
    - 1.0: Graceful fallback to full download on any stream error, proper cleanup of temp files
    - 0.75: Fallback exists but incomplete cleanup
    - 0.5: Partial error handling
    - 0.25: No fallback
    - 0.0: Errors crash the service

  ### Criterion 4: API Compatibility (Weight: 15%)
    - 1.0: load_video signature and return type unchanged, existing callers unaffected
    - 0.75: Minor signature changes but backward compatible
    - 0.5: Breaking changes that require caller updates
    - 0.25: Interface significantly changed
    - 0.0: Existing functionality broken
