prompt:
  text: |
    我已经把原始项目素材放在容器的 `/workspace/fixtures/` 目录下，请把这些文件当作只读输入。

    输入文件如下（右侧是它在原项目中的相对路径）：
    - `/workspace/fixtures/app/services/video_loader.py` -> `app/services/video_loader.py`
    - `/workspace/fixtures/app/config.py` -> `app/config.py`
    - `/workspace/fixtures/app/core/video_processor.py` -> `app/core/video_processor.py`

    请基于这些输入完成下面的原始需求：

    当前项目是一个视频封面推荐服务。视频较大时下载时间很长，但实际只需要视频前100帧来做封面推荐。整个视频下载下来浪费时间和带宽。

    请修改 video_loader.py，实现流式下载 + 提前终止的方案：下载视频时使用 httpx 流式请求，边下载边用临时文件给 OpenCV 提取帧，提取到足够帧数后立即停止下载。如果流式方式失败，需要回退到原来的完整下载方式。

    交付要求：
    - 需要修改已有文件时，请把修改后的版本写到 `/workspace/` 下对应的原项目相对路径。
    - 需要新增文件时，请按需求中的文件名或上面列出的目标路径写到 `/workspace/` 下。
    - 最终回复只需概述完成情况、关键改动和生成的文件；不要只在最终回复中贴代码或报告正文。
