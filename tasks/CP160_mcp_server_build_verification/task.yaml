judge_rubric: "Reward a complete MCP server: (1) valid Python file using the mcp package, (2) Server instance with stdio transport, (3) all 5 tools registered (build, reference_build, compare, detect_changes, full_verify), (4) proper parameter definitions with types and descriptions, (5) tools correctly invoke the underlying CLI scripts and return JSON results."

reference_solution: |
  server.py using mcp package:
  - from mcp.server import Server + stdio transport
  - @server.tool() decorator for each of 5 tools
  - build_project(project_dir: str, config: str = "Release") -> invokes build_project.py
  - reference_build(project_dir: str, config: str = "Release") -> invokes reference_build.py
  - compare_artifacts(project_dir: str, module: str|None, config: str) -> invokes compare_artifacts.py
  - detect_changes(project_dir: str, since: int = 5) -> invokes detect_changes.py
  - full_verify(project_dir: str, config: str = "Release") -> runs build+ref+compare in sequence
  - if __name__ == "__main__": run stdio transport

primary_dimensions: [completion, communication, safety]
