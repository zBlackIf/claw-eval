judge_rubric: |
  评估 agent 对 PHP URL 代理的路径格式扩展实现质量。

  ## index.php URL 解析逻辑
  - 是否正确从 PATH_INFO 或 REQUEST_URI 中提取 http/https 开头的 URL
  - 是否正确处理带查询参数的 URL（如 ?id=1 不被截断）
  - 是否保持了 ?q= 原始用法的兼容性
  - 是否避免了 eval/system/exec 等危险函数

  ## .htaccess 配置
  - 是否添加了 AcceptPathInfo On
  - mod_rewrite 规则是否正确将路径转发到 index.php
  - 是否不影响静态文件访问

  ## Apache VHost 配置
  - url-proxy.conf 是否正确配置支持 AcceptPathInfo

  ## CHANGES.md 文档
  - 是否说明了新用法
  - 是否解释了 AcceptPathInfo On 的必要性
  - 是否确认了向后兼容性

  ## 评分标准
  - 0.9-1.0: 完美实现，三种 URL 格式全部正确处理，配置完整，文档清晰
  - 0.7-0.8: 核心逻辑正确但有小问题（如边界情况处理不完善）
  - 0.4-0.6: 实现不完整或有明显错误
  - 0.0-0.3: 未完成或破坏了原有功能

reference_solution: |
  1. index.php: 在 require vendor/autoload.php 之前加入 PATH_INFO 解析
  2. .htaccess: 添加 AcceptPathInfo On + RewriteRule
  3. url-proxy.conf: 确认 AllowOverride All 和 AcceptPathInfo 支持
  4. CHANGES.md: 文档新用法和兼容性说明

primary_dimensions: [completion, robustness, communication]
