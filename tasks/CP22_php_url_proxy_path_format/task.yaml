judge_rubric: |
  ## Expected Behavior

  1. Agent 读 `project/index.php` 看现有提取逻辑
  2. Agent 读 `.htaccess` 看现有 rewrite 规则
  3. Agent 读 `url-proxy.conf` 确认 AllowOverride 设置
  4. Agent 修改 `index.php` 加 PATH_INFO / REQUEST_URI 解析
  5. Agent 修改 `.htaccess` 加 `AcceptPathInfo On`
  6. Agent 可能需要调整 rewrite 规则
  7. Agent 写 `CHANGES.md` 说明

  ## Grading Criteria

  - [ ] index_php_handles_path_info: `project/index.php` 包含读取 `$_SERVER['PATH_INFO']` 或 `$_SERVER['REQUEST_URI']` 的逻辑
  - [ ] index_php_extracts_scheme: 代码能判断 path 开头是 `http` 或 `https` 并重建目标 URL
  - [ ] backward_compat_preserved: `?q=xxx` 原始用法的逻辑仍然存在（不被覆盖）
  - [ ] htaccess_accept_path_info: `.htaccess` 含 `AcceptPathInfo On`
  - [ ] composer_untouched: `composer.json` 依赖列表没有被增加新项
  - [ ] no_dangerous_php: `index.php` 里没有 `eval(` / `system(` / `exec(` / `shell_exec(`
  - [ ] changes_doc_explains_why: `CHANGES.md` 存在且解释了新用法 + AcceptPathInfo 的必要性

  ## LLM Judge Rubric

  ### Criterion 1: URL Parsing Correctness (Weight: 35%)
    - 1.0: 新代码正确处理 3 种输入（/https/... / /http/... / /?q=...），包括 query string 透传；变量命名清晰；有注释说明为什么先查 PATH_INFO 再退到 REQUEST_URI
    - 0.75: 三种输入都能处理但有一处小瑕疵（比如 query string 没透传）
    - 0.5: 只处理 https 不处理 http，或 query string 丢失
    - 0.25: 只能处理简单的 /https/example.com
    - 0.0: 没实现或逻辑完全错

  ### Criterion 2: Backward Compatibility (Weight: 25%)
    - 1.0: `?q=` 用法完全保留，新代码只在 PATH_INFO/REQUEST_URI 有内容时才介入，没副作用
    - 0.75: 兼容但有轻微副作用（比如 warning）
    - 0.5: 兼容但逻辑路径改变
    - 0.25: 破坏了 `?q=` 的默认流程
    - 0.0: 完全覆盖了旧用法

  ### Criterion 3: Apache Config Understanding (Weight: 20%)
    - 1.0: 解释了 `AcceptPathInfo On` 的必要性（默认关闭、PATH_INFO 不会被填充），并且 `.htaccess` 里正确添加
    - 0.75: 配置改对了但解释一般
    - 0.5: 配置对但没解释或解释不准
    - 0.25: 配置缺失但代码写了（运行时 PATH_INFO 会是空）
    - 0.0: 完全不理解这个配置

  ### Criterion 4: Change Documentation (Weight: 20%)
    - 1.0: CHANGES.md 清晰说明：新用法示例、兼容性保证、Apache 配置改动、可能的 edge case（如 URL 里含有 `#` fragment）
    - 0.75: 三项齐全但一项简单
    - 0.5: 粗略记录
    - 0.25: 敷衍
    - 0.0: 没 CHANGES.md
