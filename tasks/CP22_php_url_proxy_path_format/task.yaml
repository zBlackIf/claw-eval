services: []

prompt:
  text: |
    <!-- CLAW-EVAL-FIXTURE-PREAMBLE -->
    以下文件已注入到容器内，请按给出的容器绝对路径读取（容器 WORKDIR = `/workspace`）：

    - `/workspace/fixtures/project/index.php`
    - `/workspace/fixtures/project/.htaccess`
    - `/workspace/fixtures/project/composer.json`
    - `/workspace/fixtures/apache2/sites-available/url-proxy.conf`

    所有产物请落到 `/workspace/...` 下；评分仅捕获 `/workspace/` 内的文件。

    我在服务器上跑着一个基于 `athlon1600/php-proxy-app` 的 URL 代理，部署在 `project/`
    （对应真实路径 `/var/www/html/proxy/`）。现在用法是这样：

    ```
    https://lanmei.ccwu.cc/proxy/?q=https://github.com
    ```

    我想要新增一种更自然的路径格式：

    ```
    https://lanmei.ccwu.cc/proxy/https://github.com
    https://lanmei.ccwu.cc/proxy/http://news.ycombinator.com/item?id=1
    ```

    你要做的事（改动限制在 `project/` 下面和 `apache2/sites-available/`，别碰其他地方）：

    1. 修改 `project/index.php`：在调用 proxy 核心逻辑之前，加一段代码从 `$_SERVER['PATH_INFO']`
       或 `$_SERVER['REQUEST_URI']` 里提取 `http://` / `https://` 开头的目标 URL，
       重建完整 URL 后塞到 `$_GET['q']`。如果不是 `/http/` 或 `/https/` 开头就保持现有行为
    2. 修改 `project/.htaccess`：启用 `AcceptPathInfo On`，同时调整 mod_rewrite 规则让所有非文件路径都转发到 `index.php`
    3. 修改 `apache2/sites-available/url-proxy.conf`：增加对 `.htaccess` 里的 `AcceptPathInfo` 生效的配置
    4. 写一份 `project/CHANGES.md` 说明：新增的用法、为什么需要 AcceptPathInfo On、原来 `?q=xxx` 是否仍然兼容

    硬约束：
    - 不要删除或破坏 `?q=` 这种原始用法
    - 不要引入任何 PHP 依赖（不要改 composer.json）
    - PHP 代码里不要用 `eval()` / `system()` / 任何 exec
    - 新的 URL 解析代码必须能处理：
      - `/proxy/https://github.com` → target = `https://github.com`
      - `/proxy/http://example.com/path?query=1` → target = `http://example.com/path?query=1`
      - `/proxy/?q=https://github.com` → 保持原行为
  language: zh

