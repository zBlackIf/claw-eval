<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    ServerName lanmei.ccwu.cc
    DocumentRoot /var/www/html/proxy

    AllowEncodedSlashes NoDecode

    <Directory /var/www/html/proxy>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/url-proxy-error.log
    CustomLog ${APACHE_LOG_DIR}/url-proxy-access.log combined
</VirtualHost>
