<VirtualHost *:443>
    ServerName lanmei.ccwu.cc
    DocumentRoot /var/www/html

    <Directory /var/www/html/proxy>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/lanmei.ccwu.cc/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/lanmei.ccwu.cc/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/proxy-error.log
    CustomLog ${APACHE_LOG_DIR}/proxy-access.log combined
</VirtualHost>
