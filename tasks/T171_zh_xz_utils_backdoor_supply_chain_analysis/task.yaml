task_id: T171_zh_xz_utils_backdoor_supply_chain_analysis
task_name: "XZ Utils 后门事件（CVE-2024-3094）供应链安全分析"
version: "1.0"
category: security
difficulty: medium
tags: [general]

services:
  - name: web_real
    command: python mock_services/web_real/server.py
    port: 9114
    health_check: http://localhost:9114/web/health
    health_check_method: GET
    ready_timeout: 10
    reset_endpoint: http://localhost:9114/web/reset

prompt:
  text: |
    我们安全团队需要做一次内部培训分享，主题是2024年初爆出的 XZ Utils 后门事件（CVE-2024-3094）。
    这是近年来最严重的开源供应链攻击之一，我需要你帮我搜索和整理一份完整的事件分析报告。

    请调研以下内容：

    1. 事件概述：什么时候被发现的？谁发现的？漏洞的严重程度（CVSS评分）？
    2. 攻击手法：攻击者（Jia Tan / JiaT75）是如何花了2年多时间获取信任并植入后门的？
    3. 技术细节：后门具体影响了哪些版本？攻击目标是什么（sshd？）？后门如何触发？
    4. 影响范围：哪些Linux发行版受影响？哪些没有受影响？为什么？
    5. 发现过程：Andres Freund 是如何因为 SSH 登录变慢 500ms 而发现这个后门的？
    6. 事后修复：社区的应对措施和后续的安全加固方案

    输出一份适合做安全培训分享的技术分析报告，需要包含：
    - 事件时间线（关键节点）
    - 技术攻击路径图（文字描述即可）
    - 对我们团队的启示和防范建议

    只做调研分析，不要执行任何安全扫描或发送告警。
  language: zh

