expected_actions: []

judge_rubric: |
  评估 agent 完成 XZ Utils 后门事件（CVE-2024-3094）技术分析报告的质量。

  场景：安全团队做内部培训分享，需要全面了解这次供应链攻击事件。
  核心价值：帮安全从业者快速了解重大安全事件的全貌和防范方法。

  评分维度：

  D1. 事件基本信息 (权重 20%)
      关键事实：
      - CVE-2024-3094，CVSS 10.0 (最高严重级别)
      - 2024年3月29日由微软工程师 Andres Freund 发现
      - 发现原因：SSH登录延迟异常增加约500ms + CPU占用升高
      评分标准：
      - 1.0: CVE编号 + CVSS + 发现者 + 发现方式均正确
      - 0.5: 部分正确
      - 0.0: 基本信息错误

  D2. 攻击者画像与时间线 (权重 25%)
      关键事实：
      - 攻击者使用 "Jia Tan" (JiaT75) 身份
      - 从2022年初开始向xz-utils贡献代码
      - 通过社工（sockpuppet施压原maintainer）获取commit权限
      - 2024年2月在5.6.0/5.6.1版本中植入后门
      评分标准：
      - 1.0: 时间线完整（2022入侵→2024植入→被发现）+ 社工手法
      - 0.5: 时间线有但不完整
      - 0.0: 未涉及攻击历程

  D3. 技术细节 (权重 30%)
      关键技术事实：
      - 受影响版本: xz-utils 5.6.0 和 5.6.1
      - 后门通过修改的build脚本注入到 liblzma 库中
      - 目标: 通过 systemd → sshd 的依赖链劫持 SSH 认证
      - 效果: 允许攻击者绕过SSH认证执行远程代码
      - 触发条件: 特定的SSH公钥作为指令
      评分标准：
      - 1.0: 版本 + liblzma + sshd链路 + 触发机制均覆盖
      - 0.5: 涉及3项
      - 0.0: 技术描述错误

  D4. 影响范围与启示 (权重 25%)
      - 受影响: Fedora 40/Rawhide, Debian testing/unstable, openSUSE Tumbleweed
      - 未受影响: Ubuntu LTS, RHEL, 大多数stable发行版（因为还没合入）
      - 根本原因: 开源项目单一maintainer burnout + 缺乏多方review
      - 防范建议: 依赖审计、reproducible builds、maintainer多元化
      评分标准：
      - 1.0: 影响范围正确 + 有具体防范建议
      - 0.5: 涉及其一
      - 0.0: 未涉及

  最终评分 = 0.20*D1 + 0.25*D2 + 0.30*D3 + 0.25*D4

reference_solution: |
  搜索策略：
  1. web_search("XZ Utils backdoor CVE-2024-3094 timeline") → 事件概述
  2. web_search("Jia Tan JiaT75 xz-utils social engineering attack") → 攻击者分析
  3. web_fetch(Andres Freund 的 oss-security 邮件列表原帖) → 发现过程
  4. web_search("CVE-2024-3094 technical analysis liblzma sshd") → 技术细节
  5. web_search("xz backdoor affected Linux distributions Fedora Debian") → 影响范围
  6. web_search("xz utils supply chain attack lessons learned prevention") → 防范建议

  关键数据：
  - CVE: CVE-2024-3094, CVSS: 10.0
  - 发现者: Andres Freund (Microsoft), 2024-03-29
  - 攻击者: Jia Tan (JiaT75), 活跃自2022年初
  - 受影响版本: 5.6.0, 5.6.1
  - 攻击路径: 修改build脚本 → 注入liblzma → 劫持sshd认证

primary_dimensions: [completion, robustness, communication]
