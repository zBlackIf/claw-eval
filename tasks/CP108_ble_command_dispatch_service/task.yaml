services: []

prompt:
  text: |
    我有个 BLE 外设工程（/workspace/fixtures/ble_peripheral/），需要你帮我实现以下功能：

    1. 在 ble_user_service.c 里实现一个命令分发表（类似 package_entry_t 数组），
       App 下发数据格式是 [cmd_type, cmd_id, payload...]，收到后根据 cmd_type+cmd_id
       查表调用对应处理函数。至少注册 3 个命令处理器（握手 0xEA/0x01、设置时间
       0xEA/0x04、设置电量 0xEA/0x07）。

    2. write_callback 里正确判断 handle（RX handle 是 0x0011），把收到的数据
       通过 printf 打印出来（hex dump），然后走分发表。

    3. 在 ble_adv.c 里把 MAC 地址（从 xcfg_cb.le_addr[0..5]）填到广播数据的
       厂商自定义段里，让 iOS 能解析到设备地址。

    4. 实现一个 ble_user_1s_proc() 函数，每秒通过 notify（handle 0x000E）
       发一条心跳包给 App。连接后才发，断开就停。

    代码放回 /workspace/ble_peripheral/ 对应路径。
  language: zh

