judge_rubric: "Reward complete BLE command dispatch implementation: (1) package_entry_t struct + dispatch table with >= 3 entries, (2) write_callback checking handle 0x0011 with printf hex dump + dispatch call, (3) ble_adv.c dynamically fills MAC from xcfg_cb.le_addr into manufacturer data, (4) ble_user_1s_proc sends notify on handle 0x000E with connection guard, (5) proper C style matching SDK conventions."

reference_solution: |
  In ble_user_service.c:
  - typedef struct { u8 cmd_type; u8 cmd_id; void (*handler)(u8*, u16); } package_entry_t;
  - const package_entry_t ble_package_items[] with entries for 0xEA/0x01, 0xEA/0x04, 0xEA/0x07
  - dispatch function iterating table, matching cmd_type+cmd_id
  - service_write_callback: check handle==0x0011, printf hex, call dispatch
  - ble_user_1s_proc: if connected, send notify via ble_att_server_notify(handle 0x000E, data)
  In ble_adv.c:
  - In ble_get_adv_data(), after memcpy of adv_data_const, fill adv_buf offsets with xcfg_cb.le_addr[0..5]

primary_dimensions: [completion, communication, safety]
