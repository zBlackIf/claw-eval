prompt:
  text: |
    I have placed the original project materials under `/workspace/fixtures/`. Treat those files as read-only inputs.

    Input files are listed below; the right side is each file's original project-relative path:
    - `/workspace/fixtures/design_spec.md` -> `design_spec.md`
    - `/workspace/fixtures/src/main/java/com/example/scanner/AlarmScanner.java` -> `src/main/java/com/example/scanner/AlarmScanner.java`
    - `/workspace/fixtures/src/main/java/com/example/rule/RuleEngine.java` -> `src/main/java/com/example/rule/RuleEngine.java`
    - `/workspace/fixtures/src/main/java/com/example/notify/EmailNotifier.java` -> `src/main/java/com/example/notify/EmailNotifier.java`

    Use those inputs to complete the original request below:

    As a senior Java developer, review the alarm-scan-engine project code. Read the design_spec.md first, then review each source file. Produce a review report (review_report.md) covering:
    1. Project structure clarity and code readability (clean code compliance)
    2. Whether the implementation follows the alarm classification design spec (identify missing components)
    3. Specific code issues with severity (CRITICAL/HIGH/MEDIUM/LOW)
    4. Actionable improvement suggestions

    Delivery requirements:
    - When you modify an existing file, write the modified version under `/workspace/` using the same project-relative path.
    - When you create a new file, write it under `/workspace/` using the filename or target path requested above.
    - In your final response, only summarize the status, key changes, and generated files; do not only paste code or report text in chat.
