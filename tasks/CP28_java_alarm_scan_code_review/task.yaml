judge_rubric: |
  ## Expected Behavior

  1. Agent reads design_spec.md to understand the intended architecture
  2. Agent reads AlarmScanner.java and identifies: not an interface (TODO noted), mutable state
  3. Agent reads RuleEngine.java and identifies: public field, swallowed exception, returns null
  4. Agent reads EmailNotifier.java and identifies: hardcoded values, no Strategy pattern, no interface
  5. Agent identifies missing components: AlarmRepository, NotificationDispatcher, Builder pattern, YAML config
  6. Agent writes review_report.md with structured findings

  ## Grading Criteria

  - [ ] read_spec
  - [ ] read_sources
  - [ ] report_created
  - [ ] issues_identified
  - [ ] has_severity

  ## LLM Judge Rubric

  ### Criterion 1: Code Issue Detection (Weight: 30%)
  **Score 1.0**: Identified all major issues: AlarmScanner as concrete class instead of interface, public rules field in RuleEngine, silently swallowed exception, hardcoded SMTP and recipient in EmailNotifier, null return pattern, mutable state in scanner.
  **Score 0.75**: Identified 4-5 of the major issues with clear explanations.
  **Score 0.5**: Identified 2-3 issues but missed critical ones like swallowed exception or public field.
  **Score 0.25**: Identified only 1 obvious issue.
  **Score 0.0**: Failed to identify meaningful code issues.

  ### Criterion 2: Design Spec Alignment (Weight: 30%)
  **Score 1.0**: Thoroughly checked implementation against spec -- identified missing AlarmRepository, missing NotificationDispatcher interface (Strategy pattern), missing Builder pattern for Alarm, missing YAML configuration, missing Chain of Responsibility in RuleEngine.
  **Score 0.75**: Identified 3-4 missing components from the design spec.
  **Score 0.5**: Identified 1-2 missing components, incomplete gap analysis.
  **Score 0.25**: Vaguely mentioned some gaps without specifics.
  **Score 0.0**: Did not compare implementation against design spec.

  ### Criterion 3: Review Structure and Actionability (Weight: 25%)
  **Score 1.0**: Review is well-structured with severity classifications (CRITICAL/HIGH/MEDIUM/LOW), each finding has clear description, location, and actionable fix suggestion; organized by file or category.
  **Score 0.75**: Good structure with severity levels, most findings have actionable suggestions.
  **Score 0.5**: Has findings but lacks consistent structure or severity classification.
  **Score 0.25**: Unstructured list of observations without severity or clear suggestions.
  **Score 0.0**: No structured review output.

  ### Criterion 4: Clean Code Assessment (Weight: 15%)
  **Score 1.0**: Assessed code against clean code principles -- naming conventions, single responsibility, encapsulation, dependency injection, error handling patterns; provided specific examples from the code.
  **Score 0.75**: Good clean code assessment covering most principles with code references.
  **Score 0.5**: Mentioned some clean code concepts but without code-specific examples.
  **Score 0.25**: Superficial clean code commentary.
  **Score 0.0**: No clean code assessment.
