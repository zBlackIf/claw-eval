judge_rubric: "Reward defensive Android compatibility fixes: (1) Replace all lateinit vars with fallback-initialized properties using FallbackVersionEnforcer/NoOp patterns; (2) EncryptedSharedPreferences wrapped in try-catch with KeyStore cleanup retry and plain SharedPreferences fallback; (3) startForeground conditionally uses 3-arg (API 34+) vs 2-arg (older); (4) Screen capture APIs guarded with Build.VERSION.SDK_INT >= UPSIDE_DOWN_CAKE check and early return; (5) Manifest permissions protected with minSdkVersion or tools:ignore."

reference_solution: |
  1. HyperIsleApp.kt: Change `lateinit var versionEnforcer` to
     `var versionEnforcer: VersionEnforcer = FallbackVersionEnforcer() private set`
     Same for featureFlagRepository and premiumGate. Create FallbackVersionEnforcer
     that always returns Allowed.
  2. SecurePrefsManager.kt: Wrap EncryptedSharedPreferences.create in try-catch,
     on failure delete KeyStore entry and retry, on second failure return
     context.getSharedPreferences(name, MODE_PRIVATE) with logging.
  3. OverlayService.kt: if (SDK_INT >= UPSIDE_DOWN_CAKE) use 3-arg startForeground
     else use 2-arg startForeground(id, notification).
  4. OverlayScreenRecordingController.kt: Wrap registerScreenCaptureCallback in
     if (SDK_INT >= UPSIDE_DOWN_CAKE) with early return otherwise.
  5. AndroidManifest.xml: Add android:minSdkVersion="34" or tools:ignore on
     FOREGROUND_SERVICE_SPECIAL_USE and DETECT_SCREEN_* permissions.

