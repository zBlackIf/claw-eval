source_description: "Real session fixing HyperIsle2 app crashes on Android 9 (API 28) + Huawei EMUI devices. Core issues: lateinit fields crash when initialization fails, EncryptedSharedPreferences KeyStore failures on Huawei, unconditional use of API 34+ foreground service types, and missing API guards on screen capture callbacks."

services: []

prompt:
  text: |
    HyperIsle2 app 在 Android 9 (API 28) + 华为 EMUI 设备上频繁 crash。
    项目 compileSdk=36, minSdk=26。代码在 /workspace/fixtures/hyperisle-app/ 里。

    问题清单：
    1. HyperIsleApp 里 versionEnforcer / featureFlagRepository / premiumGate 用了
       lateinit，一旦 initializeFeatureControl() 抛异常就 crash。改成有 fallback
       默认值的方式，保证 MainActivity 读这些字段永远不会 UninitializedPropertyAccessException。
    2. SecurePrefsManager.createEncryptedPrefs() 在华为 KeyStore 出错时直接崩。
       加 try-catch + KeyStore 清理重试 + 最终降级到普通 SharedPreferences 的 fallback。
    3. OverlayService.startForeground() 无条件用了 API 34 才有的三参数版本，
       Android 9 上直接 crash。加 Build.VERSION.SDK_INT 判断。
    4. OverlayScreenRecordingController 使用了 API 34+ 才有的
       registerScreenCaptureCallback，低版本 crash。加 API guard + 早期 return。
    5. AndroidManifest.xml 里 FOREGROUND_SERVICE_SPECIAL_USE 和 DETECT_SCREEN_*
       权限没做版本保护。

    修好后保证在 API 28 设备上不崩。
