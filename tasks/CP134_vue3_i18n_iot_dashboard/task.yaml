judge_rubric: "Reward complete vue-i18n integration: createI18n with Composition API (legacy: false), browser language auto-detection with localStorage persistence, Chinese message pack with IoT-domain terms (dashboard/device/sensor/alert/monitor/control), English message pack, main.ts app.use(i18n) registration, Element Plus locale sync (el-config-provider or direct config), useLocale composable with switching + persistence, and template strings replaced with $t()."

reference_solution: |
  Under src/i18n/:
  - index.ts (createI18n with legacy: false, messages: {zh-CN, en-US},
    detectLocale() using navigator.language + localStorage fallback,
    saveLocale() for persistence, globalInjection: true)
  - locales/zh-CN.ts (nested keys for menu/dashboard/devices/alerts/etc)
  - locales/en-US.ts (matching English translations)

  Under src/hooks/:
  - useLocale.ts (wraps useI18n, provides changeLocale with
    localStorage persistence + dayjs sync, elementLocale computed
    referencing element-plus/es/locale/lang/*, toggleLocale cycle)

  Modified files:
  - main.ts: import i18n, app.use(i18n)
  - App.vue or DefaultLayout.vue: el-config-provider :locale="elementLocale"
  - DefaultLayout.vue: menu titles use $t('menu.dashboard') etc
  - Dashboard.vue: card labels use $t('dashboard.onlineDevices') etc
  - package.json: add "vue-i18n": "^9.x" to dependencies

primary_dimensions: [completion, communication, safety]
